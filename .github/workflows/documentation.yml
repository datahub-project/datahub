name: documentation

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/documentation.yml"
      - "metadata-ingestion/**"
      - "metadata-models/**"
      - "docs/**"
      - "docs-website/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/documentation.yml"
      - "metadata-ingestion/**"
      - "metadata-models/**"
      - "docs/**"
      - "docs-website/**"
  # release:
  #   types: [published, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gh-pages:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # We explicitly don't use acryldata/sane-checkout-action because docusaurus runs
      # git commands to determine the last change date for each file.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "temurin"
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      # Restore-only: ci-cache-warmup.yml warm-metadata-ingestion-uv-cache writes this
      # key on both cache backends from every default-branch push.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('metadata-ingestion/setup.py', 'metadata-ingestion/pyproject.toml', 'metadata-ingestion/uv.lock', 'metadata-ingestion/constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      # docs-website:build runs yarnInstall for docs-website. Restore-only; the
      # writer is ci-cache-warmup.yml warm-docs-website-yarn-cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yarn
          key: docs-website-${{ runner.os }}-yarn-${{ hashFiles('docs-website/yarn.lock') }}
          restore-keys: |
            docs-website-${{ runner.os }}-yarn-
      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror
      - name: Install Python dependencies
        run: ./metadata-ingestion/scripts/install_deps.sh
      - name: Run tests
        run: |
          ./gradlew --info :metadata-ingestion:testScripts
          ./gradlew --info :docs-website:testPythonScripts
      - name: Report test results
        if: (!cancelled())
        uses: ./.github/actions/report-test-results
        with:
          artifact-name: metadata-ingestion-scripts-test-results
          test-results-paths: "metadata-ingestion/scripts/test-results/**"
          junit-file-globs: "metadata-ingestion/scripts/test-results/*.xml"
      - name: Report docs-website script test results
        if: (!cancelled())
        uses: ./.github/actions/report-test-results
        with:
          artifact-name: docs-website-scripts-test-results
          test-results-paths: "docs-website/sphinx/test-results/**"
          junit-file-globs: "docs-website/sphinx/test-results/*.xml"
      - name: Build Docs
        run: |
          ./gradlew --info docs-website:build

      - name: Deploy
        if: github.event_name == 'push' && github.repository == 'datahub-project/datahub'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-website/build
          cname: datahubproject.io
          # The gh-pages branch stores the built docs site. We don't need to preserve
          # the full history of the .html files, since they're generated from our
          # source files. Doing so significantly reduces the size of the repo's .git dir.
          force_orphan: true
