name: "GMS-lite Local Stack"

# Boots the Docker-free local dev stack (`datahub-dev.sh start --local`) and drives it through the
# worktree's CLI profile: GraphQL, a write that must reach search, warm restart and nuke.
# Then boots Vite lite mode and checks data flows, native signup and browser login to the home page.

on:
  pull_request:
    paths:
      - "gradle.properties"
      - "smoke-test/env/**"
      - "smoke-test/check_env_parity.py"
      - "smoke-test/env-parity-allowlist.txt"
      - "smoke-test/tests/unit/test_check_env_parity.py"
      - "smoke-test/run-quickstart.sh"
      - "smoke-test/smoke.*.env"
      - ".github/workflows/docker-unified.yml"
      - "docker/profiles/**"
      - "docker/datahub-gms/env/**"
      - "metadata-service/gms-lite/**"
      - "metadata-service/opensearch-embedded/**"
      - "metadata-service/war/**"
      - "metadata-service/auth-config/**"
      - "metadata-service/auth-filter/**"
      - "metadata-service/configuration/**"
      - "datahub-upgrade/**"
      - "scripts/dev/datahub-dev.sh"
      - "scripts/dev/datahub_dev.py"
      - "scripts/dev/*.py"
      - "scripts/dev/extensions/**"
      - "scripts/dev/local/**"
      - "env/**"
      - "scripts/dev/tests/**"
      - "scripts/dev/tests/local_frontend_e2e.sh"
      - "datahub-web-react/devtools/**"
      - "datahub-web-react/vite.config.*"
      - "datahub-web-react/build.gradle"
      - "datahub-web-react/package.json"
      - "datahub-web-react/yarn.lock"
      - "e2e-test/ui/playwright/**"
      - "smoke-test/build.gradle"
      - "smoke-test/conftest.py"
      - "smoke-test/requirements.txt"
      - "smoke-test/tests/e2e/conftest.py"
      - "smoke-test/tests/e2e/utils.py"
      - "smoke-test/utilities/**"
      - "smoke-test/tests/e2e/search/test_search_projection.py"
      - "smoke-test/tests/e2e/lineage/test_lineage_sdk.py"
      - "smoke-test/tests/e2e/authorization/test_self_entity_auth.py"
      - "smoke-test/tests/e2e/privileges/utils.py"
      - "metadata-ingestion/src/datahub/cli/_profile_store.py"
      - "metadata-ingestion/src/datahub/cli/config_utils.py"
      - "metadata-ingestion/src/datahub/cli/profile_cli.py"
      - ".github/workflows/gms-lite-local-stack.yml"
      - "smoke-test/utilities/backends.py"
      - "smoke-test/utilities/backend_plugin.py"
      - ".github/scripts/check_local_lane_selection.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-stack:
    name: "Local stack lifecycle (OpenSearch ${{ matrix.opensearch }})"
    strategy:
      fail-fast: false
      matrix:
        opensearch: ["2", "3"]
    env:
      # Smoke tests below run on the Docker-free stack: deselect what it
      # cannot run, and stop if GMS turns out not to be the local stack.
      SMOKE_BACKEND: local
      EMBEDDED_OPENSEARCH_VERSION: ${{ matrix.opensearch }}
    runs-on: ${{ vars.DEPOT_PROJECT_ID != '' && !github.event.pull_request.head.repo.fork && 'depot-ubuntu-24.04' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read embedded OpenSearch default
        id: opensearch_default
        run: echo "major=$(sed -n 's/^embeddedOpenSearchDefault=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('datahub-web-react/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yarn
          key: playwright-${{ runner.os }}-yarn-${{ hashFiles('./e2e-test/ui/playwright/package.json', './e2e-test/ui/playwright/yarn.lock') }}
          restore-keys: playwright-${{ runner.os }}-yarn-

      - name: Build jars and the embedded OpenSearch node
        run: |
          ./gradlew \
            :metadata-service:war:bootJar \
            :datahub-upgrade:bootJar \
            :metadata-service:opensearch-embedded:installDist \
            -x test

      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror

      - name: Install native dependencies for the CLI
        run: ./metadata-ingestion/scripts/install_deps.sh

      - name: Install CLI dependencies
        run: ./gradlew :metadata-ingestion:installDev

      - name: Install smoke-test and frontend dependencies
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        run: ./gradlew :smoke-test:installDev :datahub-web-react:yarnInstall

      - name: Check the local lane selection
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        working-directory: smoke-test
        run: ../.github/scripts/check_local_lane_selection.sh

      - name: Install Playwright dependencies
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        working-directory: e2e-test/ui/playwright
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: Measure a lean local boot
        env:
          GMS_LITE_HEAP: "2g"
          GMS_LITE_OPENSEARCH_READY_TIMEOUT: "240"
          GMS_LITE_GMS_HEALTH_TIMEOUT: "240"
          DATAHUB_TELEMETRY_ENABLED: "false"
        run: scripts/dev/datahub-dev.sh start --local --fresh --skip-build --no-frontend --timeout 600

      - name: Boot timings
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import pathlib
          import shutil

          root = pathlib.Path.home() / ".datahub/local/stacks"
          # Preserve diagnostics before lifecycle tests nuke the stack. Discovery holds secrets.
          for path in root.glob("*"):
              destination = pathlib.Path("build/lean-boot") / path.name
              files = [path / "timings.json", path / "launcher.log", *path.glob("logs/*.log")]
              for source in files:
                  if source.is_file():
                      target = destination / source.relative_to(path)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
          paths = sorted(root.glob("*/timings.json"), key=lambda p: p.stat().st_mtime)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if not paths:
                  summary.write("No timings.json produced.\n")
                  raise SystemExit(1)
              for path in paths:
                  timings = json.loads(path.read_text())
                  summary.write("### GMS-lite boot timings\n\n| Phase | Seconds |\n| --- | ---: |\n")
                  for name, seconds in timings.get("phases", {}).items():
                      summary.write(f"| {name} | {seconds:.1f} |\n")
                  summary.write(f"| total | {timings['total_s']:.1f} |\n")
                  for name, seconds in timings.get("datahub_dev", {}).items():
                      summary.write(f"| datahub-dev: {name.removesuffix('_s')} | {seconds:.1f} |\n")
                  summary.write(f"\nwarm: {timings['warm']}\n")
          PYEOF

      - name: Remove the lean stack before lifecycle checks
        if: always()
        run: scripts/dev/datahub-dev.sh nuke

      - name: Start, use, restart and nuke the local stack
        env:
          LOCAL_STACK_OPENSEARCH: ${{ matrix.opensearch }}
          DATAHUB_TELEMETRY_ENABLED: "false"
        run: scripts/dev/tests/local_stack_e2e.sh

      - name: Start the local stack with Vite lite mode
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        env:
          # Smoke tests under xdist evict the entity graph cache at 1 GB.
          GMS_LITE_HEAP: "2g"
          DATAHUB_TELEMETRY_ENABLED: "false"
        run: scripts/dev/datahub-dev.sh start --local --fresh --frontend --job smoke-test

      - name: Env parity with the Docker quickstart (report only)
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        # Report only until the allowlist has held on master; the step summary shows the result.
        continue-on-error: true
        run: |
          status=0
          python3 smoke-test/check_env_parity.py --report build/env-parity.txt > /dev/null || status=$?
          {
            echo "### Smoke env parity (Docker quickstart vs Docker-free)"
            echo '```'
            sed '/^Allowed differences:/,$d' build/env-parity.txt 2>/dev/null || echo "The check failed before writing a report."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Run search, lineage and self-service profile smoke tests
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        run: scripts/dev/tests/local_frontend_e2e.sh smoke

      - name: Log in through Vite and render the home page in Chromium
        if: matrix.opensearch == steps.opensearch_default.outputs.major
        run: scripts/dev/tests/local_frontend_e2e.sh browser

      - name: Stop the shared OpenSearch node
        if: always()
        run: |
          scripts/dev/datahub-dev.sh stop || true
          python3 metadata-service/gms-lite/bin/_opensearch_manager.py \
            stop --dir ~/.datahub/local/opensearch-${{ matrix.opensearch }} || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gms-lite-local-stack-logs-os${{ matrix.opensearch }}
          path: |
            build/lean-boot/
            build/env-parity.txt
            ~/.datahub/local/stacks/*/resolved-env.json
            ~/.datahub/local/stacks/*/timings.json
            ~/.datahub/local/stacks/*/launcher.log
            ~/.datahub/local/stacks/*/frontend.log
            ~/.datahub/local/stacks/*/logs/
            ~/.datahub/local/opensearch-${{ matrix.opensearch }}/log
            smoke-test/build/local-stack-smoke.xml
            e2e-test/ui/playwright/test-results/
            e2e-test/ui/playwright/diagnostics/
          retention-days: 3
