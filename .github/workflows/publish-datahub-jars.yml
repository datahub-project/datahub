name: Publish Datahub Java Jars (Client, Spark Lineage, Protobuf, Auth API)

# GA releases (non-prerelease) publish to Maven Central as one Central Portal deployment for the
# main jars plus one for the java8 datahub-client build, via JReleaser (gradle/publishing/jreleaser.gradle).
# Prereleases (RCs) are not published.
#
# A manual run with a `tag` input publishes that tag from any ref (e.g. master) with the current workflow file,
# building the tag's code. publisher=jreleaser only works for tags cut after the JReleaser setup was added (older
# tags have no JReleaser config); use publisher=nexus-staging for older tags.
on:
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      publisher:
        description: >-
          jreleaser: publish the given tag as one Central Portal deployment (requires a tag). nexus-staging (temporary
          fallback): with a tag, the legacy per-module release (publish + closeAndReleaseRepository) of that tag;
          without a tag, the snapshot steps. Release events always use the JReleaser jobs.
        type: choice
        options:
          - jreleaser
          - nexus-staging
        default: jreleaser
      tag:
        description: >-
          The release tag to publish, e.g. 1.7.0.21 (a leading v is stripped); the build checks out refs/tags/v<tag>.
          Required for publisher=jreleaser; leave empty with publisher=nexus-staging for the snapshot behaviour.
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-secret:
    runs-on: ubuntu-24.04
    outputs:
      publish-enabled: ${{ steps.publish-enabled.outputs.publish }}
    steps:
      - id: publish-enabled
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [[ "${{ github.repository }}" == "acryldata/datahub" ]]; then
            echo "Enable publish for main repository: ${{ env.SIGNING_KEY != '' }}"
            echo "publish=${{ env.SIGNING_KEY != '' }}" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping publish for repository: ${{ github.repository }}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
  setup:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        # Explicitly checkout head commit, as tag computation depends on it
        with:
          checkout-head-only: true

      - name: Compute Tag
        id: tag
        env:
          GITHUB_REF_FALLBACK: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          source .github/scripts/docker_helpers.sh
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="${INPUT_TAG#v}"
            # The tag is used in later run scripts and as a checkout ref, so only allow version-like characters.
            if [[ ! "$TAG" =~ ^[0-9A-Za-z._-]+$ ]]; then
              echo "::error::Invalid tag input '$INPUT_TAG': expected a version like 1.7.0.21"
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$TAG" > /dev/null; then
              echo "::error::Tag v$TAG does not exist in $GITHUB_REPOSITORY"
              exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    needs: ["check-secret", "setup"]
    if: ${{ needs.check-secret.outputs.publish-enabled == 'true' && ((github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.publisher == 'jreleaser' && inputs.tag != '')) }}
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        with:
          # A manual run with a `tag` input builds the tag's code; otherwise the default checkout.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/v{0}', needs.setup.outputs.tag) || '' }}
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle-home-cache-excludes: ""
      - name: stage release jars for Central Portal
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} \
            :metadata-integration:java:datahub-client:publishAllPublicationsToCentralStagingRepository \
            :metadata-integration:java:acryl-spark-lineage:publishAllPublicationsToCentralStagingRepository \
            :metadata-integration:java:datahub-protobuf:publishAllPublicationsToCentralStagingRepository \
            :metadata-auth:auth-api:publishAllPublicationsToCentralStagingRepository \
            :metadata-integration:java:custom-plugin-lib:publishAllPublicationsToCentralStagingRepository
          # Central only requires .md5/.sha1 checksums; drop the optional sha256/sha512 ones to reduce file count.
          find build/central-staging -type f \( -name '*.sha256' -o -name '*.sha512' \) -delete
          find build/central-staging -type f | sort
          du -sh build/central-staging
      - name: deploy release jars to Central Portal (single deployment)
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        # JReleaser reads the whole bundle (~535 MB) into memory and buffers the multipart request again,
        # so the default -Xmx2g daemon heap is not enough for the upload. Stop the 2g daemon left by the
        # stage step first, as gradle.properties documents for a direct org.gradle.jvmargs override.
        run: |
          ./gradlew --stop
          ./gradlew -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=384m" -PreleaseVersion=${{ needs.setup.outputs.tag }} jreleaserDeploy
  # Runs in parallel with `publish`: datahub-client-java8 is its own artifactId and its own Central Portal
  # deployment (tracked by deployment id), so it neither waits for nor blocks the main bundle, and a failed
  # one can be re-run on its own. (The nexus-staging jobs below must stay sequential, see #12120.)
  publish-java8:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    needs: ["check-secret", "setup"]
    if: ${{ needs.check-secret.outputs.publish-enabled == 'true' && ((github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.publisher == 'jreleaser' && inputs.tag != '')) }}
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        with:
          # A manual run with a `tag` input builds the tag's code; otherwise the default checkout.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/v{0}', needs.setup.outputs.tag) || '' }}
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle-home-cache-excludes: ""
      # Separate job and runner, so its own build/central-staging and its own Central Portal deployment.
      - name: stage release java8 jar for Central Portal
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-integration:java:datahub-client:publishAllPublicationsToCentralStagingRepository -PjavaClassVersionDefault=8 -ParchiveAppendix=java8
          # Central only requires .md5/.sha1 checksums; drop the optional sha256/sha512 ones to reduce file count.
          find build/central-staging -type f \( -name '*.sha256' -o -name '*.sha512' \) -delete
          find build/central-staging -type f | sort
          du -sh build/central-staging
      - name: deploy release java8 jar to Central Portal (single deployment)
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} jreleaserDeploy -PjavaClassVersionDefault=8 -ParchiveAppendix=java8
  # Temporary fallback, run only by a manual `workflow_dispatch` with publisher=nexus-staging:
  # - with a `tag`: the legacy per-module release (publish + closeAndReleaseRepository, one Central Portal
  #   deployment per module) of that tag;
  # - without a `tag`: the snapshot steps.
  # Delete both *-nexus-staging jobs, together with the nexus-staging plugin, once the JReleaser jobs above have
  # been proven over a few releases. Snapshot publishing goes away with them unless it is fixed separately.
  # Known issues with snapshot publishing, intentionally left as is for now:
  # - these jobs need `setup`, which is skipped on non-tag refs without a `tag` input, so the snapshot steps only
  #   run when dispatched from a tag ref;
  # - the modules' OSSRH snapshot URL (ossrh-staging-api.central.sonatype.com/content/repositories/snapshots/)
  #   returns 400. Central Portal snapshots live at https://central.sonatype.com/repository/maven-snapshots/
  #   and must be enabled per namespace.
  publish-nexus-staging:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    needs: ["check-secret", "setup"]
    if: ${{ needs.check-secret.outputs.publish-enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.publisher == 'nexus-staging' }}
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        with:
          # A manual run with a `tag` input builds the tag's code; otherwise the default checkout.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/v{0}', needs.setup.outputs.tag) || '' }}
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle-home-cache-excludes: ""
      - name: checkout upstream repo
        run: |
          git remote add upstream https://github.com/datahub-project/datahub.git
          git fetch upstream --tags --force --filter=tree:0
      - name: publish datahub-client jar snapshot
        if: ${{ inputs.tag == '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew :metadata-integration:java:datahub-client:printVersion
          ./gradlew :metadata-integration:java:datahub-client:publish
      - name: release datahub-client jar
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-integration:java:datahub-client:publish
          ./gradlew :metadata-integration:java:datahub-client:closeAndReleaseRepository --info
      - name: publish datahub-spark-lineage snapshot jar
        if: ${{ inputs.tag == '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew :metadata-integration:java:acryl-spark-lineage:printVersion
          ./gradlew :metadata-integration:java:acryl-spark-lineage:publish
      - name: release datahub-spark-lineage jar
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-integration:java:acryl-spark-lineage:publish
          ./gradlew :metadata-integration:java:acryl-spark-lineage:closeAndReleaseRepository --info
      - name: publish datahub-protobuf snapshot jar
        if: ${{ inputs.tag == '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew :metadata-integration:java:datahub-protobuf:printVersion
          ./gradlew :metadata-integration:java:datahub-protobuf:publish
      - name: release datahub-protobuf jar
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-integration:java:datahub-protobuf:publish
          ./gradlew :metadata-integration:java:datahub-protobuf:closeAndReleaseRepository --info
      - name: publish datahub-auth-api snapshot jar
        if: ${{ inputs.tag == '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew :metadata-auth:auth-api:printVersion
          ./gradlew :metadata-auth:auth-api:publish
      - name: release datahub-auth-api jar
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-auth:auth-api:publish
          ./gradlew :metadata-auth:auth-api:closeAndReleaseRepository --info
      - name: publish datahub-custom-plugin-lib snapshot jar
        if: ${{ inputs.tag == '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew :metadata-integration:java:custom-plugin-lib:printVersion
          ./gradlew :metadata-integration:java:custom-plugin-lib:publish
      - name: release datahub-custom-plugin-lib jar
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-integration:java:custom-plugin-lib:publish
          ./gradlew :metadata-integration:java:custom-plugin-lib:closeAndReleaseRepository --info
  publish-java8-nexus-staging:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    needs: ["check-secret", "setup", "publish-nexus-staging"]
    if: ${{ needs.check-secret.outputs.publish-enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.publisher == 'nexus-staging' }}
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        with:
          # A manual run with a `tag` input builds the tag's code; otherwise the default checkout.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') && format('refs/tags/v{0}', needs.setup.outputs.tag) || '' }}
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle-home-cache-excludes: ""
      - name: checkout upstream repo
        run: |
          git remote add upstream https://github.com/datahub-project/datahub.git
          git fetch upstream --tags --force --filter=tree:0
      - name: publish datahub-client jar snapshot
        if: ${{ inputs.tag == '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew :metadata-integration:java:datahub-client:printVersion -PjavaClassVersionDefault=8 -ParchiveAppendix=java8
          ./gradlew :metadata-integration:java:datahub-client:publish -PjavaClassVersionDefault=8 -ParchiveAppendix=java8
      - name: release datahub-client jar
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "signingKey=$SIGNING_KEY" >> gradle.properties
          ./gradlew -PreleaseVersion=${{ needs.setup.outputs.tag }} :metadata-integration:java:datahub-client:publish -PjavaClassVersionDefault=8 -ParchiveAppendix=java8
          ./gradlew :metadata-integration:java:datahub-client:closeAndReleaseRepository --info -PjavaClassVersionDefault=8 -ParchiveAppendix=java8
