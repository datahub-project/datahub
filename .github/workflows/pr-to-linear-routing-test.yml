            TEAM_KEY=OSS
          fi

          TEAM_CONFIG=$(echo "$LINEAR_TEAM_CONFIG" | jq --arg key "$TEAM_KEY" '.[] | select(.key == $key)')
          if [ -z "$TEAM_CONFIG" ]; then
