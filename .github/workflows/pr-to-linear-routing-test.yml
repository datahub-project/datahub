              echo "team_id=$(echo "$TEAM_CONFIG" | jq -r '.team_id')"
              echo "assignee_id=$(echo "$TEAM_CONFIG" | jq -r '.assignee_id')"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

