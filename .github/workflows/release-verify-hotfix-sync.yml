name: Release Process - Verify Hotfix Sync

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without 'v' prefix (e.g. 1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Release version without 'v' prefix (e.g. 1.0.0)"
        required: true
        type: string

permissions: {}

jobs:
  verify_sync:
    name: Verify hotfix branch is in sync with release branch
    runs-on: depot-ubuntu-24.04-small
    permissions:
      contents: read
    steps:
      - name: Check out scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Check hotfix sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release/check_hotfix_sync.py \
            --version "${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
