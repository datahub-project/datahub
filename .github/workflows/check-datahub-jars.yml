name: Check Datahub Jars

on:
  push:
    branches:
      - master
      - releases/**
    paths:
      - "metadata-integration/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "metadata-integration/**"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check_jars:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        command: ["datahub-client", "datahub-protobuf", "acryl-spark-lineage"]
    runs-on: ubuntu-24.04
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      # Restore-only: ci-cache-warmup.yml warm-metadata-ingestion-uv-cache writes this
      # key on both cache backends from every default-branch push.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('metadata-ingestion/setup.py', 'metadata-ingestion/pyproject.toml', 'metadata-ingestion/uv.lock', 'metadata-ingestion/constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror
      - name: Install dependencies
        run: ./metadata-ingestion/scripts/install_deps.sh
      - name: check ${{ matrix.command }} jar
        run: |
          ./gradlew :metadata-integration:java:${{ matrix.command }}:build --info
          ./gradlew :metadata-integration:java:${{ matrix.command }}:checkShadowJar
          ./gradlew :metadata-integration:java:${{ matrix.command }}:javadoc
