name: Check Datahub Jars

on:
  push:
    branches:
      - master
      - releases/**
    paths:
      - "metadata-integration/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "metadata-integration/**"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check_jars:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        command: ["datahub-client", "datahub-protobuf", "acryl-spark-lineage"]
    runs-on: ubuntu-latest
    steps:
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.10"
      # Restore always; save only from master (below) so PR runs stop minting per-PR
      # copies of this shared key. Key hashes the manifests that actually determine the
      # uv cache contents — the old '**/requirements.txt' matched 13 unrelated files and
      # none of them. With max-parallel: 1, the first matrix leg saves and later legs
      # exact-hit, so the cache-hit guard on the save prevents duplicate writes.
      - uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: uv-cache
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('metadata-ingestion/setup.py', 'metadata-ingestion/pyproject.toml', 'metadata-ingestion/uv.lock', 'metadata-ingestion/constraints.txt', 'metadata-ingestion/build-constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror
      - name: Install dependencies
        run: ./metadata-ingestion/scripts/install_deps.sh
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "temurin"
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: check ${{ matrix.command }} jar
        run: |
          ./gradlew :metadata-integration:java:${{ matrix.command }}:build --info
          ./gradlew :metadata-integration:java:${{ matrix.command }}:checkShadowJar
          ./gradlew :metadata-integration:java:${{ matrix.command }}:javadoc
      # Success-only: a partial cache from a failed run would occupy the exact key
      # until the manifests next change; the next master push retries instead.
      - name: Save uv cache (master only)
        if: github.ref == 'refs/heads/master' && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('metadata-ingestion/setup.py', 'metadata-ingestion/pyproject.toml', 'metadata-ingestion/uv.lock', 'metadata-ingestion/constraints.txt', 'metadata-ingestion/build-constraints.txt') }}
