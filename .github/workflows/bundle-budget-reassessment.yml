name: Bundle budget reassessment

# Catalog chore: after the nightly build & test frontend-build uploads budget
# findings + a measured inventory snapshot, this small job classifies the
# result and opens a PR only when baselines should ratchet down. Soft overages
# are reported (never auto-raised). Hard cliffs already fail frontend-build, so
# this workflow only runs on successful scheduled builds.
# See datahub-web-react/AGENTS.md (Bundle size budgets).
#
# Ratchet PRs need a token that can trigger workflow runs on the new PR. Set
# repo secret BUNDLE_BUDGET_PR_TOKEN to a classic PAT or GitHub App installation
# token with contents + pull-requests. Falling back to github.token creates the
# PR but does not start required checks (Actions → GITHUB_TOKEN limitation).

on:
  workflow_run:
    workflows:
      - "build & test"
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "build & test run id that uploaded bundle-budget-artifacts (default: latest successful scheduled run)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bundle-budget-reassessment
  cancel-in-progress: true

jobs:
  reassess:
    if: |
      github.repository == 'datahub-project/datahub' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        )
      )
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out master
        uses: actions/checkout@v5
        with:
          ref: master
          # Prefer a bot PAT so the ratchet PR receives CI; github.token will not.
          token: ${{ secrets.BUNDLE_BUDGET_PR_TOKEN || github.token }}

      - name: Skip when a ratchet PR is already open
        id: skip
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_BUDGET_PR_TOKEN || github.token }}
        run: |
          BRANCH="chore/bundle-budget-ratchet"
          existing=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Open ratchet PR #$existing already exists — skipping reassessment to avoid stacking."
            {
              echo "### Bundle budget reassessment"
              echo ""
              echo "Skipped: open ratchet PR #$existing (\`$BRANCH\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source build & test run
        if: steps.skip.outputs.skip != 'true'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$INPUT_RUN_ID" ]; then
            echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_id=$(gh run list --workflow "build & test" --event schedule --branch master --status success --limit 20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "No successful scheduled build & test run found to pull bundle-budget-artifacts from."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download bundle budget artifacts
        if: steps.skip.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-budget-artifacts
          path: /tmp/bundle-budget-artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage findings next to the package
        if: steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p datahub-web-react/dist
          for f in eager-budget-findings.json page-budget-findings.json eager-budget-report.json; do
            if [ ! -f "/tmp/bundle-budget-artifacts/$f" ]; then
              echo "Missing $f in bundle-budget-artifacts from run ${{ steps.source.outputs.run_id }}"
              ls -la /tmp/bundle-budget-artifacts || true
              exit 1
            fi
            cp "/tmp/bundle-budget-artifacts/$f" "datahub-web-react/dist/$f"
          done

      - name: Classify budgets
        if: steps.skip.outputs.skip != 'true'
        id: budgets
        run: |
          if ! node datahub-web-react/scripts/bundle-budget-chore.mjs > "$RUNNER_TEMP/chore.json"; then
            echo "bundle-budget-chore.mjs failed before writing a decision."
            cat "$RUNNER_TEMP/chore.json" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/chore.json" ]; then
            echo "bundle-budget-chore.mjs produced an empty decision file."
            exit 1
          fi
          cat "$RUNNER_TEMP/chore.json"
          if ! decision=$(node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!s.decision) throw new Error('missing decision'); process.stdout.write(s.decision)" "$RUNNER_TEMP/chore.json"); then
            echo "Could not parse decision from chore.json:"
            cat "$RUNNER_TEMP/chore.json"
            exit 1
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          {
            echo "### Bundle budget reassessment"
            echo ""
            echo "Source build & test run: \`${{ steps.source.outputs.run_id }}\`"
            echo ""
            echo "Decision: \`$decision\`"
            echo ""
            if [ -f /tmp/bundle-budget-artifacts/eager-regression.md ]; then
              cat /tmp/bundle-budget-artifacts/eager-regression.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$decision" = "hard" ]; then
            exit 1
          fi

      - name: Ratchet baselines down
        id: ratchet
        if: steps.skip.outputs.skip != 'true' && steps.budgets.outputs.decision == 'ratchet-down'
        run: |
          node datahub-web-react/scripts/bundle-budget-chore.mjs --apply > "$RUNNER_TEMP/ratchet.json"
          cat "$RUNNER_TEMP/ratchet.json"
          changed=$(node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); process.stdout.write(String(Boolean(s.applied && s.applied.changed)))" "$RUNNER_TEMP/ratchet.json")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" != "true" ]; then
            echo "Decision was ratchet-down but no ceiling actually lowered (measured fields were not under baseline)."
            exit 0
          fi
          if [ ! -f /tmp/bundle-budget-artifacts/eager-budget-inventory-measured.json ]; then
            echo "Missing eager-budget-inventory-measured.json from the nightly artifact; cannot refresh inventory without rebuilding dist."
            exit 1
          fi
          cp /tmp/bundle-budget-artifacts/eager-budget-inventory-measured.json \
            datahub-web-react/eager-budget-inventory.json

      - name: Open or update ratchet PR
        if: steps.skip.outputs.skip != 'true' && steps.budgets.outputs.decision == 'ratchet-down' && steps.ratchet.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUNDLE_BUDGET_PR_TOKEN || github.token }}
          BOT_TOKEN_CONFIGURED: ${{ secrets.BUNDLE_BUDGET_PR_TOKEN != '' }}
        run: |
          if [ "$BOT_TOKEN_CONFIGURED" != "true" ]; then
            echo "::warning title=Bundle budget::BUNDLE_BUDGET_PR_TOKEN is unset. The ratchet PR will use github.token and will not trigger required CI checks. Add a PAT or GitHub App token secret to fix that."
          fi
          BRANCH="chore/bundle-budget-ratchet"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add datahub-web-react/eager-budget.json \
            datahub-web-react/page-budget.json \
            datahub-web-react/eager-budget-inventory.json
          if git diff --cached --quiet; then
            echo "Nothing to commit after ratchet."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          chore(ui): ratchet frontend bundle budgets down to measured master

          Nightly reassessment found measured gzip under committed baselines.
          Lower only the ceilings that shrank and refresh the inventory snapshot.
          EOF
          )"
          git push -u origin "$BRANCH" --force-with-lease
          existing=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updated existing ratchet PR #$existing"
            gh pr edit "$existing" --title "chore(ui): ratchet frontend bundle budgets down" --body "$(cat <<'EOF'
          ## Summary

          Bundle-budget reassessment (from the nightly `build & test` artifact)
          found measured master gzip under the committed baselines. This PR only
          **lowers** fields in `eager-budget.json` / `page-budget.json` (never
          raises a field that grew within slack) and refreshes
          `eager-budget-inventory.json`.

          Soft overages are never auto-raised — those need an explicit Catalog
          chore PR (see `datahub-web-react/AGENTS.md`).

          ## Checklist

          - [x] Contributing Guideline / PR title format
          - [x] Tests N/A (baseline JSON only)
          - [x] Docs N/A
          EOF
          )"
          else
            gh pr create \
              --title "chore(ui): ratchet frontend bundle budgets down" \
              --body "$(cat <<'EOF'
          ## Summary

          Bundle-budget reassessment (from the nightly `build & test` artifact)
          found measured master gzip under the committed baselines. This PR only
          **lowers** fields in `eager-budget.json` / `page-budget.json` (never
          raises a field that grew within slack) and refreshes
          `eager-budget-inventory.json`.

          Soft overages are never auto-raised — those need an explicit Catalog
          chore PR (see `datahub-web-react/AGENTS.md`).

          ## Checklist

          - [x] Contributing Guideline / PR title format
          - [x] Tests N/A (baseline JSON only)
          - [x] Docs N/A
          EOF
          )" \
              --base master \
              --head "$BRANCH"
          fi
