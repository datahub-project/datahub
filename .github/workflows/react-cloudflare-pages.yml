name: Frontend Preview
on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
      - "!.github/workflows/react-cloudflare-pages.yml"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
      - "!.github/workflows/react-cloudflare-pages.yml"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      frontend_change: ${{ steps.ci-optimize.outputs.frontend-change == 'true' }}
      cloudflare_token_available: ${{ steps.cloudflare-token-check.outputs.cloudflare_token_available }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - uses: ./.github/actions/ci-optimization
        id: ci-optimize
      - name: Check if cloudflare api token is available
        id: cloudflare-token-check
        env:
          API_TOKEN_AVAILABLE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "API_TOKEN_AVAILABLE is : ${{ env.API_TOKEN_AVAILABLE }}"
          echo "cloudflare_token_available=${{ env.API_TOKEN_AVAILABLE }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 30
    needs: setup
    if: ${{ github.event.pull_request.head.repo.fork != 'true' }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "zulu"
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Gradle build for frontend
        if: ${{ needs.setup.outputs.frontend_change == 'true' }}
        run: |
          ./gradlew :datahub-web-react:build -x test -x check --parallel
      # pages-action is unpublished (repo 404); Cloudflare's replacement is wrangler-action.
      # Do not pass gitHubToken: wrangler-action names GitHub Deployments "preview"/"production",
      # which broke Meticulous (it listens for datahub-project-web-react). Record that
      # environment ourselves after a successful Pages upload.
      - name: Publish
        id: cloudflare
        if: ${{ needs.setup.outputs.frontend_change == 'true' && needs.setup.outputs.cloudflare_token_available == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: datahub-web-react
          command: pages deploy dist --project-name=datahub-project-web-react
      - name: Record GitHub Deployment
        if: ${{ needs.setup.outputs.frontend_change == 'true' && needs.setup.outputs.cloudflare_token_available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PRODUCTION: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'release') }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL}" ]; then
            echo "::error::wrangler-action did not output deployment-url"
            exit 1
          fi
          if [ "${IS_PRODUCTION}" = "true" ]; then
            TRANSIENT=false
            PRODUCTION=true
          else
            TRANSIENT=true
            PRODUCTION=false
          fi
          DEPLOY_ID=$(jq -nc \
            --arg ref "$REF" \
            --arg desc "Cloudflare Pages frontend preview" \
            --argjson transient "$TRANSIENT" \
            --argjson production "$PRODUCTION" \
            '{
              ref: $ref,
              environment: "datahub-project-web-react",
              description: $desc,
              auto_merge: false,
              required_contexts: [],
              transient_environment: $transient,
              production_environment: $production
            }' | gh api --method POST "/repos/${REPO}/deployments" --input - --jq '.id')
          jq -nc \
            --arg url "$DEPLOY_URL" \
            --arg log "${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              state: "success",
              environment: "datahub-project-web-react",
              environment_url: $url,
              log_url: $log,
              description: "Cloudflare Pages frontend preview"
            }' | gh api --method POST "/repos/${REPO}/deployments/${DEPLOY_ID}/statuses" --input - >/dev/null
          echo "Created GitHub Deployment ${DEPLOY_ID} -> ${DEPLOY_URL}"
