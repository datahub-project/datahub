name: Frontend Preview
on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/react-cloudflare-pages.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/react-cloudflare-pages.yml"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      frontend_change: ${{ steps.ci-optimize.outputs.frontend-change == 'true' }}
      cloudflare_token_available: ${{ steps.cloudflare-token-check.outputs.cloudflare_token_available }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - uses: ./.github/actions/ci-optimization
        id: ci-optimize
      - name: Check if cloudflare api token is available
        id: cloudflare-token-check
        env:
          API_TOKEN_AVAILABLE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "API_TOKEN_AVAILABLE is : ${{ env.API_TOKEN_AVAILABLE }}"
          echo "cloudflare_token_available=${{ env.API_TOKEN_AVAILABLE }}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    timeout-minutes: 45
    needs: setup
    if: ${{ github.event.pull_request.head.repo.fork != 'true' }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "temurin"
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Gradle build for frontend
        if: ${{ needs.setup.outputs.frontend_change == 'true' }}
        run: |
          ./gradlew :datahub-web-react:build -Psourcemap -x test -x check --parallel
      - name: Check sourcemap sizes against Cloudflare limit
        # Must run immediately after the -Psourcemap build and BEFORE "Report initial JS bundle
        # size", which rebuilds dist/ from the base commit without sourcemaps and would wipe the
        # maps this step inspects. See .github/scripts/check_sourcemap_sizes.py for why the limit
        # matters (a rejected map silently breaks the Meticulous preview deploy — the reason
        # -Psourcemap was hotfix-removed once).
        if: ${{ needs.setup.outputs.frontend_change == 'true' }}
        run: python3 .github/scripts/check_sourcemap_sizes.py datahub-web-react/dist/assets/*.map
      # pages-action is unpublished (repo 404); Cloudflare's replacement is wrangler-action.
      # Do not pass gitHubToken: wrangler-action names GitHub Deployments "preview"/"production",
      # which broke Meticulous (it listens for datahub-project-web-react). Record that
      # environment ourselves after a successful Pages upload.
      - name: Publish
        id: cloudflare
        if: ${{ needs.setup.outputs.frontend_change == 'true' && needs.setup.outputs.cloudflare_token_available == 'true' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: datahub-web-react
          command: pages deploy dist --project-name=datahub-project-web-react
      - name: Record GitHub Deployment
        if: ${{ needs.setup.outputs.frontend_change == 'true' && needs.setup.outputs.cloudflare_token_available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PRODUCTION: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.event_name == 'release') }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL}" ]; then
            echo "::error::wrangler-action did not output deployment-url"
            exit 1
          fi
          if [ "${IS_PRODUCTION}" = "true" ]; then
            TRANSIENT=false
            PRODUCTION=true
          else
            TRANSIENT=true
            PRODUCTION=false
          fi
          DEPLOY_ID=$(jq -nc \
            --arg ref "$REF" \
            --arg desc "Cloudflare Pages frontend preview" \
            --argjson transient "$TRANSIENT" \
            --argjson production "$PRODUCTION" \
            '{
              ref: $ref,
              environment: "datahub-project-web-react",
              description: $desc,
              auto_merge: false,
              required_contexts: [],
              transient_environment: $transient,
              production_environment: $production
            }' | gh api --method POST "/repos/${REPO}/deployments" --input - --jq '.id')
          jq -nc \
            --arg url "$DEPLOY_URL" \
            --arg log "${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              state: "success",
              environment: "datahub-project-web-react",
              environment_url: $url,
              log_url: $log,
              description: "Cloudflare Pages frontend preview"
            }' | gh api --method POST "/repos/${REPO}/deployments/${DEPLOY_ID}/statuses" --input - >/dev/null
          echo "Created GitHub Deployment ${DEPLOY_ID} -> ${DEPLOY_URL}"
      # Runs LAST because it is destructive: it checks out the base commit's src/ and rebuilds
      # dist/ in place (without -Psourcemap) to measure the base bundle size. It must run after
      # Publish so Cloudflare deploys the real PR build WITH sourcemaps — otherwise the maps
      # Meticulous needs are overwritten before deploy. Copies both dist/ trees aside
      # for the boot-only Lighthouse A/B step. continue-on-error keeps a measurement
      # failure from blocking the deploy.
      - name: Report initial JS bundle size
        if: ${{ needs.setup.outputs.frontend_change == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ROOT="$GITHUB_WORKSPACE"
          cd datahub-web-react
          # Publish needed sourcemaps, but the comparison must use equivalent production
          # builds. Rebuild the PR without -Psourcemap before measuring or copying it.
          CI=false NODE_OPTIONS='--max-old-space-size=8192 --openssl-legacy-provider' \
            npx vite build --mode production 2>/dev/null

          mkdir -p "$ROOT/e2e-test/perf/vitals/builds/pr" "$ROOT/e2e-test/perf/vitals/builds/base"
          rm -rf "$ROOT/e2e-test/perf/vitals/builds/pr/dist"
          cp -a dist "$ROOT/e2e-test/perf/vitals/builds/pr/dist"

          # Checkout base commit's src/ only — keeps PR's node_modules, vite.config, package.json
          cd "$ROOT"
          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null
          git checkout "$BASE_SHA" -- datahub-web-react/src

          # Build base (skip codegen — generated types are close enough for size measurement)
          cd datahub-web-react
          CI=false NODE_OPTIONS='--max-old-space-size=8192 --openssl-legacy-provider' \
            npx vite build --mode production 2>/dev/null

          rm -rf "$ROOT/e2e-test/perf/vitals/builds/base/dist"
          cp -a dist "$ROOT/e2e-test/perf/vitals/builds/base/dist"

          # Login is index.html. Logged-in pages add the AuthenticatedApp shell
          # and the lazy route chunks. Sizes come from each dist's Vite manifest.
          BODY=$(node "$ROOT/datahub-web-react/scripts/page-bundle-size.mjs" \
            --base-dist "$ROOT/e2e-test/perf/vitals/builds/base/dist" \
            --pr-dist "$ROOT/e2e-test/perf/vitals/builds/pr/dist" \
            --base-sha "$BASE_SHA")
          echo "$BODY"

          SIZE_BODY=$(mktemp)
          printf '%s\n\n%s\n' '<!-- initial-js-bundle-size -->' "$BODY" > "$SIZE_BODY"
          python3 "$ROOT/.github/scripts/upsert_pr_comment.py" \
            '<!-- initial-js-bundle-size -->' "$SIZE_BODY" "$PR_NUMBER" "$GITHUB_REPOSITORY"
      - name: Set up Node for web-vitals
        if: ${{ needs.setup.outputs.frontend_change == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Cache Puppeteer Chrome
        if: ${{ needs.setup.outputs.frontend_change == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('e2e-test/perf/vitals/package-lock.json') }}
          restore-keys: puppeteer-${{ runner.os }}-
      - name: Report boot web vitals
        # No GMS. Pull requests compare the two dist/ copies from the size step.
        # Pushes to master measure only the head tree. Does not replace the gzip comment.
        if: ${{ needs.setup.outputs.frontend_change == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
          # Must match this job's runs-on label. runs-on cannot read env, and
          # RUNNER_NAME changes every job, so the class is written here explicitly.
          LAB_RUNNER: ubuntu-22.04
        run: |
          ROOT="$GITHUB_WORKSPACE"
          export PUPPETEER_CACHE_DIR="${PUPPETEER_CACHE_DIR:-$HOME/.cache/puppeteer}"
          cd "$ROOT/e2e-test/perf/vitals"
          npm ci
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Publish already uploaded the sourcemap dist. Measure the same
            # map-free production build the PR job copies, for this commit only.
            cd "$ROOT/datahub-web-react"
            CI=false NODE_OPTIONS='--max-old-space-size=8192 --openssl-legacy-provider' \
              npx vite build --mode production 2>/dev/null
            mkdir -p "$ROOT/e2e-test/perf/vitals/builds/head"
            rm -rf "$ROOT/e2e-test/perf/vitals/builds/head/dist"
            cp -a dist "$ROOT/e2e-test/perf/vitals/builds/head/dist"
            cd "$ROOT/e2e-test/perf/vitals"
            mkdir -p results
            # One line: a multiline python -c inside this block scalar is either
            # invalid YAML or indented Python, depending on the spaces.
            python3 -c 'import json, os; sha = os.environ["HEAD_SHA"]; short = sha[:7]; cfg = {"backendUrl": "stub", "auth": {"mode": "anonymous"}, "builds": {"A": {"label": f"master@{short}", "dist": "builds/head/dist", "port": 8181, "commit": sha}}, "routes": [{"name": "boot", "path": "/login"}], "runsPerBuild": 3, "warmupRunsPerBuild": 1, "formFactor": "desktop", "viewport": {"width": 1350, "height": 940}, "throttling": {"method": "simulate", "cpuSlowdownMultiplier": 1, "rttMs": 40, "throughputKbps": 10240, "requestLatencyMs": 150, "downloadThroughputKbps": 10240, "uploadThroughputKbps": 10240}}; open("results/ci-main.config.json", "w").write(json.dumps(cfg, indent=2) + "\n")'
            set +e
            node lh-ab.mjs --config results/ci-main.config.json --no-auth \
              --out results/ci-boot.json --md-out results/ci-boot.md
            LH_RC=$?
            set -e
            if [ -f results/ci-boot.json ]; then
              python3 -c 'import json, os; path = "results/ci-boot.json"; report = json.load(open(path)); report["release"] = "master@" + os.environ["HEAD_SHA"][:7]; open(path, "w").write(json.dumps(report, indent=2) + "\n")'
            fi
            exit "$LH_RC"
          fi
          PR_DIST="$ROOT/e2e-test/perf/vitals/builds/pr/dist/index.html"
          BASE_DIST="$ROOT/e2e-test/perf/vitals/builds/base/dist/index.html"
          if [ ! -f "$PR_DIST" ] || [ ! -f "$BASE_DIST" ]; then
            echo "Skipping boot vitals: missing dist copies (size step did not produce both builds)"
            exit 0
          fi
          node stamp-ci-config.mjs
          set +e
          node lh-ab.mjs --config config.ci.run.json --no-auth \
            --out results/ci-boot.json --md-out results/ci-boot.md
          LH_RC=$?
          set -e
          if [ ! -f results/ci-boot.md ]; then
            echo "web-vitals runner produced no markdown (exit ${LH_RC})" > results/ci-boot.md
          fi
          {
            echo '<!-- web-vitals-boot-ab -->'
            echo '## Boot web vitals (no backend)'
            echo
            echo 'Unauthenticated /login against the two dist/ trees from this job. No GMS — this is eager JS, not search/dataset payload. Lantern, desktop, 1x CPU. Does not forecast fleet p75; do not gate on LCP.'
            echo
            cat results/ci-boot.md
          } > results/ci-boot-comment.md
          python3 "$ROOT/.github/scripts/upsert_pr_comment.py" \
            '<!-- web-vitals-boot-ab -->' results/ci-boot-comment.md "$PR_NUMBER" "$GITHUB_REPOSITORY"
          exit "$LH_RC"
      - name: Upload boot web vitals
        if: ${{ needs.setup.outputs.frontend_change == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ github.event_name == 'push' && 'vitals-boot-master' || format('vitals-boot-pr-{0}', github.event.pull_request.number) }}
          path: e2e-test/perf/vitals/results/ci-boot.json
          retention-days: 30
          if-no-files-found: ignore
