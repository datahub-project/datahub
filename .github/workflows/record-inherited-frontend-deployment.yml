name: Record inherited frontend deployment

# Meticulous records a base test run only for a commit that has a
# "datahub-project-web-react (Production)" GitHub Deployment. Frontend Preview
# creates that deployment after publishing to Cloudflare Pages, and it publishes
# only when the frontend changed. A backend-only master commit then has no base,
# and a pull request branched from it is skipped ("no base test run was found").
#
# This workflow records the same deployment for those commits and points it at
# the last published Pages URL. The frontend bundle did not change, so there is
# nothing to rebuild.
#
# It is a separate workflow so Frontend Preview's cancel-in-progress group
# cannot drop the record. Each SHA has its own group so later master pushes do
# not cancel earlier ones either.
#
# Path filters match Frontend Preview, plus this workflow and its script, so a
# master push that skips Publish still gets a deployment.

on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/react-cloudflare-pages.yml"
      - ".github/workflows/record-inherited-frontend-deployment.yml"
      - ".github/scripts/record_inherited_frontend_deployment.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - uses: ./.github/actions/ci-optimization
        id: ci-optimize
      # Require an explicit false. An empty output must not reuse an old URL
      # for a commit that actually changed the frontend.
      - name: Record inherited production deployment
        if: steps.ci-optimize.outputs.frontend-change == 'false'
        run: python3 .github/scripts/record_inherited_frontend_deployment.py
