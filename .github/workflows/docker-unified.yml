  pytest_tests:
    name: Pytest Smoke Tests (Batch ${{ matrix.batch }}/${{ matrix.batch_count }})
    runs-on: ${{ needs.setup.outputs.test_runner_type }}
    needs: [setup, smoke_test_matrix, base_build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.smoke_test_matrix.outputs.pytest_matrix || '{"include":[]}') }}
    # A status-check function (always/!failure/!cancelled) is required: without one, an `if`
    # implies success(), which fails for jobs downstream of the optionally-skipped
    # base_build (skipped on fork PRs), so this job would be skipped.
    if: ${{ always() && !failure() && !cancelled() && needs.smoke_test_matrix.outputs.pytest_matrix != '' && needs.smoke_test_matrix.outputs.pytest_matrix != '{"include":[]}' }}
    env:
      MIXPANEL_API_SECRET: ${{ secrets.MIXPANEL_API_SECRET }}
      MIXPANEL_PROJECT_ID: ${{ secrets.MIXPANEL_PROJECT_ID }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7

      - uses: ./.github/actions/restore-dependency-caches
        with:
          uv_cache_key: ${{ needs.setup.outputs.uv_cache_key }}
          uv_cache_key_prefix: ${{ needs.setup.outputs.uv_cache_key_prefix }}
          yarn_cache_key: ${{ needs.setup.outputs.yarn_cache_key }}
          yarn_cache_key_prefix: ${{ needs.setup.outputs.yarn_cache_key_prefix }}
          # Internal runs pull images from Depot and never run yarn; fork PRs build
          # them in-job (yarnInstall), so only they need the ~1.7 GB yarn restore.
          restore_yarn: ${{ needs.setup.outputs.use_depot_cache != 'true' }}

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Depot CLI
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' }}
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Parse previous results for retry
        id: retry-check
        if: github.run_attempt > 1
        uses: ./.github/actions/smoke-test-retry
        with:
          test_strategy: pytests
          batch: ${{ matrix.batch }}
          run_id: ${{ github.run_id }}
          github_token: ${{ github.token }}

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle: ${{ needs.setup.outputs.use_depot_cache != 'true' && steps.retry-check.outputs.parse_result != 'all_passed' }}

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ needs.setup.outputs.docker-login == 'true' && steps.retry-check.outputs.parse_result != 'all_passed' }}
        with:
          username: ${{ secrets.ACRYL_DOCKER_USERNAME }}
          password: ${{ secrets.ACRYL_DOCKER_PASSWORD }}

      - name: Disk Space Analysis
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        run: |
          echo "=== Disk Usage Overview ==="
          df -h
          echo -e "\n=== Docker Disk Usage ==="
          docker system df -v

      - id: uv-creds
        if: ${{ needs.setup.outputs.use_depot_cache != 'true' && steps.retry-check.outputs.parse_result != 'all_passed' }}
        uses: ./.github/actions/setup-uv-credentials
        with:
          base_profile: ${{ vars.CI_BASE_UV_DOCKER_PROFILE || 'default' }}
          chainguard_python_identity_id: ${{ vars.CHAINGUARD_PYTHON_IDENTITY_ID }}
          chainguard_python_token: ${{ secrets.CHAINGUARD_PYTHON_TOKEN }}

      - name: Build images
        timeout-minutes: 60
        if: ${{ needs.setup.outputs.use_depot_cache != 'true' && steps.retry-check.outputs.parse_result != 'all_passed' }}
        env:
          DOCKER_CACHE: GITHUB
        run: |
          BUILD_TASK="${{ needs.setup.outputs.smoke_build_task || ':docker:buildImagesQuickstart' }}"
          echo "Using build task: $BUILD_TASK"
          ./gradlew --max-workers="$(nproc)" $BUILD_TASK -Ptag=${{ needs.setup.outputs.tag }} -PpythonDockerVersion=${{ needs.setup.outputs.python_release_version }} -PdockerRegistry=${{ env.DOCKER_REGISTRY }} -Pdatahub.dependencies.python.uvDockerProfile=${{ steps.uv-creds.outputs.uv_profile }}
          docker images

      - name: Pull images from depot
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.base_build.outputs.build_id != '' && steps.retry-check.outputs.parse_result != 'all_passed' }}
        run: |
          depot pull --project "${{ env.DEPOT_PROJECT_ID }}" "${{ needs.base_build.outputs.build_id }}"
          docker images

      - name: Disk Space Analysis
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        run: |
          echo "=== Disk Usage Overview ==="
          df -h
          echo -e "\n=== Docker Disk Usage ==="
          docker system df -v

      - name: Pin reused images to the quickstart tag
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        env:
          IMAGE_VERSION_ENV: ${{ needs.setup.outputs.image_version_env }}
        run: |
          # Per-service overrides for the images this PR cannot affect, which are
          # served from the last set that passed smoke tests on master, pinned to
          # the exact digest resolved when the plan ran (not the bare floating
          # `quickstart` tag) so every job in this run uses the same image even
          # if master finishes a build and moves the tag mid-run. Images absent
          # here fall through to DATAHUB_VERSION and come from the depot pull
          # above. Empty on a full build.
          printf '%s' "$IMAGE_VERSION_ENV" | tee -a "$GITHUB_ENV"

      - name: Run quickstart
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        env:
          DATAHUB_TELEMETRY_ENABLED: false
          DATAHUB_VERSION: ${{ needs.setup.outputs.tag }}
          DATAHUB_ACTIONS_IMAGE: ${{ env.DATAHUB_ACTIONS_IMAGE }}
          ACTIONS_EXTRA_PACKAGES: "acryl-datahub-actions[executor] acryl-datahub-actions"
          ACTIONS_CONFIG: "https://raw.githubusercontent.com/acryldata/datahub-actions/main/docker/config/executor.yaml"
          PROFILE_NAME: ${{ needs.setup.outputs.smoke_profile_name || env.PROFILE_NAME }}
          EXPECT_PR_TAGGED_IMAGES: ${{ needs.setup.outputs.image_built_repos }}
        run: |
          echo "Using compose profile: $PROFILE_NAME"
          ./smoke-test/run-quickstart.sh

      - name: Disk Check
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        run: df -h . && docker images

      - name: Disable ES Disk Threshold
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        run: |
          curl -XPUT "http://localhost:9200/_cluster/settings" \
          -H 'Content-Type: application/json' -d'{
            "persistent": {
              "cluster": {
                "routing": {
                  "allocation.disk.threshold_enabled": false
                }
              }
            }
          }'

      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' && steps.retry-check.outputs.parse_result != 'all_passed' }}
        uses: ./.github/actions/configure-fast-apt-mirror
      - name: Install dependencies
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        run: ./metadata-ingestion/scripts/install_deps.sh

      - name: Build datahub cli
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        run: ./gradlew :metadata-ingestion:install

      - name: Download batch plan
        if: ${{ needs.smoke_test_matrix.outputs.batch_plan == 'true' && steps.retry-check.outputs.parse_result != 'all_passed' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytest-smoke-plan
          path: pytest-smoke-plan

      - name: Pytest smoke tests
        if: steps.retry-check.outputs.parse_result != 'all_passed'
        env:
          RUN_QUICKSTART: false
          DATAHUB_VERSION: ${{ needs.setup.outputs.tag }}
          CLEANUP_DATA: "false"
          TEST_STRATEGY: pytests
          BATCH_COUNT: ${{ matrix.batch_count }}
          BATCH_NUMBER: ${{ matrix.batch }}
          # 'p0' or 'full' -- decided by smoke_test_matrix.
          SMOKE_TIER: ${{ needs.smoke_test_matrix.outputs.smoke_tier }}
          # Test modules this PR touches; they run alongside the p0 tier.
          # Ignored on a full run.
          SMOKE_CHANGED_TESTS: ${{ needs.setup.outputs.smoke_changed_tests }}
          # Smart test selection (see smoke_test_matrix). Shadow: conftest
          # records the would-be selection. Active: SMOKE_BATCH_PLAN carries the
          # selection and this batch's scopes. Off does nothing.
          SMOKE_SMART_TESTING: ${{ needs.smoke_test_matrix.outputs.smart_testing_mode }}
          SMOKE_SMART_TAGS: ${{ needs.smoke_test_matrix.outputs.smart_tags }}
          SMOKE_BATCH_PLAN: ${{ needs.smoke_test_matrix.outputs.batch_plan == 'true' && format('{0}/pytest-smoke-plan/pytest-smoke-plan.json', github.workspace) || '' }}
          PYTEST_XDIST_WORKERS: "3"
          # GMS here runs with a 1s bulk-flush and 1s index refresh interval
          # (see run-quickstart.sh), so the trailing post-wait sleep can match.
          # The library default stays conservative for other environments.
          ELASTICSEARCH_REFRESH_INTERVAL_SECONDS: "1"
          FILTERED_TESTS: ${{ steps.retry-check.outputs.filtered_tests_file || '' }}
          # On a retry, fall back to the conservative aggregate-lag wait. It is
          # the wrong default (under full concurrent load the lag may never
          # reach zero) but the right choice here: a retry runs a smaller
          # filtered set under much less write pressure, so a wait-related
          # flake gets a second chance with the stronger guarantee.
          DATAHUB_TEST_FORCE_LEGACY_WAIT: ${{ github.run_attempt > 1 && 'true' || '' }}
        run: |
          if [[ -n "$FILTERED_TESTS" && -f "$FILTERED_TESTS" ]]; then
            echo "=========================================="
            echo "RETRY MODE: Running only failed pytest modules"
            echo "=========================================="
            echo "Failed modules to retry:"
            cat "$FILTERED_TESTS"
            echo "=========================================="
          elif (( ${{ github.run_attempt }} > 1 )); then
            echo "RETRY MODE: Running all tests (fallback)"
          fi
          echo "$DATAHUB_VERSION"
          ./gradlew --stop
          ./smoke-test/smoke.sh

      - name: Disk Check
        run: df -h . && docker images

      - name: Store logs
        if: failure()
        run: |
          docker ps -a
          TEST_STRATEGY="-pytests-${{ matrix.batch }}"
          source .github/scripts/docker_logs.sh

      - name: Upload logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: docker-logs-pytests-${{ matrix.batch }}
          path: "docker_logs/*.log"
          retention-days: 5

      - name: Upload pytest logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: pytest-smoke-logs-pytests-${{ matrix.batch }}
          path: "smoke-test/test-results/pytest-smoke.log"
          retention-days: 5

      - name: Report test results
        if: (!cancelled())
        uses: ./.github/actions/report-test-results
        with:
          artifact-name: Test Results (smoke tests) pytests ${{ matrix.batch }}
          test-results-paths: |
            **/junit.*.xml
            !**/binary/**
          junit-file-globs: |
            **/junit.*.xml

      - name: Smart Testing Shadow Comparison
        if: ${{ always() && needs.smoke_test_matrix.outputs.smart_testing_mode == 'shadow' && needs.smoke_test_matrix.outputs.smart_tags != '' }}
        continue-on-error: true
        working-directory: smoke-test
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          shopt -s nullglob globstar
          missed=$(python3 -m smart_testing.shadow_report ./**/junit.*.xml)
          if [ -z "$missed" ]; then
            echo "No false negatives in batch $BATCH"
            exit 0
          fi
          {
            echo "## Smart Testing: False Negatives (batch $BATCH)"
            echo ""
            echo "These tests **failed on the final attempt** (they would have turned the job red) but smart selection would have **skipped** them:"
            echo ""
            echo '```'
            echo "$missed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Smart testing false negatives: $(echo "$missed" | paste -sd ',' -)"

      - name: Send failed test metrics to PostHog
        if: failure()
        continue-on-error: true
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          GH_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          SMART_MODE: ${{ needs.smoke_test_matrix.outputs.smart_testing_mode }}
          SMART_SELECTION: ${{ needs.smoke_test_matrix.outputs.smart_selection }}
          SMART_CONFIDENCE: ${{ needs.smoke_test_matrix.outputs.smart_confidence }}
        run: |
          if [ -z "$POSTHOG_API_KEY" ]; then
            echo "⚠️ POSTHOG_API_KEY not configured, skipping test failure metrics"
            exit 0
          fi

          TEMP_DIR=$(mktemp -d)
          mkdir -p "$TEMP_DIR/test-results"
          find . -name "junit.*.xml" -exec cp {} "$TEMP_DIR/test-results/" \; 2>/dev/null || true

          python3 .github/scripts/send_failed_tests_to_posthog.py \
            --input-dir "$TEMP_DIR/test-results" \
            --posthog-api-key "$POSTHOG_API_KEY" \
            --posthog-host "${POSTHOG_HOST:-https://app.posthog.com}" \
            --repository "${{ github.repository }}" \
            --workflow-name "${{ github.workflow }}" \
            --branch "${GH_HEAD_REF}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --batch "${{ matrix.batch }}" \
            --batch-count "${{ strategy.job-total }}" \
            --test-strategy "pytests" \
            --smart-mode "$SMART_MODE" \
            --smart-selection "$SMART_SELECTION" \
            --smart-confidence "$SMART_CONFIDENCE"

          rm -rf "$TEMP_DIR"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          override_branch: ${{ github.head_ref || github.ref_name }}

  # Runs the quickstart stack and validates that semantic search works
  # end-to-end with an in-process or locally served embedding provider, one
  # matrix leg each:
  #   local     — DataHub + Ollama, the `local` provider over the OpenAI-compatible API
  #   classical — DataHub only, the deterministic hashing provider (no model, no endpoint)
  # Reuses the images built once by base_build (depot pull, or a local bake on
  # fork PRs) instead of rebuilding them in a standalone workflow.
  ai_smoke_test:
    name: AI Smoke Test (${{ matrix.provider }})
    runs-on: ${{ needs.setup.outputs.test_runner_type }}
    needs: [setup, base_build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [local, classical]
    # See pytest_tests for why the status-check function is required (downstream
    # of the optionally-skipped base_build on fork PRs). On a PR this is gated to
    # embedding / semantic-search path changes so ordinary PRs skip it; every
    # non-PR event (post-merge push, release, dispatch) runs it unconditionally,
    # which is what replaces the standalone workflow's nightly cron.
    if: ${{ always() && !failure() && !cancelled() && needs.setup.outputs.embedding_ai_change == 'true' }}
    env:
      LOCAL_EMBEDDING_MODEL: ${{ github.event.inputs.embedding_model || 'nomic-embed-text' }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7

      - uses: ./.github/actions/restore-dependency-caches
        with:
          uv_cache_key: ${{ needs.setup.outputs.uv_cache_key }}
          uv_cache_key_prefix: ${{ needs.setup.outputs.uv_cache_key_prefix }}
          yarn_cache_key: ${{ needs.setup.outputs.yarn_cache_key }}
          yarn_cache_key_prefix: ${{ needs.setup.outputs.yarn_cache_key_prefix }}
          # Internal runs pull images from Depot and never run yarn; fork PRs build
          # them in-job (yarnInstall), so only they need the ~1.7 GB yarn restore.
          restore_yarn: ${{ needs.setup.outputs.use_depot_cache != 'true' }}

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle: ${{ needs.setup.outputs.use_depot_cache != 'true' }}

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Depot CLI
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' }}
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ needs.setup.outputs.docker-login == 'true' }}
        with:
          username: ${{ secrets.ACRYL_DOCKER_USERNAME }}
          password: ${{ secrets.ACRYL_DOCKER_PASSWORD }}

      - id: uv-creds
        if: ${{ needs.setup.outputs.use_depot_cache != 'true' }}
        uses: ./.github/actions/setup-uv-credentials
        with:
          base_profile: ${{ vars.CI_BASE_UV_DOCKER_PROFILE || 'default' }}
          chainguard_python_identity_id: ${{ vars.CHAINGUARD_PYTHON_IDENTITY_ID }}
          chainguard_python_token: ${{ secrets.CHAINGUARD_PYTHON_TOKEN }}

      - name: Build images
        timeout-minutes: 60
        if: ${{ needs.setup.outputs.use_depot_cache != 'true' }}
        env:
          DOCKER_CACHE: GITHUB
        run: |
          BUILD_TASK="${{ needs.setup.outputs.smoke_build_task || ':docker:buildImagesQuickstart' }}"
          echo "Using build task: $BUILD_TASK"
          ./gradlew --max-workers="$(nproc)" $BUILD_TASK -Ptag=${{ needs.setup.outputs.tag }} -PpythonDockerVersion=${{ needs.setup.outputs.python_release_version }} -PdockerRegistry=${{ env.DOCKER_REGISTRY }} -Pdatahub.dependencies.python.uvDockerProfile=${{ steps.uv-creds.outputs.uv_profile }}
          docker images

      - name: Pull images from depot
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.base_build.outputs.build_id != '' }}
        run: |
          depot pull --project "${{ env.DEPOT_PROJECT_ID }}" "${{ needs.base_build.outputs.build_id }}"
          docker images

      - name: Pin reused images to the quickstart tag
        env:
          IMAGE_VERSION_ENV: ${{ needs.setup.outputs.image_version_env }}
        run: |
          # Per-service overrides for the images this PR cannot affect. Empty on a full build.
          printf '%s' "$IMAGE_VERSION_ENV" | tee -a "$GITHUB_ENV"

      # GMS AI env vars are injected into the GMS container via
      # DATAHUB_LOCAL_COMMON_ENV (read as an env_file by docker-compose.gms.yml).
      # GMS reaches Ollama over the Docker bridge network; the CI runner reaches
      # it via the mapped port at localhost:11434.
      - name: Write GMS AI env file (local)
        if: matrix.provider == 'local'
        run: |
          printf '%s\n' \
            "EMBEDDING_PROVIDER_TYPE=local" \
            "ELASTICSEARCH_SEMANTIC_SEARCH_ENABLED=true" \
            "SEARCH_SERVICE_SEMANTIC_SEARCH_ENABLED=true" \
            "LOCAL_EMBEDDING_ENDPOINT=http://ollama:11434/v1/embeddings" \
            "LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL}" \
            > /tmp/ai-gms.env

      # The classical provider is lexical hashing, not semantic search; GMS refuses
      # it without the explicit opt-in. system-update reads the same env file,
      # which is what adds the hash_v1_2048 field to the semantic index before
      # GMS starts.
      - name: Write GMS AI env file (classical)
        if: matrix.provider == 'classical'
        run: |
          printf '%s\n' \
            "EMBEDDING_PROVIDER_TYPE=classical" \
            "CLASSICAL_EMBEDDING_ACKNOWLEDGE_LEXICAL_ONLY=true" \
            "ELASTICSEARCH_SEMANTIC_SEARCH_ENABLED=true" \
            "SEARCH_SERVICE_SEMANTIC_SEARCH_ENABLED=true" \
            > /tmp/ai-gms.env

      # Boots the compose profile the smoke label selected (quickstart-consumers
      # when there is no label). That profile may or may not run separate MAE/MCE
      # containers. The local leg also activates quickstart-ai (Ollama); classical
      # embeds in-process and does not.
      - name: Start DataHub (selected smoke profile, plus quickstart-ai on the local leg)
        run: |
          SIGNING_KEY=$(openssl rand -base64 32)
          SIGNING_SALT=$(openssl rand -base64 32)
          PROFILE_NAME="${{ needs.setup.outputs.smoke_profile_name || 'quickstart-consumers' }}"
          echo "Using compose profile: ${PROFILE_NAME}"
          COMPOSE_PROFILES=()
          IFS=',' read -ra PROFILE_PARTS <<<"${PROFILE_NAME}"
          for part in "${PROFILE_PARTS[@]}"; do
            [[ -n "${part}" ]] || continue
            COMPOSE_PROFILES+=(--profile "${part}")
          done
          if [ "${{ matrix.provider }}" = "local" ]; then
            case ",${PROFILE_NAME}," in
              *,quickstart-ai,*) ;;
              *) COMPOSE_PROFILES+=(--profile quickstart-ai) ;;
            esac
          fi

          DATAHUB_VERSION=${{ needs.setup.outputs.tag }} \
          DATAHUB_TOKEN_SERVICE_SIGNING_KEY=${SIGNING_KEY} \
          DATAHUB_TOKEN_SERVICE_SALT=${SIGNING_SALT} \
          DATAHUB_SEARCH_IMAGE=opensearchproject/opensearch \
          DATAHUB_SEARCH_TAG=2.19.3 \
          XPACK_SECURITY_ENABLED=plugins.security.disabled=true \
          ELASTICSEARCH_USE_SSL=false \
          USE_AWS_ELASTICSEARCH=true \
          ELASTICSEARCH_INDEX_BUILDER_REFRESH_INTERVAL_SECONDS=1 \
          ELASTICSEARCH_INDEX_REFRESH_INTERVAL_TIMESERIES_SECONDS=1 \
          POLICY_CACHE_REFRESH_INTERVAL_SECONDS=10 \
          DATAHUB_TELEMETRY_ENABLED=false \
          DATAHUB_ACTIONS_IMAGE=acryldata/datahub-actions \
          DATAHUB_LOCAL_ACTIONS_ENV=$(pwd)/smoke-test/test_resources/actions/actions.env \
          DATAHUB_LOCAL_COMMON_ENV=/tmp/ai-gms.env \
          LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL} \
          docker compose \
            -p datahub \
            --project-directory docker/profiles \
            "${COMPOSE_PROFILES[@]}" \
            up -d --quiet-pull

      # Wait for GMS to be reachable before tuning OpenSearch.
      # ollama-model-init is a one-shot init container that exits with 0 once
      # the model is pulled and warmed up; we poll for both GMS and Ollama
      # readiness rather than relying on `docker compose --wait`, which treats
      # any container exit (even successful) as a failure.
      - name: Wait for GMS to be ready
        run: |
          echo "Waiting for GMS at http://localhost:8080/health..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✓ GMS is ready (attempt ${i})"
              exit 0
            fi
            echo "  Attempt ${i}/90 — GMS not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: GMS did not become ready within 900s."
          docker ps -a
          exit 1

      - name: Relax OpenSearch disk threshold
        run: |
          curl -sf -XPUT "http://localhost:9200/_cluster/settings" \
            -H "Content-Type: application/json" \
            -d '{"persistent":{"cluster.routing.allocation.disk.threshold_enabled":"false"}}' \
          || echo "Warning: could not relax disk threshold (non-fatal)"

      # ollama-model-init pulls the model and warms it up inside the container
      # network. We also probe from the CI runner (via the mapped port) to
      # confirm the model is hot before handing off to the smoke tests.
      - name: Wait for Ollama model readiness
        if: matrix.provider == 'local'
        run: |
          MODEL="${LOCAL_EMBEDDING_MODEL}"
          echo "Waiting for Ollama model '${MODEL}' to respond at localhost:11434..."
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:11434/v1/embeddings \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"${MODEL}\",\"input\":\"readiness probe\"}" \
                > /dev/null 2>&1; then
              echo "✓ Ollama model '${MODEL}' is ready (attempt ${i})"
              exit 0
            fi
            echo "  Attempt ${i}/60 — model not ready yet, waiting 10s..."
            sleep 10
          done
          echo "ERROR: Ollama model '${MODEL}' did not become ready within 600s."
          exit 1

      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror

      - name: Install dependencies
        run: ./metadata-ingestion/scripts/install_deps.sh

      # smoke-test/requirements.txt installs ../metadata-ingestion as an editable
      # package, so `datahub.metadata` resolves to src/datahub/metadata -- which only
      # exists once codegen has run. :smoke-test:installDev does not depend on it.
      # The standalone AI workflow got it as a side effect of building the images
      # locally; this job pulls prebuilt images instead, so run codegen explicitly.
      - name: Build datahub cli
        run: ./gradlew :metadata-ingestion:install

      - name: Install smoke test dependencies
        run: ./gradlew :smoke-test:installDev

      - name: Run AI embedding smoke tests (local)
        if: matrix.provider == 'local'
        working-directory: smoke-test
        run: |
          source venv/bin/activate
          pytest tests/e2e/semantic/test_local_embedding_provider.py \
            -v \
            --junit-xml=junit.smoke-ai.xml \
            --timeout=120
        env:
          DATAHUB_GMS_URL: "http://localhost:8080"
          LOCAL_EMBEDDING_PROVIDER_TESTS: "true"
          LOCAL_EMBEDDING_ENDPOINT: "http://localhost:11434/v1/embeddings"
          LOCAL_EMBEDDING_MODEL: ${{ env.LOCAL_EMBEDDING_MODEL }}
          EMBEDDING_WAIT_SECONDS: "30"

      - name: Run AI embedding smoke tests (classical)
        if: matrix.provider == 'classical'
        working-directory: smoke-test
        run: |
          source venv/bin/activate
          pytest tests/e2e/semantic/test_classical_embedding_provider.py \
            -v \
            --junit-xml=junit.smoke-ai.xml \
            --timeout=120
        env:
          DATAHUB_GMS_URL: "http://localhost:8080"
          CLASSICAL_EMBEDDING_PROVIDER_TESTS: "true"
          EMBEDDING_WAIT_SECONDS: "30"

      - name: Report test results
        if: (!cancelled())
        uses: ./.github/actions/report-test-results
        with:
          artifact-name: Test Results (smoke tests) ai-smoke-${{ matrix.provider }}
          test-results-paths: |
            **/junit.smoke-ai.xml
          junit-file-globs: |
            **/junit.smoke-ai.xml

      - name: Collect Docker logs on failure
        if: failure()
        env:
          TARGET_DIR: docker_logs/${{ github.job }}-${{ matrix.provider }}
          COMPOSE_PROJECT_NAME: datahub
        run: |
          docker ps -a
          . .github/scripts/docker_logs.sh

      - name: Upload Docker logs on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: docker-logs-ai-${{ matrix.provider }}-${{ github.run_id }}
          path: docker_logs/${{ github.job }}-${{ matrix.provider }}/
          retention-days: 5

  # Playwright P0 tier on PRs: works out which tests the PR needs (every @p0 test,
  # plus the tests Playwright's --only-changed says the change affects, plus the specs
  # seeding from changed fixture data) with plan_playwright_tier.py, and falls back
  # to the full suite when a change can't be mapped. The tier is used when the
  # PLAYWRIGHT_P0_SMOKE repo variable is "true" and the PR has neither run-all-tests
  # nor run-all-tests:playwright; otherwise the full suite runs and the plan is only reported (shadow mode; the report job checks it for
  # escapes). If this job fails, playwright_test runs the full suite.
  playwright_plan:
    name: Plan Playwright P0 tier
    runs-on: ${{ needs.setup.outputs.test_runner_type_small || 'ubuntu-24.04' }}
    needs: [setup]
    # always(): setup's own needs are often skipped, and a bare condition implies
    # success() over every ancestor.
    if: ${{ always() && !failure() && !cancelled() && github.event_name == 'pull_request' && needs.setup.outputs.playwright_matrix != '' && needs.setup.outputs.playwright_matrix != '{"include":[]}' }}
    timeout-minutes: 15
    outputs:
      run_mode: ${{ steps.plan.outputs.run_mode }}
      matrix: ${{ steps.tier-matrix.outputs.matrix }}
    steps:
      # The default PR checkout is the merge commit, with full history: HEAD^1 is
      # the base branch tip, so HEAD^1..HEAD is exactly what the shards will test.
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Restore yarn cache
        with:
          path: ~/.cache/yarn
          key: playwright-${{ runner.os }}-yarn-${{ hashFiles('./e2e-test/ui/playwright/package.json', './e2e-test/ui/playwright/yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-yarn-
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          java: false
          python: false
          gradle: false
          node: true
      # --list needs node_modules but no browsers or backend. A failed install isn't
      # fatal: the planner then can't list tests, so it plans the full suite and
      # emits a warning, rather than failing the job.
      - name: Install Playwright dependencies
        continue-on-error: true
        working-directory: e2e-test/ui/playwright
        run: yarn install --frozen-lockfile
      # The planner turns its own failures into a full-suite plan and exits 0. If this
      # job fails anyway, its outputs are empty and playwright_test runs the full suite.
      - name: Plan Playwright P0 tier
        id: plan
        env:
          SUITE_MATRIX: ${{ needs.setup.outputs.playwright_matrix }}
          # The tier is on via the PLAYWRIGHT_P0_SMOKE repo variable; run-all-tests (both
          # suites) or run-all-tests:playwright turns it off for a single PR.
          TIER_REQUESTED: >-
            ${{
              vars.PLAYWRIGHT_P0_SMOKE == 'true'
              && !contains(github.event.pull_request.labels.*.name, 'run-all-tests')
              && !contains(github.event.pull_request.labels.*.name, 'run-all-tests:playwright')
            }}
        run: |
          base=HEAD^1
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            # Not a merge commit (e.g. a custom checkout): compare with the merge base.
            base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}")
          fi
          python3 .github/scripts/plan_playwright_tier.py \
            --base "$base" \
            --suite-shards "$(jq '.include | length' <<< "$SUITE_MATRIX")" \
            --tier-requested "$TIER_REQUESTED" \
            --plan-out "$RUNNER_TEMP/playwright-tier-plan.json"
      - name: Upload Playwright P0 tier plan
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-tier-plan
          path: ${{ runner.temp }}/playwright-tier-plan.json
          retention-days: 5
      - name: Build P0 tier shard matrix
        id: tier-matrix
        if: ${{ steps.plan.outputs.run_mode == 'p0' }}
        env:
          SHARD_COUNT: ${{ steps.plan.outputs.total_shards }}
        run: |
          matrix=$(jq -cn --argjson n "$SHARD_COUNT" \
            '{include: [range(1; $n + 1) | {shard: (. | tostring), shard_count: ($n | tostring)}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "## Playwright Test Matrix"
            echo ""
            echo "| Strategy | Total Shards |"
            echo "|----------|--------------|"
            echo "| playwright (P0 tier) | $SHARD_COUNT |"
          } >> "$GITHUB_STEP_SUMMARY"

  playwright_test:
    name: Playwright E2E Tests
    needs: [setup, base_build, playwright_plan]
    strategy:
      fail-fast: false
      # The P0 tier's matrix when it applies, else the full-suite matrix from setup.
      matrix: ${{ fromJson(needs.playwright_plan.outputs.matrix || needs.setup.outputs.playwright_matrix || '{"include":[]}') }}
    # Gate on the jobs the tests need, not !failure(): a failed playwright_plan must
    # fall back to setup's full-suite matrix, not skip Playwright.
    if: >-
      ${{ always() && !cancelled()
          && needs.setup.result == 'success'
          && (needs.base_build.result == 'success' || needs.base_build.result == 'skipped')
          && (needs.playwright_plan.outputs.matrix || needs.setup.outputs.playwright_matrix) != ''
          && (needs.playwright_plan.outputs.matrix || needs.setup.outputs.playwright_matrix) != '{"include":[]}' }}
    uses: ./.github/workflows/resusable-playwright-tests.yml
    with:
      shard: ${{ matrix.shard }}
      shard_count: ${{ matrix.shard_count }}
      test_runner_type: ${{ needs.setup.outputs.test_runner_type }}
      depot_build_id: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.base_build.outputs.build_id || '' }}
      image_build_task: ${{ needs.setup.outputs.smoke_build_task || ':docker:buildImagesQuickstart' }}
      # Can't use env.DOCKER_REGISTRY so hardcoding the registry value
      local_build_flags: "-PpythonDockerVersion=${{ needs.setup.outputs.python_release_version }} -PdockerRegistry=acryldata"
      datahub_version: ${{ needs.setup.outputs.tag }}
      image_version_env: ${{ needs.setup.outputs.image_version_env }}
      image_built_repos: ${{ needs.setup.outputs.image_built_repos }}
      docker_login: ${{ needs.setup.outputs.docker-login }}
      profile_name: ${{ needs.setup.outputs.smoke_profile_name || 'quickstart-consumers' }}
      send_posthog_metrics: true
      # Opt in to 2 workers on first attempt; fall back to 1 on re-runs for stability.
      workers_per_shard: ${{ github.run_attempt > 1 && '1' || '2' }}
      # P0 tier: each shard packs the plan's tests into a --test-list; empty runs every spec.
      tier_plan_artifact: ${{ needs.playwright_plan.outputs.run_mode == 'p0' && 'playwright-tier-plan' || '' }}
    secrets: inherit

  playwright_report:
    name: Merge Playwright HTML report
    needs: [setup, playwright_test]
    if: ${{ !cancelled() && needs.playwright_test.result != 'skipped' }}
    uses: ./.github/workflows/reusable-playwright-report.yml
    secrets: inherit

  publish_images:
    name: Update quickstart tag after tests pass on master
    runs-on: ${{ needs.setup.outputs.test_runner_type_small || 'ubuntu-24.04' }}
    needs:
      [
        setup,
        base_build,
        java_integration_tests,
        pytest_tests,
        playwright_test,
        stack_free_smoke_tests,
      ]
    if: ${{ always() && !failure() && !cancelled() && needs.setup.result != 'skipped' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Set up Depot CLI
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' }}
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ needs.setup.outputs.docker-login == 'true' }}
        with:
          username: ${{ secrets.ACRYL_DOCKER_USERNAME }}
          password: ${{ secrets.ACRYL_DOCKER_PASSWORD }}

      - name: Check out the repo
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.setup.outputs.publish == 'true' }}
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        with:
          checkout-head-only: true

      - name: Download build Metadata
        if: ${{ needs.setup.outputs.publish == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-metadata-${{ needs.setup.outputs.tag }}
          path: ${{ github.workspace }}/build

      - name: Set up Docker Buildx
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.setup.outputs.publish == 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Tag images with quickstart (coordinated floating tag)
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.setup.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          source .github/scripts/docker_helpers.sh
          # :sha-* images were pushed during the coordinated depot bake; add :quickstart here only.
          depot bake -f "${{ github.workspace }}/build/bake-spec-allImages.json" --print | jq -cr '.target[].tags[]' | while IFS= read -r image; do
            if [[ -z "$image" ]]; then
              continue
            fi
            if [[ "$image" != *":${SHA_TAG}" && "$image" != *":${SHA_TAG}-"* ]]; then
              continue
            fi
            quickstartImage="${image/${SHA_TAG}/${QUICKSTART_TAG}}"
            echo "Tagging $image as $quickstartImage"
            docker buildx imagetools create -t "$quickstartImage" "$image"
          done

  deploy_datahub_head:
    name: Deploy to Datahub HEAD
    runs-on: ubuntu-24.04
    needs:
      [
        setup,
        java_integration_tests,
        pytest_tests,
        playwright_test,
        publish_images,
      ]
    if: ${{ needs.publish_images.result == 'success' && github.repository_owner == 'datahub-project' && needs.setup.outputs.repository_name == 'datahub' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_SQS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SQS_ACCESS_KEY }}
          aws-region: us-west-2
      - uses: isbang/sqs-action@7cdb8b5d1328c6af489ef4614fbafb364bf096ea # v0.2.0
        with:
          sqs-url: ${{ secrets.DATAHUB_HEAD_SYNC_QUEUE }}
          message: '{ "command": "git-sync", "args" : {"repoName": "${{ needs.setup.outputs.repository_name }}", "repoOrg": "${{ github.repository_owner }}", "repoBranch": "${{ needs.setup.outputs.branch_name }}", "repoShaShort": "${{ needs.setup.outputs.short_sha }}", "repoShaTag": "${{ needs.setup.outputs.tag }}" }}'
