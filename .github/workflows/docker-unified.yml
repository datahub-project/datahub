name: Docker Build, Scan, Test
on:
  workflow_dispatch:
    inputs:
      profileName:
        description: "Profile name for the smoke-test. Defaults to quickstart-consumers if not specified"
        required: false
        default: "quickstart-consumers"
        type: string
      playwright_shard_count:
        description: "Number of parallel shards for Playwright E2E tests"
        required: false
        default: "5"
        type: string
      embedding_model:
        description: "Ollama embedding model for the AI smoke test (local embeddings)"
        required: false
        default: "nomic-embed-text"
        type: string
  push:
    branches:
      - master
      - releases/**
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/docker-unified.yml"
      - ".github/scripts/send_failed_tests_to_posthog.py"
      - ".github/scripts/send_smart_selection_to_posthog.py"
      # Smart-testing classifier, selection and batch planning (pytest wiring).
      - ".github/smart-testing/**"
      - "!.github/smart-testing/**.md"
      - ".github/scripts/docker_helpers.sh"
      - ".github/scripts/resolve_image_builds.sh"
      - ".github/scripts/test_resolve_image_builds.sh"
      - ".github/workflows/resusable-playwright-tests.yml"
      - ".github/workflows/reusable-playwright-report.yml"
      - ".github/scripts/plan_playwright_tier.py"
      - ".github/scripts/split_playwright_tests.py"
      - ".github/actions/ci-optimization"
      - ".github/actions/restore-dependency-caches"
      - ".github/actions/configure-fast-apt-mirror"
      - ".github/scripts/check_python_package.py"
      - ".github/scripts/parse_failed_pytest_tests.py"
      - ".github/scripts/docker_logs.sh"
      - ".github/actions/smoke-test-retry"
      - ".github/actions/report-test-results/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!.github/**"
      - ".github/workflows/docker-unified.yml"
      - ".github/scripts/send_failed_tests_to_posthog.py"
      - ".github/scripts/send_smart_selection_to_posthog.py"
      # Smart-testing classifier, selection and batch planning (pytest wiring).
      - ".github/smart-testing/**"
      - "!.github/smart-testing/**.md"
      - ".github/scripts/docker_helpers.sh"
      - ".github/scripts/resolve_image_builds.sh"
      - ".github/scripts/test_resolve_image_builds.sh"
      - ".github/workflows/resusable-playwright-tests.yml"
      - ".github/workflows/reusable-playwright-report.yml"
      - ".github/scripts/plan_playwright_tier.py"
      - ".github/scripts/split_playwright_tests.py"
      - ".github/actions/ci-optimization"
      - ".github/actions/restore-dependency-caches"
      - ".github/actions/configure-fast-apt-mirror"
      - ".github/scripts/check_python_package.py"
      - ".github/scripts/parse_failed_pytest_tests.py"
      - ".github/scripts/docker_logs.sh"
      - ".github/actions/smoke-test-retry"
      - ".github/actions/report-test-results/**"
  release:
    types: [published]

concurrency:
  # Using `github.run_id` (unique val) instead of `github.ref` here
  # because we don't want to cancel this workflow on master only for PRs
  #   as that makes reproducing issues easier
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: "acryldata"
  PROFILE_NAME: "${{ github.event.inputs.profileName || 'quickstart-consumers' }}"

  DOCKER_CACHE: "DEPOT"
  DEPOT_PROJECT_ID: "${{ vars.DEPOT_PROJECT_ID }}"
  HAS_DEPOT_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'depot') }}
  IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  DEPOT_TOKEN: "${{ secrets.DEPOT_TOKEN }}"
  PLAYWRIGHT_SHARD_COUNT: "8"

permissions:
  contents: read
  id-token: write

jobs:
  # Announce build start in the release Slack channel when a GitHub release is
  # published, linking to this run. Non-blocking: never gates the actual build.
  # Only fires on release events — not on ordinary pushes to releases/**
  # branches, which would notify on every merge.
  notify_release_build_start:
    name: Notify Release Channel of Build Start
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions/notify-release-channel
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Notify release channel of build start
        continue-on-error: true
        uses: ./.github/actions/notify-release-channel
        with:
          version: ${{ github.event.release.tag_name }}
          emoji: ":hammer_and_wrench:"
          message: "*Docker build started* for `${{ github.event.release.tag_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
          slack-bot-token: ${{ secrets.CI_NOTIFIER_SLACK_BOT_TOKEN }}

  setup:
    runs-on: depot-ubuntu-24.04-small
    outputs:
      # TODO: Many of the vars below should not be required anymore.
      tag: ${{ steps.tag.outputs.tag }}
      slim_tag: ${{ steps.tag.outputs.slim_tag }}
      full_tag: ${{ steps.tag.outputs.full_tag }}
      short_sha: ${{ steps.tag.outputs.short_sha }} # needed for auto-deploy
      unique_tag: ${{ steps.tag.outputs.unique_tag }}
      unique_slim_tag: ${{ steps.tag.outputs.unique_slim_tag }}
      unique_full_tag: ${{ steps.tag.outputs.unique_full_tag }}
      docker-login: ${{ steps.docker-login.outputs.docker-login }}
      publish: ${{ steps.publish.outputs.publish }}
      pr-publish: ${{ steps.pr-publish.outputs.publish }}
      python_release_version: ${{ steps.tag.outputs.python_release_version }}
      branch_name: ${{ steps.tag.outputs.branch_name }}
      repository_name: ${{ steps.tag.outputs.repository_name }}
      frontend_change: ${{ steps.ci-optimize.outputs.frontend-change == 'true' || github.event_name != 'pull_request' }}
      actions_change: ${{ steps.ci-optimize.outputs.actions-change == 'true' || github.event_name != 'pull_request'}}
      ingestion_change: ${{ steps.ci-optimize.outputs.ingestion-change == 'true' || github.event_name != 'pull_request' }}
      ingestion_base_change: ${{ steps.ci-optimize.outputs.ingestion-base-change == 'true' }}
      backend_change: ${{ steps.ci-optimize.outputs.backend-change == 'true' || github.event_name != 'pull_request' }}
      frontend_only: ${{ steps.ci-optimize.outputs.frontend-only == 'true' }}
      ingestion_only: ${{ steps.ci-optimize.outputs.ingestion-only == 'true' }}
      connector_source_only: ${{ steps.ci-optimize.outputs.connector-source-only == 'true' }}
      backend_only: ${{ steps.ci-optimize.outputs.backend-only == 'true' }}
      kafka_setup_change: ${{ steps.ci-optimize.outputs.kafka-setup-change == 'true' }}
      smoke_test_change: ${{ steps.ci-optimize.outputs.smoke-test-change == 'true' }}
      # docker-unified.yml, .github/smart-testing and the local actions pytest_tests uses. Active mode
      # turns this into a canary; shadow and off leave pytest closed.
      pytest_workflow_change: ${{ steps.ci-optimize.outputs.pytest-workflow-change == 'true' }}
      java_client_change: ${{ steps.ci-optimize.outputs.java-client-change == 'true' || github.event_name != 'pull_request' }}
      playwright_change: ${{ steps.ci-optimize.outputs.playwright-change == 'true' }}
      embedding_ai_change: ${{ steps.ci-optimize.outputs.embedding-ai-change == 'true' || github.event_name != 'pull_request' }}

      build_runner_type: ${{ steps.set-runner.outputs.build_runner_type }}
      test_runner_type: ${{ steps.set-runner.outputs.test_runner_type }}
      test_runner_type_small: ${{ steps.set-runner.outputs.test_runner_type_small }}
      use_depot_cache: ${{ steps.set-runner.outputs.use_depot_cache }}
      uv_cache_key: ${{ steps.uv-cache-key.outputs.uv_cache_key }}
      uv_cache_key_prefix: ${{ steps.uv-cache-key.outputs.uv_cache_key_prefix }}
      yarn_cache_key: ${{ steps.yarn-cache-key.outputs.yarn_cache_key }}
      yarn_cache_key_prefix: ${{ steps.yarn-cache-key.outputs.yarn_cache_key_prefix }}
      playwright_matrix: ${{ steps.set-playwright-matrix.outputs.matrix }}
      # Pull requests run only the p0 tier while the PYTEST_P0_SMOKE repository
      # variable is 'true'; post-merge pushes -- and the default with the
      # variable unset -- always run the full suite. smoke.sh reads it as
      # SMOKE_TIER.
      #
      # The `run-all-tests` label (both suites) or `run-all-tests:pytest` (pytest
      # only) opts a single PR back into the whole suite, for
      # changes whose blast radius is wider than their own touched modules
      # (shared fixtures, conftest, a broad refactor). Like every other label
      # this workflow honours (`depot`, `publish`, `build-images`, ...) it is
      # read from the event payload, so it takes effect on the PR's next push
      # rather than the moment it is applied -- `labeled` is deliberately absent
      # from the trigger types above, because pr-labeler.yml labels every PR on
      # open and would double this workflow's runs.
      #
      # This is the default tier only: smoke_test_matrix owns the final tier
      # (its smoke_tier output) and replaces it under active smart testing.
      smoke_tier: >-
        ${{
          (github.event_name == 'pull_request'
            && vars.PYTEST_P0_SMOKE == 'true'
            && !contains(github.event.pull_request.labels.*.name, 'run-all-tests')
            && !contains(github.event.pull_request.labels.*.name, 'run-all-tests:pytest'))
          && 'p0' || 'full'
        }}
      # Test modules this PR touches; conftest runs these alongside the p0
      # tier. Empty on a full run.
      smoke_changed_tests: ${{ steps.smoke-tier.outputs.changed_tests }}
      smoke_build_task: ${{ steps.smoke-profile.outputs.smoke_build_task }}
      smoke_profile_name: ${{ steps.smoke-profile.outputs.smoke_profile_name }}
      # Gradle modules base_build has to bake; empty means every image in the
      # quickstart set can be reused as-is.
      image_build_modules: ${{ steps.image-build-plan.outputs.image_build_modules }}
      # KEY=VALUE lines pinning each reused image to the exact digest
      # `quickstart` resolved to when the plan ran (quickstart@sha256:...), not
      # the bare floating tag, so every job in this run uses the identical
      # image even if master finishes a build and moves the tag mid-run. Jobs
      # that boot a stack append these to $GITHUB_ENV before calling
      # run-quickstart.sh; images absent from the map fall back to DATAHUB_VERSION.
      image_version_env: ${{ steps.image-build-plan.outputs.image_version_env }}
      # Docker repos baked for this run. run-quickstart.sh fails if any of them
      # resolves to the reused tag instead of this PR's.
      image_built_repos: ${{ steps.image-build-plan.outputs.image_built_repos }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
        # Explicitly checkout head commit, as tag computation depends on it
        with:
          checkout-head-only: true
      - name: Compute Tag
        id: tag
        env:
          GITHUB_REF_FALLBACK: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref}}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source .github/scripts/docker_helpers.sh
          {
            echo "short_sha=${SHORT_SHA}"
            echo "tag=$(get_tag)"
            echo "slim_tag=$(get_tag_slim)"
            echo "full_tag=$(get_tag_full)"
            echo "unique_tag=$(get_unique_tag)"
            echo "unique_slim_tag=$(get_unique_tag_slim)"
            echo "unique_full_tag=$(get_unique_tag_full)"
            echo "python_release_version=$(get_python_docker_release_v)"
            echo "branch_name=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            echo "repository_name=${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"
      - name: Check whether docker login is possible
        id: docker-login
        env:
          ENABLE_DOCKER_LOGIN: ${{ secrets.ACRYL_DOCKER_USERNAME != '' && secrets.ACRYL_DOCKER_PASSWORD != '' }}
        run: |
          echo "Enable Docker Login: ${{ env.ENABLE_DOCKER_LOGIN }}"
          echo "docker-login=${{ env.ENABLE_DOCKER_LOGIN }}" >> "$GITHUB_OUTPUT"
      - name: Check whether publishing enabled
        id: publish
        env:
          ENABLE_PUBLISH: >-
            ${{
               (github.event_name == 'release' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push')  && github.ref == 'refs/heads/master'))
               && ( secrets.ACRYL_DOCKER_USERNAME != '' && secrets.ACRYL_DOCKER_PASSWORD != '' )
            }}
        run: |
          echo "Enable publish: ${{ env.ENABLE_PUBLISH }}"
          echo "publish=${{ env.ENABLE_PUBLISH }}" >> "$GITHUB_OUTPUT"
      - name: Check whether PR publishing enabled
        id: pr-publish
        env:
          ENABLE_PUBLISH: >-
            ${{
               (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'publish') || contains(github.event.pull_request.labels.*.name, 'publish-docker')))
               && ( secrets.ACRYL_DOCKER_USERNAME != '' && secrets.ACRYL_DOCKER_PASSWORD != '' )
            }}
        run: |
          echo "Enable PR publish: ${{ env.ENABLE_PUBLISH }}"
          echo "publish=${{ env.ENABLE_PUBLISH }}" >> "$GITHUB_OUTPUT"

      - name: Resolve smoke test profile from PR label
        id: smoke-profile
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          CONFIG_KEY=$(echo "$PR_LABELS" | jq -r '[.[] | select(startswith("smoke:"))] | first // empty' | sed 's/^smoke://')
          if [[ -z "$CONFIG_KEY" ]]; then
            echo "No smoke: label found, using defaults"
            exit 0
          fi
          echo "Found smoke label config key: $CONFIG_KEY"
          # One line: "<profile>|<space-separated modules>". tail -1 drops Gradle noise.
          RESOLVED=$(./gradlew :docker:resolveQuickstartProfile -PconfigKey="$CONFIG_KEY" -q 2>&1 | tail -1)
          PROFILE_NAME="${RESOLVED%%|*}"
          SMOKE_MODULES="${RESOLVED#*|}"
          if [[ -z "$PROFILE_NAME" || "$PROFILE_NAME" == "$RESOLVED" ]]; then
            echo "::error::Failed to resolve profile for config key: $CONFIG_KEY (got: ${RESOLVED})"
            exit 1
          fi
          echo "Resolved compose profile: $PROFILE_NAME"
          echo "Resolved image modules: ${SMOKE_MODULES:-<none>}"
          {
            echo "smoke_build_task=:docker:buildImages${CONFIG_KEY}"
            echo "smoke_profile_name=${PROFILE_NAME}"
            echo "smoke_build_modules=${SMOKE_MODULES}"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/ci-optimization
        id: ci-optimize

      # ~1s, and it is the only thing that notices when the path classification
      # in resolve_image_builds.sh drifts out of sync with the repo layout.
      - name: Test the image build decision
        run: .github/scripts/test_resolve_image_builds.sh

      - name: Resolve which images to build
        id: image-build-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Escape hatch: force a full build of every image regardless of what
          # changed. Matches the existing label convention (`depot`, `publish`).
          # Reach for it when the reuse path is suspected of serving stale images.
          FULL_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'build-images') }}
          IS_FORK: ${{ env.IS_FORK }}
          PR_PUBLISH: ${{ steps.pr-publish.outputs.publish }}
          SMOKE_BUILD_TASK: ${{ steps.smoke-profile.outputs.smoke_build_task }}
          SMOKE_MODULES: ${{ steps.smoke-profile.outputs.smoke_build_modules }}
          CHANGED_FILES: ${{ steps.ci-optimize.outputs.changed-files }}
        run: .github/scripts/resolve_image_builds.sh

      - name: Resolve smoke-test tier inputs
        id: smoke-tier
        env:
          CHANGED_FILES: ${{ steps.ci-optimize.outputs.changed-files }}
        run: |
          files=""
          if [[ -n "${CHANGED_FILES:-}" ]] && jq -e 'type == "array"' <<<"$CHANGED_FILES" >/dev/null 2>&1; then
            files=$(jq -r '.[]' <<<"$CHANGED_FILES")
          fi

          # Test modules this PR touches; conftest runs these alongside the p0
          # tier (SMOKE_CHANGED_TESTS). Only tests/e2e is collected by the smoke
          # run (pyproject testpaths); unit/zdu/oauth/... modules would never
          # match and only trigger conftest's unmatched-path warning.
          changed=$(printf '%s\n' "$files" \
            | grep -E '^smoke-test/tests/e2e/(.*/)?(test_.*|.*_test)\.py$' || true)
          echo "changed_tests=$(printf '%s' "$changed" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed smoke test modules: $(printf '%s' "$changed" | tr '\n' ' ')"

          # Which knobs decided this run's tier, so a surprising selection is
          # diagnosable from the log alone.
          echo "PYTEST_P0_SMOKE=${{ vars.PYTEST_P0_SMOKE }}" \
               "run-all-tests label=${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-all-tests') }}" \
               "run-all-tests:pytest label=${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-all-tests:pytest') }}"

      - name: Determine runner type
        id: set-runner
        # This needs to handle two scenarios:
        # 1. Running on a PR from a fork. We use github runners, unless the "depot" label exists -- in which case, we run
        #    it on depotNote, concurrency is lower when using github runners, queue times can be longer, test time is longer
        #    due to fewer parallel jobs.
        # 3. Running on a PR from a branch in the datahub-project org and push/schedule events on master.
        #    Depot is used here for remote container builds in base_build and also for all runners. Depot runners support unlimited concurrency
        #    and hence short queue times and higher parallelism of smoke tests
        run: |
          if [[ "${{ env.DOCKER_CACHE }}" == "DEPOT" && "${{ env.IS_FORK }}" == "false" ]]; then
            {
              echo "build_runner_type=depot-ubuntu-24.04-4"
              echo "test_runner_type=depot-ubuntu-24.04-4"
              echo "test_runner_type_small=depot-ubuntu-24.04-small"
              echo "use_depot_cache=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "build_runner_type=ubuntu-24.04" >> "$GITHUB_OUTPUT"
            if [[ "${{ env.HAS_DEPOT_LABEL }}" == "true" ]]; then
              {
                echo "test_runner_type=depot-ubuntu-24.04-4"
              } >> "$GITHUB_OUTPUT"
            else
              # Fork PRs on ubuntu-24.04 build Docker images locally during the job
              # (no Depot cache available), which easily exceeds the 20-minute budget.
              # Give these runs extra headroom.
              {
                echo "test_runner_type=ubuntu-24.04"
              } >> "$GITHUB_OUTPUT"
            fi
            {
              echo "test_runner_type_small=ubuntu-24.04"
              echo "use_depot_cache=false"
            } >> "$GITHUB_OUTPUT"
            # publishing is currently only supported via depot
          fi

      - name: Compute UV Cache Key
        id: uv-cache-key
        run: |
          echo "uv_cache_key=docker-unified-${{ runner.os }}-uv-${{ hashFiles(
            './datahub-actions/pyproject.toml',
            './datahub-actions/setup.py',
            './smoke-test/requirements.txt',
            './smoke-test/pyproject.toml',
            './metadata-ingestion/pyproject.toml',
            './metadata-ingestion/setup.py') }}" >> "$GITHUB_OUTPUT"
          echo "uv_cache_key_prefix=docker-unified-${{ runner.os }}-uv-" >> "$GITHUB_OUTPUT"

      - name: Compute Yarn Cache Key
        id: yarn-cache-key
        run: |
          echo "yarn_cache_key=docker-unified-${{ runner.os }}-yarn-${{ hashFiles('./datahub-web-react/yarn.lock') }}" >> "$GITHUB_OUTPUT"
          echo "yarn_cache_key_prefix=docker-unified-${{ runner.os }}-yarn-" >> "$GITHUB_OUTPUT"

      - name: Build Playwright shard matrix
        id: set-playwright-matrix
        if: ${{ steps.publish.outputs.publish == 'true' || steps.ci-optimize.outputs.backend-change == 'true' || steps.ci-optimize.outputs.frontend-change == 'true' || steps.ci-optimize.outputs.playwright-change == 'true' }}
        run: |
          shard_count=$(( ${{ github.event.inputs.playwright_shard_count || env.PLAYWRIGHT_SHARD_COUNT }} ))
          matrix=''
          for i in $(seq 1 "$shard_count"); do
            if [[ -n "$matrix" ]]; then
              matrix="$matrix,"
            fi
            matrix="${matrix}{\"shard\":\"$i\",\"shard_count\":\"$shard_count\"}"
          done
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"
          {
            echo "## Playwright Test Matrix"
            echo ""
            echo "| Strategy | Total Shards |"
            echo "|----------|--------------|"
            echo "| playwright | $shard_count |"
          } >> "$GITHUB_STEP_SUMMARY"

  base_build:
    name: Build all images
    runs-on: ${{ needs.setup.outputs.build_runner_type }}
    needs: setup
    timeout-minutes: 60
    if: ${{ needs.setup.outputs.use_depot_cache == 'true' }} # On fork, smoke test job does the build since depot cache is not available
    # This job always runs, even when every image can be reused, because three
    # downstream jobs gate on it to know that a usable image set exists. When
    # there is nothing to bake it falls through in seconds and reports an empty
    # build id, which those jobs read as "pull nothing from depot".
    env:
      IMAGE_BUILD_MODULES: ${{ needs.setup.outputs.image_build_modules }}
    outputs:
      build_id: ${{ steps.capture-build-id.outputs.build_id }}
      matrix: ${{ steps.capture-build-id.outputs.matrix }}
    steps:
      - name: Report the image build plan
        run: |
          if [[ -z "$IMAGE_BUILD_MODULES" ]]; then
            echo "Nothing to build -- every image is being reused from the quickstart tag."
          else
            echo "Building: $IMAGE_BUILD_MODULES"
          fi

      # Unconditional: the `uses: ./...` steps below are local actions, which
      # can only be resolved out of a checked-out workspace.
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7

      - id: dep-caches
        uses: ./.github/actions/restore-dependency-caches
        if: ${{ env.IMAGE_BUILD_MODULES != '' }}
        with:
          uv_cache_key: ${{ needs.setup.outputs.uv_cache_key }}
          uv_cache_key_prefix: ${{ needs.setup.outputs.uv_cache_key_prefix }}
          yarn_cache_key: ${{ needs.setup.outputs.yarn_cache_key }}
          yarn_cache_key_prefix: ${{ needs.setup.outputs.yarn_cache_key_prefix }}

      # Replaces a hand-rolled actions/cache pair that used the literal key
      # `gradle-plugins-cache`. Actions cache entries are immutable, so the first
      # save on master claimed that name and every save after it failed; the entry
      # froze on 2026-07-22 and was later evicted, leaving this job restoring
      # nothing. Its path globs were also Gradle 7 (`caches/transforms-*` matches
      # nothing on 8.14). setup-gradle hashes and versions its own keys, splits the
      # buckets, and is what the repo's other 19 workflows already use.
      #
      # cache-read-only defaults to `ref_name != default_branch`, which is the same
      # master-only-write rule the hand-rolled version enforced with an `if:` --
      # important here because pytest_tests and playwright_test each fan out into
      # many concurrent shard jobs sharing this same branch-scoped cache
      # namespace. Restricting writes to master keeps every PR's shards from also
      # saving into it, which would churn/evict entries and contribute to
      # exhausting the repo's 10GB Actions cache budget (see build-cache-1 below).
      #
      # build-cache-1 is excluded: task outputs come from the Depot remote build
      # cache (cache.depot.dev), and including it here is what has been reported to
      # exhaust the repo's 10GB Actions cache budget.
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          java: ${{ env.IMAGE_BUILD_MODULES != '' }}
          python: ${{ env.IMAGE_BUILD_MODULES != '' }}

      - name: Set up Depot CLI
        if: ${{ env.DOCKER_CACHE == 'DEPOT' && env.IMAGE_BUILD_MODULES != '' }}
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ needs.setup.outputs.docker-login == 'true' && env.IMAGE_BUILD_MODULES != '' }}
        with:
          username: ${{ secrets.ACRYL_DOCKER_USERNAME }}
          password: ${{ secrets.ACRYL_DOCKER_PASSWORD }}

      - id: uv-creds
        if: ${{ env.IMAGE_BUILD_MODULES != '' }}
        uses: ./.github/actions/setup-uv-credentials
        with:
          base_profile: ${{ vars.CI_BASE_UV_DOCKER_PROFILE || 'default' }}
          chainguard_python_identity_id: ${{ vars.CHAINGUARD_PYTHON_IDENTITY_ID }}
          chainguard_python_token: ${{ secrets.CHAINGUARD_PYTHON_TOKEN }}

      - name: Build all Images (For Smoke tests)
        # --max-workers=$(nproc): gradle.properties caps workers at 2 (a laptop-safe
        # default); the runner has 4+ vCPU, so that throttles this multi-module build.
        # Same override build-and-test.yml already applies.
        if: ${{ needs.setup.outputs.publish != 'true' && needs.setup.outputs.pr-publish != 'true' && env.IMAGE_BUILD_MODULES != '' }}
        env:
          SMOKE_BUILD_TASK: ${{ needs.setup.outputs.smoke_build_task }}
        run: |
          # -PbuildModules narrows the default quickstart bake to the images this
          # PR can affect. A smoke: label instead runs that config's buildImages
          # task, which bakes the selected config's modules. The image plan marks
          # those modules build and pins the rest, so -PbuildModules is not
          # passed. workflow_dispatch publishes the full set via buildImagesAll.
          build_modules_flag=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TASK=":docker:buildImagesAll"
          elif [[ -n "$SMOKE_BUILD_TASK" ]]; then
            BUILD_TASK="$SMOKE_BUILD_TASK"
          else
            BUILD_TASK=":docker:buildImagesQuickstart"
            build_modules_flag=("-PbuildModules=$IMAGE_BUILD_MODULES")
          fi
          echo "Using build task: $BUILD_TASK"
          ./gradlew --max-workers="$(nproc)" "$BUILD_TASK" "${build_modules_flag[@]}" -Ptag=${{ needs.setup.outputs.tag }} -PpythonDockerVersion=${{ needs.setup.outputs.python_release_version }} -PdockerRegistry=${{ env.DOCKER_REGISTRY }} -Pdatahub.dependencies.python.uvDockerProfile=${{ steps.uv-creds.outputs.uv_profile }}
      - name: Build all Images (Publish)
        if: ${{ needs.setup.outputs.publish == 'true' || needs.setup.outputs.pr-publish == 'true' }}
        # Push immutable tags (sha-*, pr*, release v*) to the registry during the coordinated depot bake.
        # The floating quickstart tag is applied only after smoke tests pass (see publish_images).
        run: |
          ./gradlew --max-workers="$(nproc)" :docker:buildImagesAll -PmatrixBuild=true  -Ptag=${{ needs.setup.outputs.tag }} -PshaTag=${{ needs.setup.outputs.unique_tag }} -PpythonDockerVersion=${{ needs.setup.outputs.python_release_version }} -PdockerRegistry=${{ env.DOCKER_REGISTRY }} -PdockerPush=true -Pdatahub.dependencies.python.uvDockerProfile=${{ steps.uv-creds.outputs.uv_profile }}
      - name: Capture build Id
        id: capture-build-id
        # Skipped when nothing was baked, leaving build_id empty so the jobs
        # downstream skip their `depot pull` and take every image from the registry.
        if: ${{ env.IMAGE_BUILD_MODULES != '' }}
        run: |
          pip install jq
          DEPOT_BUILD_ID=$(jq -r '.["depot.build"]?.buildID' "${{ github.workspace }}/build/build-metadata.json")

          echo "build_id=${DEPOT_BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c '{"target":.["depot.build"].targets}' "${{ github.workspace }}/build/build-metadata.json")" >> "$GITHUB_OUTPUT"

      - name: Save build Metadata
        if: ${{ needs.setup.outputs.publish == 'true' || needs.setup.outputs.pr-publish == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-metadata-${{ needs.setup.outputs.tag }}
          path: |
            ${{ github.workspace }}/build/build-metadata.json
            ${{ github.workspace }}/build/bake-spec-allImages.json

      # actions/cache/save archives the path before it reserves the key, and a
      # primary-key hit cannot be overwritten. Skip the save on an exact hit so
      # a master push does not spend minutes compressing a cache it will
      # then fail to reserve. 'false' (not != 'true') also skips a save when
      # this job restored nothing.
      - name: Prune uv cache
        if: ${{ github.ref == 'refs/heads/master' && steps.dep-caches.outputs.uv-cache-hit == 'false' }}
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv cache prune --ci
          elif [[ -x "$HOME/.local/bin/uv" ]]; then
            "$HOME/.local/bin/uv" cache prune --ci
          elif [[ -x metadata-ingestion/venv/bin/uv ]]; then
            # Nothing puts uv on PATH here; the image build runs
            # :metadata-ingestion:environmentSetup, which installs it into this venv.
            metadata-ingestion/venv/bin/uv cache prune --ci
          else
            echo "uv not found; saving the uv cache without pruning"
          fi

      - name: Save uv cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/master' && steps.dep-caches.outputs.uv-cache-hit == 'false' }}
        with:
          path: |
            ~/.cache/uv
          key: ${{ needs.setup.outputs.uv_cache_key }}

      - name: Save yarn cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/master' && steps.dep-caches.outputs.yarn-cache-hit == 'false' }}
        with:
          path: |
            ~/.cache/yarn
          key: ${{ needs.setup.outputs.yarn_cache_key }}

  comment_pr_images:
    name: Comment PR image tags
    runs-on: ubuntu-24.04
    needs: [setup, base_build]
    if: ${{ github.event_name == 'pull_request' && needs.setup.outputs.pr-publish == 'true' }}
    permissions:
      pull-requests: write
    steps:
      - name: Upsert PR image comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_TAG: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          REGISTRY: ${{ env.DOCKER_REGISTRY }}
        with:
          script: |
            const marker = '<!-- pr-docker-images -->';
            const { PR_TAG, SHORT_SHA, REGISTRY } = process.env;
            const body = [
              marker,
              '## 🐳 Docker Images Published for Testing',
              '',
              `Images for this PR have been published to the [\`${REGISTRY}\`](https://hub.docker.com/u/${REGISTRY}) Docker Hub registry, tagged \`${PR_TAG}\`.`,
              '',
              'Run DataHub quickstart with these images:',
              '',
              '```bash',
              `DATAHUB_VERSION=${PR_TAG} datahub docker quickstart`,
              '```',
              '',
              'Or pull an individual image, e.g.:',
              '',
              '```bash',
              `docker pull ${REGISTRY}/datahub-gms:${PR_TAG}`,
              '```',
              '',
              `Pinned to commit \`${SHORT_SHA}\`.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  smoke_test_matrix:
    runs-on: ${{ needs.setup.outputs.test_runner_type_small }}
    needs: [setup]
    if: ${{ always() && needs.setup.result == 'success' }}
    # Job-level permissions replace the workflow's, so restate them and add
    # pull-requests: read for classify_pr.py's compare API call.
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    outputs:
      pytest_matrix: ${{ steps.set-matrix.outputs.pytest_matrix }}
      smoke_tier: ${{ steps.set-matrix.outputs.smoke_tier }}
      smart_testing_mode: ${{ steps.resolve-mode.outputs.mode }}
      smart_tags: ${{ steps.set-matrix.outputs.smart_tags }}
      # Selection context for the pytest failure events sent to PostHog.
      # The plan step writes selection before smoke.sh runs, so a failed plan
      # still sets it; the outcome check is what drops it.
      smart_selection: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.selection || '' }}
      smart_confidence: ${{ steps.smart-testing.outputs.confidence }}
      # 'true' when pytest_tests must download pytest-smoke-plan and run only
      # the scopes planned for its batch.
      batch_plan: ${{ steps.set-matrix.outputs.batch_plan }}
    steps:
      - name: Resolve smart testing mode
        id: resolve-mode
        # mode: off | shadow | active (repo var SMART_TESTING_MODE, PRs only).
        # Forks get no OIDC token or secrets for Claude auth, and the run-all-tests or
        # run-all-tests:pytest label opts the PR out of selection entirely, so all of
        # these run with smart testing off.
        run: |
          mode=off
          if [[ "${{ github.event_name }}" == 'pull_request' && "${{ env.IS_FORK }}" != 'true' \
                && "${{ contains(github.event.pull_request.labels.*.name, 'run-all-tests') }}" != 'true' \
                && "${{ contains(github.event.pull_request.labels.*.name, 'run-all-tests:pytest') }}" != 'true' ]]; then
            mode="${{ vars.SMART_TESTING_MODE || 'shadow' }}"
          fi

          run_pytest=false
          if [[ "${{ needs.setup.outputs.backend_change }}" == 'true' || "${{ needs.setup.outputs.smoke_test_change }}" == 'true' || "${{ needs.setup.outputs.publish }}" == 'true' ]]; then
            run_pytest=true
          elif [[ "${{ needs.setup.outputs.connector_source_only }}" == 'true' ]]; then
            # Connector-only changes (source implementations, their tests, docs) don't affect
            # smoke tests. Smoke tests exercise the platform via CLI/SDK/APIs, not individual
            # connectors. Skip to save ~140 min of compute.
            :
          elif [[ "${{ needs.setup.outputs.ingestion_only }}" == 'true' ]]; then
            run_pytest=true
          fi
          # Workflow wiring has no feature tags, so active mode plans a canary
          # (always-run modules plus this PR's changed tests). Shadow and off
          # would start the fixed 4- or 9-batch matrix, so the gate stays
          # closed unless the mode is already active.
          if [[ "${{ needs.setup.outputs.pytest_workflow_change }}" == 'true' && "$mode" == 'active' ]]; then
            run_pytest=true
          fi
          [[ "$run_pytest" == 'true' ]] || mode=off

          echo "Smart testing mode=$mode run_pytest=$run_pytest" \
               "pytest_workflow_change=${{ needs.setup.outputs.pytest_workflow_change }}" \
               "run-all-tests label=${{ contains(github.event.pull_request.labels.*.name, 'run-all-tests') }}" \
               "run-all-tests:pytest label=${{ contains(github.event.pull_request.labels.*.name, 'run-all-tests:pytest') }}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run_pytest=$run_pytest" >> "$GITHUB_OUTPUT"

      - name: Check out the repo
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}

      # Claude Workload Identity Federation: the SDK exchanges this GitHub OIDC
      # JWT for a short-lived token, so no static API key is stored. The JWT
      # expires ~5 minutes after issuance, so fetch it right before the
      # classifier runs.
      - name: Fetch Claude identity token
        id: claude-identity
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        continue-on-error: true
        uses: ./.github/actions/claude-identity-token

      - name: Smart Testing Selection
        id: smart-testing
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        # Never block the workflow: no smart_tags output means the p0 fail-safe
        # (active) or no shadow comparison (shadow).
        continue-on-error: true
        env:
          # ANTHROPIC_API_KEY must stay unset: it outranks federation in the
          # SDK's credential resolution and would silently shadow WIF.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ steps.claude-identity.outputs.token_file }}
          # The classifier reads the PR's own changes (merge-base diff) from
          # the compare API, not ci-optimize's changed-files-path: that is a
          # two-dot diff against the base tip and grows as the base moves on.
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          pip install --quiet -r .github/smart-testing/requirements.txt
          python .github/smart-testing/classify_pr.py 2>&1 | tee /tmp/smart-testing-log.txt
          {
            echo "## Smart Testing Selection (mode: ${{ steps.resolve-mode.outputs.mode }})"
            echo ""
            echo '```'
            grep '^\[smart-testing\]' /tmp/smart-testing-log.txt || echo "No output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smart testing selection artifact
        # Upload on failure too: that is when the log matters most.
        if: ${{ steps.smart-testing.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: smart-testing-selection
          path: /tmp/smart-testing-log.txt
          retention-days: 7

      # The plan collects the suite with smoke.sh (codegen + venv), which needs
      # the same toolchain and package credentials as a pytest batch job.
      - name: Restore dependency caches
        uses: ./.github/actions/restore-dependency-caches
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        with:
          uv_cache_key: ${{ needs.setup.outputs.uv_cache_key }}
          uv_cache_key_prefix: ${{ needs.setup.outputs.uv_cache_key_prefix }}
          yarn_cache_key: ${{ needs.setup.outputs.yarn_cache_key }}
          yarn_cache_key_prefix: ${{ needs.setup.outputs.yarn_cache_key_prefix }}
          # No yarn install runs in this job; skip the ~1.7 GB yarn restore.
          restore_yarn: "false"

      - name: Set up uv credentials
        id: uv-creds
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        uses: ./.github/actions/setup-uv-credentials
        with:
          base_profile: ${{ vars.CI_BASE_UV_DOCKER_PROFILE || 'default' }}
          chainguard_python_identity_id: ${{ vars.CHAINGUARD_PYTHON_IDENTITY_ID }}
          chainguard_python_token: ${{ secrets.CHAINGUARD_PYTHON_TOKEN }}

      - name: Install dependencies
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        run: ./metadata-ingestion/scripts/install_deps.sh

      # smoke.sh installs ../metadata-ingestion as an editable package, so
      # collecting the suite imports datahub.metadata, which only exists once
      # codegen has run (pytest_tests gets it from :metadata-ingestion:install).
      - name: Generate metadata model classes
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        run: ./gradlew :metadata-ingestion:codegen

      - name: Plan pytest batches
        id: plan
        if: ${{ steps.resolve-mode.outputs.mode != 'off' }}
        # A failed plan never blocks: set-matrix falls back to the fixed p0
        # matrix (active) or just skips the shadow summary.
        continue-on-error: true
        env:
          RUN_QUICKSTART: "false"
          TEST_STRATEGY: plan
          SMOKE_SMART_TAGS: ${{ steps.smart-testing.outputs.smart_tags }}
          SMOKE_CHANGED_TESTS: ${{ needs.setup.outputs.smoke_changed_tests }}
          SMOKE_DUMP_BATCH_PLAN: ${{ github.workspace }}/pytest-smoke-plan/pytest-smoke-plan.json
          # Recorded in the plan so a later reader can tell an applied plan
          # (active) from a computed-only one (shadow). Not SMOKE_SMART_TESTING,
          # which would turn on conftest's own filtering during collection.
          SMOKE_PLAN_SMART_MODE: ${{ steps.resolve-mode.outputs.mode }}
          # Must match pytest_tests: batch weighting models this many workers.
          PYTEST_XDIST_WORKERS: "3"
          # Fewest batches (up to this cap) whose predicted pytest time meets
          # 8 min, or the slowest single scope when that alone is longer.
          PLAN_MAX_BATCHES: "9"
        # selection.py names the selection (smart, plumbing, canary or p0).
        run: .github/smart-testing/plan_pytest_batches.sh

      - name: Upload batch plan
        if: ${{ steps.resolve-mode.outputs.mode != 'off' && steps.plan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-smoke-plan
          path: pytest-smoke-plan/pytest-smoke-plan.json
          retention-days: 7

      - name: Set Matrix
        id: set-matrix
        env:
          MODE: ${{ steps.resolve-mode.outputs.mode }}
          RUN_PYTEST: ${{ steps.resolve-mode.outputs.run_pytest }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_TIER: ${{ steps.plan.outputs.smoke_tier }}
          PLAN_SELECTION: ${{ steps.plan.outputs.selection }}
          PLAN_FILE: pytest-smoke-plan/pytest-smoke-plan.json
          SMART_TAGS: ${{ steps.smart-testing.outputs.smart_tags }}
          DEFAULT_TIER: ${{ needs.setup.outputs.smoke_tier }}
        run: |
          emit_matrix() {
            local count=$1 items=""
            batches=$count
            for ((i=0;i<count;i++)); do
              items="${items:+$items,}{\"batch\":\"$i\",\"batch_count\":\"$count\"}"
            done
            echo "pytest_matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          }

          tier=$DEFAULT_TIER
          tags=$SMART_TAGS
          batch_plan=false
          batches=0
          # What the batches run: smart | canary | p0 | full (see the plan step),
          # or none. Only an active, successful plan runs its selection.
          selection=$DEFAULT_TIER

          if [[ "$RUN_PYTEST" != 'true' ]]; then
            echo 'pytest_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            selection=none
          elif [[ "$MODE" == 'active' && "$PLAN_OUTCOME" == 'success' ]]; then
            # Zero planned batches gives an empty matrix: pytest_tests skips.
            tier=$PLAN_TIER
            selection=$PLAN_SELECTION
            batch_plan=true
            emit_matrix "$(jq -r '.batch_count' "$PLAN_FILE")"
          elif [[ "$MODE" == 'active' ]]; then
            echo "::warning::Smart testing plan failed; falling back to the fixed p0 matrix"
            tier=p0
            selection=p0
            tags=''
            emit_matrix 4
          elif [[ "${{ env.IS_FORK }}" == 'true' ]]; then
            emit_matrix 3
          elif [[ "$tier" == 'p0' ]]; then
            # The p0 tier is 357 of 1209 collected tests, so 4 batches carry a
            # lighter per-batch load than the full suite's 9 while cutting the
            # per-batch fixed cost (caches, image pull, quickstart) that dominates
            # a short run. Revisit once p0 batch durations have been measured.
            emit_matrix 4
          else
            # Tests are split simply to ensure the configured number of batches for
            # parallelization. This may need some increase as new tests added
            # increase the duration where an additional parallel batch helps.
            emit_matrix 9
          fi

          {
            echo "smoke_tier=$tier"
            echo "smart_tags=$tags"
            echo "batch_plan=$batch_plan"
            echo "selection=$selection"
          } >> "$GITHUB_OUTPUT"
          echo "Final: mode=$MODE running selection=$selection (tier=$tier) in $batches batch(es), batch_plan=$batch_plan"
          if [[ "$MODE" == 'shadow' && "$PLAN_OUTCOME" == 'success' ]]; then
            echo "Shadow: active mode would run selection=$PLAN_SELECTION (tier=$PLAN_TIER) in $(jq -r '.batch_count' "$PLAN_FILE") planned batch(es)"
          fi

      - name: Render smart testing PR comment
        # Never blocks: the comment is explanatory only.
        if: ${{ always() && steps.resolve-mode.outputs.mode != 'off' && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          SMART_MODE: ${{ steps.resolve-mode.outputs.mode }}
          SMART_CONFIDENCE: ${{ steps.smart-testing.outputs.confidence }}
          FAILSAFE_REASON: ${{ steps.smart-testing.outputs.failsafe_reason }}
          SMART_TAGS: ${{ steps.smart-testing.outputs.smart_tags }}
          SMART_REASONING: ${{ steps.smart-testing.outputs.reasoning }}
          CHANGED_FILES: ${{ steps.smart-testing.outputs.changed_files }}
          SMART_SELECTION: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.selection || '' }}
          SELECTION_APPLIED: ${{ steps.set-matrix.outputs.selection }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_FILE: pytest-smoke-plan/pytest-smoke-plan.json
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_FILE: smart-testing-comment/pytest-section.md
        run: python3 .github/smart-testing/render_comment.py pytest

      - name: Upload smart testing comment
        if: ${{ always() && hashFiles('smart-testing-comment/pytest-section.md') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: smart-testing-comment
          path: smart-testing-comment/pytest-section.md
          retention-days: 7

      - name: Send smart selection telemetry to PostHog
        # One ci_smart_selection event per attempt for pytest. Telemetry only:
        # never fails the job.
        if: ${{ always() && steps.resolve-mode.outputs.mode != 'off' }}
        continue-on-error: true
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          TEST_FRAMEWORK: pytest
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
          # The PR head, not github.sha (the merge ref): the post-merge check
          # matches on the PR's final head commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SMART_MODE: ${{ steps.resolve-mode.outputs.mode }}
          SMART_CONFIDENCE: ${{ steps.smart-testing.outputs.confidence }}
          FAILSAFE_REASON: ${{ steps.smart-testing.outputs.failsafe_reason }}
          SMART_TAGS: ${{ steps.smart-testing.outputs.smart_tags }}
          PROPOSED_TAGS: ${{ steps.smart-testing.outputs.proposed_tags }}
          SMART_MODEL: ${{ steps.smart-testing.outputs.model }}
          CLASSIFIER_DURATION_S: ${{ steps.smart-testing.outputs.classifier_duration_s }}
          SMART_SELECTION: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.selection || '' }}
          SELECTION_APPLIED: ${{ steps.set-matrix.outputs.selection }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN_FILE: pytest-smoke-plan/pytest-smoke-plan.json
        run: python3 .github/scripts/send_smart_selection_to_posthog.py

  # Separate from the planning job so it keeps its read-only token; only this
  # job can write to the PR. Posts the pytest section from smoke_test_matrix.
  comment_smart_testing:
    name: Comment smart test selection
    runs-on: ubuntu-24.04
    needs: [setup, smoke_test_matrix]
    # Fork PRs get a read-only token, so there is nothing to post with.
    if: |
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.smoke_test_matrix.outputs.smart_testing_mode != '' && needs.smoke_test_matrix.outputs.smart_testing_mode != 'off'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Check out the comment renderer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/smart-testing

      - name: Download pytest section
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: smart-testing-comment
          path: smart-testing-comment

      - name: Compose comment
        id: compose
        continue-on-error: true
        env:
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_FILE: smart-testing-comment/comment.md
        run: |
          python3 .github/smart-testing/render_comment.py compose \
            --pytest-section smart-testing-comment/pytest-section.md
          cat "$COMMENT_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert smart testing PR comment
        if: ${{ steps.compose.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- smart-testing-selection -->';
            const body = fs.readFileSync('smart-testing-comment/comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  java_integration_tests:
    name: Java SDK V2 Integration Tests
    runs-on: ${{ needs.setup.outputs.test_runner_type }}
    needs: [setup, base_build]
    if: ${{ always() && !failure() && !cancelled() && (needs.setup.outputs.backend_change == 'true' || needs.setup.outputs.java_client_change == 'true') }}
    steps:
      - name: Check out the repo
        uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7

      - uses: ./.github/actions/restore-dependency-caches
        with:
          uv_cache_key: ${{ needs.setup.outputs.uv_cache_key }}
          uv_cache_key_prefix: ${{ needs.setup.outputs.uv_cache_key_prefix }}
          yarn_cache_key: ${{ needs.setup.outputs.yarn_cache_key }}
          yarn_cache_key_prefix: ${{ needs.setup.outputs.yarn_cache_key_prefix }}
          # Internal runs pull images from Depot and never run yarn; fork PRs build
          # them in-job (yarnInstall), so only they need the ~1.7 GB yarn restore.
          restore_yarn: ${{ needs.setup.outputs.use_depot_cache != 'true' }}

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          gradle: ${{ needs.setup.outputs.use_depot_cache != 'true' }}

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Depot CLI
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' }}
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Login to DockerHub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        if: ${{ needs.setup.outputs.docker-login == 'true' }}
        with:
          username: ${{ secrets.ACRYL_DOCKER_USERNAME }}
          password: ${{ secrets.ACRYL_DOCKER_PASSWORD }}

      - name: Disk Space Analysis
        run: |
          echo "=== Disk Usage Overview ==="
          df -h
          echo -e "\n=== Docker Disk Usage ==="
          docker system df -v

      - id: uv-creds
        if: ${{ needs.setup.outputs.use_depot_cache != 'true' }}
        uses: ./.github/actions/setup-uv-credentials
        with:
          base_profile: ${{ vars.CI_BASE_UV_DOCKER_PROFILE || 'default' }}
          chainguard_python_identity_id: ${{ vars.CHAINGUARD_PYTHON_IDENTITY_ID }}
          chainguard_python_token: ${{ secrets.CHAINGUARD_PYTHON_TOKEN }}

      - name: Build images
        timeout-minutes: 60
        if: ${{ needs.setup.outputs.use_depot_cache != 'true' }}
        env:
          DOCKER_CACHE: GITHUB
        run: |
          BUILD_TASK="${{ needs.setup.outputs.smoke_build_task || ':docker:buildImagesQuickstart' }}"
          echo "Using build task: $BUILD_TASK"
          ./gradlew --max-workers="$(nproc)" $BUILD_TASK -Ptag=${{ needs.setup.outputs.tag }} -PpythonDockerVersion=${{ needs.setup.outputs.python_release_version }} -PdockerRegistry=${{ env.DOCKER_REGISTRY }} -Pdatahub.dependencies.python.uvDockerProfile=${{ steps.uv-creds.outputs.uv_profile }}
          docker images

      - name: Pull images from depot
        if: ${{ needs.setup.outputs.use_depot_cache == 'true' && needs.base_build.outputs.build_id != '' }}
        run: |
          depot pull --project "${{ env.DEPOT_PROJECT_ID }}" "${{ needs.base_build.outputs.build_id }}"
          docker images

      - name: Disk Space Analysis
        run: |
          echo "=== Disk Usage Overview ==="
          df -h
          echo -e "\n=== Docker Disk Usage ==="
          docker system df -v

      - name: Pin reused images to the quickstart tag
        env:
          IMAGE_VERSION_ENV: ${{ needs.setup.outputs.image_version_env }}
        run: |
          # Per-service overrides for the images this PR cannot affect, which are
          # served from the last set that passed smoke tests on master, pinned to
          # the exact digest resolved when the plan ran (not the bare floating
          # `quickstart` tag) so every job in this run uses the same image even
          # if master finishes a build and moves the tag mid-run. Images absent
          # here fall through to DATAHUB_VERSION and come from the depot pull
          # above. Empty on a full build.
          printf '%s' "$IMAGE_VERSION_ENV" | tee -a "$GITHUB_ENV"

      - name: Run quickstart
        env:
          DATAHUB_TELEMETRY_ENABLED: false
          DATAHUB_VERSION: ${{ needs.setup.outputs.tag }}
          DATAHUB_ACTIONS_IMAGE: ${{ env.DATAHUB_ACTIONS_IMAGE }}
          ACTIONS_EXTRA_PACKAGES: "acryl-datahub-actions[executor] acryl-datahub-actions"
          ACTIONS_CONFIG: "https://raw.githubusercontent.com/acryldata/datahub-actions/main/docker/config/executor.yaml"
          PROFILE_NAME: ${{ needs.setup.outputs.smoke_profile_name || env.PROFILE_NAME }}
          EXPECT_PR_TAGGED_IMAGES: ${{ needs.setup.outputs.image_built_repos }}
        run: |
          echo "Using compose profile: $PROFILE_NAME"
          ./smoke-test/run-quickstart.sh

      - name: Disk Check
        run: df -h . && docker images

      - name: Disable ES Disk Threshold
        run: |
          curl -XPUT "http://localhost:9200/_cluster/settings" \
          -H 'Content-Type: application/json' -d'{
            "persistent": {
              "cluster": {
                "routing": {
                  "allocation.disk.threshold_enabled": false
                }
              }
            }
          }'

      - name: Configure fast APT mirror
        if: ${{ vars.CI_USE_FAST_API_MIRROR == 'true' }}
        uses: ./.github/actions/configure-fast-apt-mirror
      - name: Install dependencies
        run: ./metadata-ingestion/scripts/install_deps.sh

      - name: Build datahub cli
        run: ./gradlew :metadata-ingestion:install

      - name: Java SDK V2 Integration Tests
        env:
          DATAHUB_SERVER: http://localhost:8080
          ADMIN_USERNAME: datahub
          ADMIN_PASSWORD: datahub
        run: |
          echo "Running Java SDK V2 integration tests against running DataHub instance..."
          ./gradlew :metadata-integration:java:datahub-client:test --tests "*Integration*"

      - name: Upload Java SDK V2 coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./build/coverage-reports/metadata-integration/java/datahub-client/
          flags: metadata-integration
          name: java-sdk-v2-integration
          fail_ci_if_error: false
          verbose: true
          override_branch: ${{ github.head_ref || github.ref_name }}

      - name: Report test results
        if: (!cancelled())
        uses: ./.github/actions/report-test-results
        with:
          artifact-name: Test Results (java integration tests)
          test-results-paths: |
            **/build/test-results/**/*.xml
            !**/binary/**
          junit-file-globs: |
            **/build/test-results/**/*.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          override_branch: ${{ github.head_ref || github.ref_name }}

      - name: Store logs
        if: failure()
        run: |
          docker ps -a
          TEST_STRATEGY="-java-integration"
          source .github/scripts/docker_logs.sh

      - name: Upload logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: docker-logs-java-integration
          path: "docker_logs/*.log"
          retention-days: 5

  stack_free_smoke_tests:
