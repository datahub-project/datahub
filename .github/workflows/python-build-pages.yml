name: Python Build
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/python-build-pages.yml"
      - "metadata-ingestion/**"
      - "datahub-actions/**"
      - "metadata-ingestion-modules/**"
      - "metadata-models/**"
      - "python-build/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/python-build-pages.yml"
      - "metadata-ingestion/**"
      - "datahub-actions/**"
      - "metadata-ingestion-modules/**"
      - "metadata-models/**"
      - "python-build/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_WHEELS_PROJECT_NAME != '' }}

    name: Python Wheels
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pypi_index_url: ${{ steps.cloudflare.outputs.deployment-url }}
      pypi_index_simple_url: ${{ steps.set-pypi-url.outputs.pypi_index_simple_url }}
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: "temurin"
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - uses: acryldata/sane-checkout-action@186e92cc5948a9c3e1cc7a96eaff9f776f3fc8e3 # v7
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "pip"
      # Restore-only: wheel building populates a much narrower uv cache than the
      # installDev-based jobs sharing this key family; if this job won the first save
      # for a new key, the broader jobs would exact-hit an under-populated cache
      # forever. Master copies are written by documentation.yml and
      # check-datahub-jars.yml, whose builds run :metadata-ingestion:installDev.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('metadata-ingestion/setup.py', 'metadata-ingestion/pyproject.toml', 'metadata-ingestion/uv.lock', 'metadata-ingestion/constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Build Python wheel site
        run: |
          ./gradlew :python-build:buildSite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATAHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # pages-action is unpublished (repo 404); Cloudflare's replacement is wrangler-action.
      # Do not pass gitHubToken: wrangler-action would create a GitHub Deployment named
      # "preview"/"production", colliding with the frontend Pages deploy that Meticulous
      # watches. Connector tests read the wheels URL from this artifact instead.
      - name: Publish
        id: cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: python-build
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_WHEELS_PROJECT_NAME }}

      - name: Set PyPI index URL output
        id: set-pypi-url
        run: |
          DEPLOY_URL="${{ steps.cloudflare.outputs.deployment-url }}"
          PYPI_URL="${DEPLOY_URL}/simple"
          echo "pypi_index_simple_url=$PYPI_URL" >> "$GITHUB_OUTPUT"
          echo "PyPI index URL: $PYPI_URL"

          mkdir -p /tmp/pypi-config
          echo "$DEPLOY_URL" > /tmp/pypi-config/deployment-url.txt
          echo "$PYPI_URL" > /tmp/pypi-config/pypi-index-url.txt
          echo "Base URL: ${DEPLOY_URL}" > /tmp/pypi-config/deployment-info.txt
          echo "Simple URL: $PYPI_URL" >> /tmp/pypi-config/deployment-info.txt

      - name: Upload PyPI config artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pypi-config
          path: /tmp/pypi-config/
          retention-days: 7
