name: Update Test Weights

on:
  schedule:
    # Run every Monday at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * 1"

  workflow_dispatch:
    inputs:
      run_count:
        description: "Number of recent CI runs to analyze (default: 3)"
        required: false
        default: "3"
        type: string

permissions:
  contents: write # To create branches and commits
  actions: read # To fetch workflow runs and artifacts
  pull-requests: write # To create pull requests

jobs:
  update-weights:
    if: github.repository == 'datahub-project/datahub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      create_pr: ${{ steps.decide.outputs.create_pr }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Checks out the triggering ref, so the scripts this workflow calls
          # always come from the same commit as the workflow file itself.
          # Scheduled runs are on the default branch; a workflow_dispatch from a
          # feature branch will produce a PR containing that branch's commits
          # alongside the weight refresh.

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Download smoke test artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading smoke test artifacts from recent successful CI runs..."
          bash .github/scripts/download_test_artifacts.sh \
            --output-dir ./test-artifacts-smoke \
            --run-count ${{ github.event.inputs.run_count || '3' }} \
            --workflow docker-unified.yml \
            --repository ${{ github.repository }}

          echo "Downloading Gradle JUnit artifacts from recent build & test runs..."
          # Backend JUnit artifacts are named build-and-test-* (build-except when sharding is
          # off, backend-shard* when on) — NOT the smoke-test default prefix.
          bash .github/scripts/download_test_artifacts.sh \
            --output-dir ./test-artifacts-gradle \
            --run-count ${{ github.event.inputs.run_count || '3' }} \
            --workflow build-and-test.yml \
            --artifact-prefix "build-and-test" \
            --repository ${{ github.repository }}

          echo "Downloading Playwright JUnit artifacts from recent docker-unified runs..."
          # Named playwright-junit-{shard} by resusable-playwright-tests.yml.
          bash .github/scripts/download_test_artifacts.sh \
            --output-dir ./test-artifacts-playwright \
            --run-count ${{ github.event.inputs.run_count || '3' }} \
            --workflow docker-unified.yml \
            --artifact-prefix "playwright-junit" \
            --repository ${{ github.repository }}
      - name: Download ingestion test artifacts
        id: download-ingestion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading ingestion test artifacts from recent CI runs..."
          DOWNLOAD_OUTPUT=$(bash .github/scripts/download_test_artifacts.sh \
            --output-dir ./test-artifacts-ingestion \
            --run-count ${{ github.event.inputs.run_count || '3' }} \
            --workflow metadata-ingestion.yml \
            --repository ${{ github.repository }} \
            --artifact-prefix "metadata-ingestion-test-results" \
            --allow-failed \
            --no-fail-on-empty)
          echo "$DOWNLOAD_OUTPUT"
          if grep -q '^NO_DATA=true$' <<<"$DOWNLOAD_OUTPUT"; then
            echo "no_data=true" >> "$GITHUB_OUTPUT"
            echo "No harvestable ingestion CI artifacts found this run."
          else
            echo "no_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backup existing weights
        run: |
          mkdir -p ./weights-backup
          cp smoke-test/pytest_test_weights.json ./weights-backup/pytest_weights.json || echo "No existing Pytest weights"
          cp metadata-ingestion/tests/integration_test_weights.json \
            ./weights-backup/integration_test_weights.json || echo "No existing integration weights"
          cp .github/backend_test_weights.json ./weights-backup/gradle_weights.json || echo "No existing Gradle weights"
          cp e2e-test/ui/playwright/playwright_test_weights.json \
            ./weights-backup/playwright_weights.json || echo "No existing Playwright weights"

      - name: Generate smoke test weights
        run: |
          echo "Generating smoke test weights from downloaded artifacts..."
          python .github/scripts/generate_test_weights.py \
            --input-dir ./test-artifacts-smoke \
            --pytest-output smoke-test/pytest_test_weights.json

      - name: Generate ingestion test weights
        if: steps.download-ingestion.outputs.no_data != 'true'
        run: |
          echo "Generating ingestion test weights from downloaded artifacts..."
          python .github/scripts/generate_test_weights.py \
            --input-dir ./test-artifacts-ingestion \
            --pytest-output metadata-ingestion/tests/integration_test_weights.json

      - name: Generate gradle test weights
        run: |
          echo "Generating Gradle backend weights (keyed by FQCN)..."
          python .github/scripts/generate_test_weights.py \
            --input-dir ./test-artifacts-gradle \
            --gradle-output .github/backend_test_weights.json

      - name: Generate playwright test weights
        run: |
          echo "Generating Playwright weights (keyed by spec file path)..."
          python .github/scripts/generate_test_weights.py \
            --input-dir ./test-artifacts-playwright \
            --playwright-output e2e-test/ui/playwright/playwright_test_weights.json

      - name: Compare smoke weights
        id: compare-smoke
        run: |
          mkdir -p ./weight-stats
          python .github/scripts/compare_test_weights.py \
            --old ./weights-backup/pytest_weights.json \
            --new smoke-test/pytest_test_weights.json \
            --stats-out ./weight-stats/smoke.json \
            --file smoke-test/pytest_test_weights.json \
            --framework "Smoke pytest" \
            --workflow docker-unified.yml \
            --entry-noun tests \
            --batch-hint "python_batch_count in docker-unified.yml (full=7; p0=4; forks=3)" \
            --test-id-key testId \
            --threshold 5.0 \
            --pr-gate threshold \
            --github-output-key create_pr_smoke

      - name: Compare ingestion weights
        id: compare-ingestion
        if: steps.download-ingestion.outputs.no_data != 'true'
        run: |
          mkdir -p ./weight-stats
          python .github/scripts/compare_test_weights.py \
            --old ./weights-backup/integration_test_weights.json \
            --new metadata-ingestion/tests/integration_test_weights.json \
            --stats-out ./weight-stats/ingestion.json \
            --file metadata-ingestion/tests/integration_test_weights.json \
            --framework "Ingestion pytest" \
            --workflow metadata-ingestion.yml \
            --entry-noun tests \
            --batch-hint "metadata-ingestion/tests/conftest.py _INTEGRATION_BATCH_COUNT = 6" \
            --test-id-key testId \
            --threshold 5.0 \
            --pr-gate threshold \
            --github-output-key create_pr_ingestion

      - name: Compare gradle weights
        id: compare-gradle
        run: |
          mkdir -p ./weight-stats
          # Gradle PR gate is any map difference, not the pytest 5% threshold.
          python .github/scripts/compare_test_weights.py \
            --old ./weights-backup/gradle_weights.json \
            --new .github/backend_test_weights.json \
            --stats-out ./weight-stats/gradle.json \
            --file .github/backend_test_weights.json \
            --framework "Gradle (FQCN)" \
            --workflow build-and-test.yml \
            --entry-noun classes \
            --batch-hint "build-and-test.yml backend-test-shard matrix batch 0..5 (6 shards)" \
            --test-id-key testId \
            --pr-gate changed \
            --github-output-key create_pr_gradle

      - name: Compare playwright weights
        id: compare-playwright
        run: |
          mkdir -p ./weight-stats
          # Playwright PR gate is any map difference, not the pytest 5% threshold.
          python .github/scripts/compare_test_weights.py \
            --old ./weights-backup/playwright_weights.json \
            --new e2e-test/ui/playwright/playwright_test_weights.json \
            --stats-out ./weight-stats/playwright.json \
            --file e2e-test/ui/playwright/playwright_test_weights.json \
            --framework "Playwright specs" \
            --workflow docker-unified.yml \
            --entry-noun "spec files" \
            --batch-hint "docker-unified.yml playwright_shard_count default 5" \
            --test-id-key filePath \
            --pr-gate changed \
            --github-output-key create_pr_playwright

      - name: Decide PR creation
        id: decide
        run: |
          if [ "${{ steps.compare-smoke.outputs.create_pr_smoke }}" == "true" ] || [ "${{ steps.compare-ingestion.outputs.create_pr_ingestion }}" == "true" ] || [ "${{ steps.compare-gradle.outputs.create_pr_gradle }}" == "true" ] || [ "${{ steps.compare-playwright.outputs.create_pr_playwright }}" == "true" ]; then
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
            echo "✓ At least one suite triggered a weight refresh. Will create PR."
          else
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
            echo "✓ No suite triggered a weight refresh. No PR needed."
          fi

      - name: Create branch and commit changes
        if: steps.decide.outputs.create_pr == 'true'
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch with date
          BRANCH_NAME="auto/update-test-weights-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Add and commit changes for all suites
          git add smoke-test/pytest_test_weights.json
          git add smoke-test/pytest_test_weights_meta.json
          git add metadata-ingestion/tests/integration_test_weights.json
          git add .github/backend_test_weights.json
          git add e2e-test/ui/playwright/playwright_test_weights.json

          git commit -m "chore(test): update test weights from recent CI runs

          Automated update of smoke and ingestion test weights based on analysis of recent CI runs.
          This improves batch balancing and reduces overall CI execution time.

          Generated by: ${{ github.workflow }} workflow
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Push branch
          git push origin "$BRANCH_NAME"

          # Save branch name for PR creation
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Create pull request
        id: create-pr
        if: steps.decide.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSEMBLE_ARGS=()
          for stats in smoke ingestion gradle playwright; do
            if [ -f "./weight-stats/${stats}.json" ]; then
              ASSEMBLE_ARGS+=("./weight-stats/${stats}.json")
            fi
          done
          python .github/scripts/compare_test_weights.py \
            --assemble "${ASSEMBLE_ARGS[@]}" \
            --output ./pr-body.md

          PR_URL=$(gh pr create \
            --title "chore(test): Update test weights from CI runs ($(date +%Y-%m-%d))" \
            --body-file ./pr-body.md \
            --head "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "✓ Pull request created successfully: $PR_URL"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Test Weight Update Summary"
            echo ""

            if [ "${{ steps.decide.outputs.create_pr }}" == "true" ]; then
              echo "✅ **PR Created**: Changes exceeded 5% threshold"
              echo ""
              echo "Branch: \`$BRANCH_NAME\`"
              echo ""
              echo "Suites triggering the PR:"
              if [ "${{ steps.compare-smoke.outputs.create_pr_smoke }}" == "true" ]; then
                echo "- smoke"
              fi
              if [ "${{ steps.compare-ingestion.outputs.create_pr_ingestion }}" == "true" ]; then
                echo "- ingestion"
              fi
              if [ "${{ steps.compare-gradle.outputs.create_pr_gradle }}" == "true" ]; then
                echo "- gradle (backend)"
              fi
              if [ "${{ steps.compare-playwright.outputs.create_pr_playwright }}" == "true" ]; then
                echo "- playwright"
              fi
            else
              echo "ℹ️ **No PR Created**: Changes below 5% threshold"
              echo ""
              echo "Test weights were updated but the changes were too small to warrant a PR."
            fi

            echo ""
            if [ "${{ steps.download-ingestion.outputs.no_data }}" == "true" ]; then
              echo "⏭️ ingestion: no harvestable artifacts"
            fi

            echo ""
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-slack:
    name: Notify Slack
    needs: update-weights
    if: always() && github.repository == 'datahub-project/datahub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CI_NOTIFIER_SLACK_BOT_TOKEN }}
          CHANNEL: ${{ vars.BUILD_STATUS_NOTIFICATION_SLACK_CHANNEL }}
          PR_URL: ${{ needs.update-weights.outputs.pr_url }}
          CREATE_PR: ${{ needs.update-weights.outputs.create_pr }}
          JOB_STATUS: ${{ needs.update-weights.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "CI_NOTIFIER_SLACK_BOT_TOKEN not set; skipping Slack notification."
            exit 0
          fi
          if [ -z "$CHANNEL" ]; then
            echo "BUILD_STATUS_NOTIFICATION_SLACK_CHANNEL not set; skipping Slack notification."
            exit 0
          fi

          # Decide what (if anything) to post:
          #   - workflow failed/timed out  -> failure notification with a link to the run
          #   - workflow succeeded + PR made -> success notification with a link to the PR
          #   - workflow succeeded, no PR   -> nothing to surface (below threshold); skip
          if [ "$JOB_STATUS" = "failure" ] || [ "$JOB_STATUS" = "timed_out" ]; then
            MESSAGE=":x: *Update Test Weights* workflow failed — <${RUN_URL}|view run>"
          elif [ "$JOB_STATUS" = "success" ] && [ "$CREATE_PR" = "true" ] && [ -n "$PR_URL" ]; then
            MESSAGE=":white_check_mark: *Update Test Weights* created a test-weight refresh PR — <${PR_URL}|view PR>"
          else
            echo "Nothing to notify (status=$JOB_STATUS, create_pr=$CREATE_PR)."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg text "$MESSAGE" \
            '{channel: $channel, text: $text, mrkdwn: true, unfurl_links: false, unfurl_media: false}')

          RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            https://slack.com/api/chat.postMessage)

          echo "Slack response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null \
            || { echo "Slack chat.postMessage call failed"; exit 1; }
