name: Post Workflow Actions
run-name: Post Workflow Actions for ${{ github.event_name == 'workflow_dispatch' && format('run {0}', inputs.run_id) || github.event.workflow_run.name }}

# Triggered when a monitored workflow completes.
# NOTE: workflow_run.workflows does not support wildcards —
# workflow names must be listed explicitly here.
# This workflow is NOT listed, so it will not trigger itself (no recursion).
# Listing workflows that run in PR and Post Commit to the list
on:
  workflow_run:
    workflows:
      - "Airflow Plugin"
      - "build & test"
      - "Check Datahub Jars"
      - "check python dependencies"
      - "CI Cache Warmup"
      - "Dagster Plugin"
      - "DataHub Actions"
      - "DataHub Agent Context"
      - "Docker Build, Scan, Test"
      - "documentation"
      - "Frontend Preview"
      - "GX Plugin"
      - "ingestion smoke"
      - "lint"
      - "Metadata Ingestion"
      - "metadata model generate"
      - "Metadata Models Custom CI"
      - "metadata-io"
      - "Nightly Docker Test"
      - "OAuth Smoke Test"
      - "PR Title Check"
      - "Prefect Plugin"
      - "process boot tests"
      - "Python Build"
      - "Python Tests for github scripts"
      - "Quickstart Test"
      - "Release Tests"
      - "Release Validation"
      - "spark smoke test"
      - "Vercel Preview Cleanup"
      - "Verify Quickstart Compose"
    types:
      - completed

  # Allows manual triggering for ad-hoc testing against any existing workflow run.
  # publish defaults to false so artifacts are not forwarded to downstream by accident.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to collect metrics for"
        required: true
        type: string
      attempt:
        description: "Run attempt number"
        required: false
        type: string
        default: "1"
      publish:
        description: "Publish metrics artifacts downstream"
        required: false
        type: boolean
        default: false
      notify_slack:
        description: "Send Slack failure notification (for testing; production
          notifications fire automatically)"
        required: false
        type: boolean
        default: false
      escape_check:
        description: "Run the smart selection escape check (run_id must be a
          post-merge Docker Build, Scan, Test run)"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  collect-metrics:
    # Never on forks: the publish step needs the org's POSTHOG_API_KEY secret, which
    # forks do not have, so the job fails on every push to every fork otherwise.
    # For push events: only collect metrics for default/release/hotfix branches.
    # All other event types (pull_request, schedule, release, etc.) and workflow_dispatch pass through.
    if: >-
      github.repository_owner == 'datahub-project' && (
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.event != 'push' ||
        github.event.workflow_run.head_branch == github.event.repository.default_branch ||
        startsWith(github.event.workflow_run.head_branch, 'releases/') ||
        startsWith(github.event.workflow_run.head_branch, 'hotfixes/')
      )
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          java: false
          gradle: false
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install requests==2.32.5 posthog==7.9.4 --system

      - name: Collect metrics
        id: collect-metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fall back to workflow_run event values when not triggered manually.
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          ATTEMPT: ${{ inputs.attempt || github.event.workflow_run.run_attempt }}
          # Always publish for automated workflow_run triggers; honour the explicit input for workflow_dispatch.
          PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish == true }}
        run: |
          ARTIFACT_NAME="workflow-metrics-${RUN_ID}-attempt-${ATTEMPT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          cd .github/scripts
          python collect_workflow_metrics.py \
            --run-id "${RUN_ID}" \
            --attempt "${ATTEMPT}" \
            --repo "${{ github.repository }}" \
            --output "${ARTIFACT_NAME}.json"
          # Print workflow summary
          jq -r '
            "## \(.workflow.name // "Workflow"): \(.workflow.conclusion // "unknown")",
            "Duration: \(.workflow.duration_seconds // 0)s | Jobs: \(.jobs | length)",
            "",
            "| Job | Conclusion | Steps | Duration |",
            "|---|---|---|---|",
            (.jobs[] | "| \(.full_name // .name) | \(.conclusion // "unknown") | \(.steps | length) | \(.duration_seconds // 0)s |")
          ' "${ARTIFACT_NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload metrics artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.collect-metrics.outputs.artifact_name }}
          path: .github/scripts/${{ steps.collect-metrics.outputs.artifact_name }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish metrics to PostHog
        if: steps.collect-metrics.outputs.publish == 'true'
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          cd .github/scripts
          python publish_to_posthog.py \
            --input "${{ steps.collect-metrics.outputs.artifact_name }}.json"
      # TODO(devashish.chandra): Save to S3?

  retry-on-failure:
    name: Retry on First Failure
    runs-on: ubuntu-22.04
    # Only retrigger workflows known to have flaky tests, on first failure only,
    # and only when triggered by workflow_run (not workflow_dispatch).
    if: >-
      github.event_name == 'workflow_run' &&
      (
        github.event.workflow_run.name == 'Docker Build, Scan, Test' ||
        github.event.workflow_run.name == 'metadata-io' ||
        github.event.workflow_run.name == 'Nightly Docker Test'
      ) &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    permissions:
      actions: write
    steps:
      - name: Rerun failed jobs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"

  # Notify Slack on CI failure on protected branches.
  # Fires when:
  #   - workflow_dispatch with notify_slack=true (manual testing)
  #   - workflow_run that failed or timed out,
  #       - triggered by schedule/release
  #       - or a push to a protected branch (default, release/*, hotfix/*)
  notify-slack-failure:
    name: Notify Slack on CI failure
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.notify_slack == true)
      || (github.event_name == 'workflow_run'
          && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)
          && (contains(fromJSON('["schedule","release"]'), github.event.workflow_run.event)
              || (github.event.workflow_run.event == 'push'
                  && (github.event.workflow_run.head_branch == github.event.repository.default_branch
                      || startsWith(github.event.workflow_run.head_branch, 'releases/')
                      || startsWith(github.event.workflow_run.head_branch, 'hotfixes/')))))
    uses: ./.github/workflows/notify-slack-status.yml
    secrets: inherit
    with:
      run_id: ${{ inputs.run_id || github.event.workflow_run.id }}
      attempt: ${{ inputs.attempt || github.event.workflow_run.run_attempt }}
      thread_ts_file: ${{ github.event.workflow_run.event != 'schedule' && '.slack-thread-ts.json' || '' }}
      channel: ${{ vars.BUILD_STATUS_NOTIFICATION_SLACK_CHANNEL }}

  # Notify Slack when the Docker build succeeds on a push or release event.
  # Posts a standalone message (not threaded) so it's visible as a positive signal
  # separate from any failure thread on the same commit.
  notify-slack-docker-success:
    name: Notify Slack on Docker build success
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.name == 'Docker Build, Scan, Test'
      && contains(fromJSON('["push","release"]'), github.event.workflow_run.event)
    uses: ./.github/workflows/notify-slack-status.yml
    secrets: inherit
    with:
      run_id: ${{ github.event.workflow_run.id }}
      attempt: ${{ github.event.workflow_run.run_attempt }}
      conclusion: success
      channel: ${{ vars.BUILD_STATUS_NOTIFICATION_SLACK_CHANNEL }}

  # Smart selection escape check: did the merged PR's last run run the pytest
  # tests that fail after merge? Active smart testing runs only planned scopes
  # on PRs, so a test it skipped that the change breaks first fails here.
  # Runs on each final outcome of a post-merge run: a pass (sends a clean
  # result), or a failure after retry-on-failure's rerun. A first-attempt
  # failure is skipped: that rerun is coming, and flaky tests usually pass in it.
  smart-selection-escapes:
    name: Smart selection escape check
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.escape_check == true)
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.name == 'Docker Build, Scan, Test'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == github.event.repository.default_branch
          && (github.event.workflow_run.conclusion == 'success'
              || (github.event.workflow_run.conclusion == 'failure'
                  && github.event.workflow_run.run_attempt > 1)))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read # commit -> merged PR lookup
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve merged PR and its last run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          run=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")
          sha=$(jq -r .head_sha <<<"$run")
          {
            echo "run_id=$RUN_ID"
            echo "run_attempt=$(jq -r .run_attempt <<<"$run")"
            echo "head_sha=$sha"
            echo "head_branch=$(jq -r .head_branch <<<"$run")"
          } >> "$GITHUB_OUTPUT"

          pr=$(gh api "repos/$REPOSITORY/commits/$sha/pulls" \
            | jq -c --arg sha "$sha" '[.[] | select(.merge_commit_sha == $sha)][0] // empty')
          if [[ -z "$pr" ]]; then
            echo "No PR merged as $sha (direct push or sync merge); nothing to check"
            exit 0
          fi
          pr_head=$(jq -r .head.sha <<<"$pr")
          pr_run=$(gh run list -R "$REPOSITORY" --workflow docker-unified.yml \
            --event pull_request --commit "$pr_head" --status completed -L 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$pr_run" ]]; then
            echo "No completed PR run for $pr_head; nothing to check"
            exit 0
          fi
          {
            echo "pr_number=$(jq -r .number <<<"$pr")"
            echo "pr_head_sha=$pr_head"
            echo "pr_run_id=$pr_run"
          } >> "$GITHUB_OUTPUT"

      # The pattern avoids the parentheses in "Test Results (smoke tests)
      # pytests N"; only the pytest batch artifacts contain "pytests ".
      - name: Download post-merge pytest results
        if: steps.resolve.outputs.pr_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*pytests *"
          path: post-merge-junit
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download PR batch plan
        if: steps.resolve.outputs.pr_run_id != ''
        # Absent when smart testing was off or the plan step failed.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytest-smoke-plan
          path: pr-plan
          run-id: ${{ steps.resolve.outputs.pr_run_id }}
          github-token: ${{ github.token }}

      - name: Download PR pytest results
        if: steps.resolve.outputs.pr_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*pytests *"
          path: pr-junit
          run-id: ${{ steps.resolve.outputs.pr_run_id }}
          github-token: ${{ github.token }}

      - name: Compare post-merge failures with the PR's run
        if: steps.resolve.outputs.pr_run_id != ''
        env:
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.resolve.outputs.run_attempt }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_RUN_ID: ${{ steps.resolve.outputs.pr_run_id }}
        run: |
          (cd smoke-test && python3 -m smart_testing.escape_report \
            --plan ../pr-plan/pytest-smoke-plan.json \
            --post-merge-junit-dir ../post-merge-junit \
            --pr-junit-dir ../pr-junit \
            --out ../escape-check.json)
          [[ -f escape-check.json ]] || exit 0

          escapes=$(jq '.escapes | length' escape-check.json)
          {
            echo "## Smart selection escape check"
            echo ""
            echo "Post-merge run [$RUN_ID]($SERVER/$REPOSITORY/actions/runs/$RUN_ID) (attempt $RUN_ATTEMPT) of #$PR_NUMBER, compared with [its last PR run]($SERVER/$REPOSITORY/actions/runs/$PR_RUN_ID)."
            echo ""
            echo "$(jq '.post_merge_failures | length' escape-check.json) post-merge failure(s), $escapes escape(s)."
            if [[ "$escapes" != 0 ]]; then
              echo ""
              echo "These tests failed after merge but did not run on the PR:"
              echo ""
              jq -r '.escapes[] | "- `\(.)`"' escape-check.json
              echo ""
              echo "Tests that were already failing on the branch before this merge are not filtered out."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$escapes" != 0 ]]; then
            echo "::warning::Smart selection escapes for #$PR_NUMBER: $(jq -r '.escapes | join(",")' escape-check.json)"
          fi

      - name: Send escape check to PostHog
        if: steps.resolve.outputs.pr_run_id != ''
        continue-on-error: true
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          RESULT_FILE: ${{ github.workspace }}/escape-check.json
          # The job checks pytest only today; another framework's check sends
          # its own event with its own value.
          TEST_FRAMEWORK: pytest
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.resolve.outputs.run_attempt }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          HEAD_BRANCH: ${{ steps.resolve.outputs.head_branch }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.resolve.outputs.pr_head_sha }}
          PR_RUN_ID: ${{ steps.resolve.outputs.pr_run_id }}
        run: python3 .github/scripts/send_smart_selection_escapes_to_posthog.py
