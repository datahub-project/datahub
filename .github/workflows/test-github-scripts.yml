name: Python Tests for github scripts

on:
  push:
    paths:
      - ".github/scripts/**"
      - ".github/smart-testing/**"
    branches:
      - master
      - releases/**
      - hotfixes/**
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/smart-testing/**"
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: ./.github/actions/setup-toolchain
        with:
          java: false
          gradle: false

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Deps pulled in by the scripts under test: requests/posthog match
          # post-workflow-actions.yml; defusedxml is used by the XML parsers;
          # pyyaml is imported by pre-commit/generate_pre_commit.py.
          pip install pytest requests==2.32.5 posthog==7.9.4 defusedxml pyyaml
          pip install -r .github/smart-testing/requirements.txt

      - name: Run tests
        run: |
          pytest .github/scripts/test .github/scripts/release/test .github/smart-testing/test .github/scripts/pre-commit/tests
