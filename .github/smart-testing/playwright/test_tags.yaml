# Smart Testing — Playwright test tags
#
# Split from the original combined annotations (generated 2026-09-11 by Claude
# Opus batch annotation). Tags come from ../taxonomy.yaml. Read by
# .github/scripts/plan_playwright_tier.py: under active smart testing, the specs
# carrying the PR's feature-user, feature-dev or compound tags replace the @p0
# tests in the Playwright PR tier. A path's tags come from its exact entry, else
# its longest matching glob, across this file and test_tags.overlay.yaml when
# present.

version: 1

