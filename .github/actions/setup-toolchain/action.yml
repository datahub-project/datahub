name: Setup toolchain
description: >-
  Installs the Java, Python and Node versions CI builds with, uv next to
  Python, and configures Gradle caching. Pins each action's SHA and default
  in one place; a workflow overrides only what a job needs differently.
  Local-dev pins live in mise.toml and are intentionally independent of
  these defaults. Gradle itself comes from the wrapper.

inputs:
  java:
    description: Install Java (Temurin)
    default: "true"
  java-version:
    description: setup-java java-version. Multi-line installs several JDKs; the last one is the default.
    default: "25"
  python:
    description: Install Python and uv
    default: "true"
  python-version:
    description: setup-python python-version
    default: "3.11"
  gradle:
    description: Run gradle/actions/setup-gradle (Gradle User Home caching)
    default: "true"
  gradle-cache-read-only:
    description: setup-gradle cache-read-only. Default mirrors setup-gradle's own (read-only off the default branch).
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
  gradle-home-cache-excludes:
    description: setup-gradle gradle-home-cache-excludes. Empty caches everything.
    default: caches/build-cache-1
  node:
    description: Install Node
    default: "false"
  node-version:
    description: setup-node node-version
    default: "22"

runs:
  using: composite
  steps:
    - if: inputs.java == 'true'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - if: inputs.python == 'true'
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ inputs.python-version }}
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        # restore-dependency-caches owns the uv cache on both cache backends.
        enable-cache: false
    - if: inputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
        gradle-home-cache-excludes: ${{ inputs.gradle-home-cache-excludes }}
    - if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
