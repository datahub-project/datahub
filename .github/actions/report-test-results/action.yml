name: Report Test Results
description: Upload test results as an artifact and publish a job summary to Github

inputs:
  artifact-name:
    description: "Name of the uploaded artifact"
    required: false
    default: "test-results"
  test-results-paths:
    description: "Paths to the test results directories to upload (one per line)"
    required: true
  junit-file-globs:
    description: "Glob patterns for JUnit XML files to publish (one per line)"
    required: true
  retention-days:
    description: "Number of days to retain the uploaded artifact (default: 7)"
    required: false
    default: "7"

runs:
  using: composite
  steps:
    - name: Upload test results
      if: (!cancelled())
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.test-results-paths }}
        overwrite: true
        retention-days: ${{ inputs.retention-days }}

    - name: Publish test results
      if: (!cancelled())
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
      with:
        paths: ${{ inputs.junit-file-globs }}
        show: fail
