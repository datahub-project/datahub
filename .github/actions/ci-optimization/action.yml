name: "Identify CI Optimizations"
description: "Determine if code changes are specific to certain modules."

outputs:
  frontend-only:
    description: "Frontend only change"
    value: ${{ steps.filter.outputs.frontend == 'true' && steps.filter.outputs.ingestion == 'false' && steps.filter.outputs.backend == 'false' }}
  ingestion-only:
    description: "Ingestion only change"
    value: ${{ steps.filter.outputs.frontend == 'false' && steps.filter.outputs.ingestion == 'true' && steps.filter.outputs.backend == 'false' }}
  backend-only:
    description: "Backend only change"
    value: ${{ steps.filter.outputs.frontend == 'false' && steps.filter.outputs.ingestion == 'false' && steps.filter.outputs.backend == 'true' }}
  connector-source-only:
    description: "Only connector source/test files changed (no ingestion core, no backend, no frontend)"
    value: ${{ steps.filter.outputs.ingestion == 'true' && steps.filter.outputs.ingestion-core == 'false' && steps.filter.outputs.backend == 'false' && steps.filter.outputs.frontend == 'false' }}
  backend-change:
    description: "Backend code has changed"
    value: ${{ steps.filter.outputs.backend == 'true' ||  steps.trigger.outputs.trigger == 'manual' }}
  ingestion-change:
    description: "Ingestion code has changed"
    value: ${{ steps.filter.outputs.ingestion == 'true' || steps.trigger.outputs.trigger == 'manual' }}
  ingestion-base-change:
    description: "Ingestion base image docker image has changed"
    value: ${{ steps.filter.outputs.ingestion-base == 'true' }}
  frontend-change:
    description: "Frontend code has changed"
    value: ${{ steps.filter.outputs.frontend == 'true' || steps.trigger.outputs.trigger == 'manual' }}
  docker-change:
    description: "Docker code has changed"
    value: ${{ steps.filter.outputs.docker == 'true' }}
  kafka-setup-change:
    description: "Kafka setup docker change"
    value: ${{ steps.filter.outputs.kafka-setup == 'true' }}
  smoke-test-change:
    description: "Smoke test change"
    value: ${{ steps.filter.outputs.smoke-test == 'true' || steps.trigger.outputs.trigger == 'manual' }}
  changed-files:
    description: >
      JSON array of every changed path. Consumers that need to reason about
      paths no filter below claims -- deciding whether a previously published
      docker image can be reused, for instance -- cannot do it from the boolean
      filters, which only ever say "at least one file matched".
    value: ${{ steps.filter.outputs.all_files }}
  actions-change:
    description: "Actions code has changed"
    value: ${{ steps.filter.outputs.actions == 'true' }}
  java-client-change:
    description: "Java client code has changed"
    value: ${{ steps.filter.outputs.java-client == 'true' || steps.trigger.outputs.trigger == 'manual' }}
  playwright-change:
    description: "Playwright E2E test code has changed"
    value: ${{ steps.filter.outputs.playwright-test == 'true' || steps.trigger.outputs.trigger == 'manual' }}
  embedding-ai-change:
    description: "Local embedding provider / semantic search code has changed"
    value: ${{ steps.filter.outputs.embedding-ai == 'true' || steps.trigger.outputs.trigger == 'manual' }}

runs:
  using: "composite"
  steps:
    - name: Check trigger type
      id: trigger # Add an ID to reference this step
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "trigger=manual" >> $GITHUB_OUTPUT
        else
          echo "trigger=pr" >> $GITHUB_OUTPUT
        fi
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        list-files: json
        # some-with-excludes: a file matches if it hits a positive glob and no ! glob.
        # Filters without ! keep the old `some` behavior.
        predicate-quantifier: some-with-excludes
        filters: |
          frontend:
            - "datahub-frontend/**"
            - "datahub-web-react/**"
            - "docker/datahub-frontend/**"
          ingestion:
            - "metadata-ingestion-modules/**"
            - "metadata-ingestion/**"
            - "metadata-models/**"
            - "docker/datahub-ingestion-base/**"
            - "docker/datahub-ingestion/**"
          ingestion-core:
            - "metadata-ingestion/setup.py"
            - "metadata-ingestion/pyproject.toml"
            - "metadata-ingestion/constraints.txt"
            - "metadata-ingestion/src/datahub/api/**"
            - "metadata-ingestion/src/datahub/cli/**"
            - "metadata-ingestion/src/datahub/configuration/**"
            - "metadata-ingestion/src/datahub/emitter/**"
            - "metadata-ingestion/src/datahub/ingestion/api/**"
            - "metadata-ingestion/src/datahub/ingestion/graph/**"
            - "metadata-ingestion/src/datahub/ingestion/run/**"
            - "metadata-ingestion/src/datahub/ingestion/sink/**"
            - "metadata-ingestion/src/datahub/metadata/**"
            - "metadata-ingestion/src/datahub/sdk/**"
            - "metadata-ingestion/src/datahub/sql_parsing/**"
            - "metadata-ingestion/src/datahub/telemetry/**"
            - "metadata-ingestion/src/datahub/utilities/**"
            - "metadata-ingestion-modules/**"
            - "metadata-models/**"
            - "docker/datahub-ingestion-base/**"
            - "docker/datahub-ingestion/**"
          ingestion-base:
            - "docker/datahub-ingestion-base/**"
          docker:
            - "docker/**"
          backend:
            - "metadata-models/**"
            - "datahub-upgrade/**"
            - "entity-registry/**"
            - "li-utils/**"
            - "metadata-auth/**"
            - "metadata-dao-impl/**"
            - "metadata-events/**"
            - "metadata-io/**"
            - "metadata-jobs/**"
            - "metadata-service/**"
            # Toast JSON and productUpdateCiGate are lint-only (product_update_release_sync).
            - "!metadata-service/configuration/src/main/resources/product-update.json"
            - "!metadata-service/configuration/src/main/resources/product-update-saas.json"
            - "!metadata-service/configuration/src/productUpdateCiGate/**"
            - "metadata-utils/**"
            - "metadata-operation-context/**"
            - "metadata-integration/**"
            - "datahub-graphql-core/**"
            - "docker/**"
          kafka-setup:
            - "docker/kafka-setup/**"
          smoke-test:
            - "smoke-test/**"
          actions:
            - "datahub-actions/**"
            - "docker/datahub-actions/**"
          java-client:
            - "metadata-integration/java/datahub-client/**"
            - "metadata-models/**"
          playwright-test:
            - "e2e-test/ui/playwright/**"
          embedding-ai:
            - "metadata-io/src/main/java/com/linkedin/metadata/search/embedding/Local*"
            - "metadata-io/src/main/java/com/linkedin/metadata/search/embedding/Classical*"
            - "metadata-io/src/main/java/com/linkedin/metadata/search/semantic/**"
            - "metadata-io/src/main/java/com/linkedin/metadata/search/SemanticSearchService.java"
            - "metadata-io/src/main/java/com/linkedin/metadata/search/elasticsearch/indexbuilder/**"
            - "metadata-io/src/main/java/com/linkedin/metadata/search/elasticsearch/index/entity/v2/V2SemanticSearch*"
            - "metadata-service/configuration/src/main/java/com/linkedin/metadata/config/search/EmbeddingProvider*"
            - "metadata-service/configuration/src/main/java/com/linkedin/metadata/config/search/SemanticSearchConfiguration*"
            - "metadata-service/configuration/src/main/java/com/linkedin/metadata/config/search/ModelEmbeddingConfig*"
            - "metadata-service/factories/src/main/java/com/linkedin/gms/factory/search/semantic/**"
            - "metadata-service/factories/src/main/java/com/linkedin/gms/factory/search/SemanticSearchServiceFactory.java"
            - "metadata-service/configuration/src/main/resources/application.yaml"
            - "docker/profiles/docker-compose.ollama.yml"
            - "docker/profiles/docker-compose.gms.yml"
            - "docker/build.gradle"
            - "docker/datahub-actions/Dockerfile"
            - "metadata-ingestion/src/datahub/ingestion/source/unstructured/chunking_*.py"
            - "metadata-ingestion/src/datahub/ingestion/source/unstructured/embedding_providers/classical.py"
            - "metadata-ingestion/src/datahub/ingestion/source/unstructured/embedding_providers/factory.py"
            - "metadata-ingestion/src/datahub/ingestion/source/unstructured/embedding_providers/base.py"
            - "smoke-test/tests/e2e/semantic/test_local_embedding_provider.py"
            - "smoke-test/tests/e2e/semantic/test_classical_embedding_provider.py"
            - "smoke-test/tests/e2e/semantic/test_semantic_search.py"
            - ".github/workflows/docker-unified.yml"
            # The semantic/document tests are sensitive to what gets installed --
            # a transitive bump can break document chunking without touching any
            # file above.
            - "smoke-test/requirements.txt"
          all:
            - "**"
