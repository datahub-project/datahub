plugins {
  id 'java-library'
}
apply from: '../gradle/coverage/java-coverage.gradle'

dependencies {
  api project(':metadata-utils')
  api project(':entity-registry')
  api project(':metadata-auth:auth-api')
  implementation project(path: ':li-utils')

  // https://mvnrepository.com/artifact/nl.basjes.parse.useragent/yauaa
  // latest caffeine 3.1.8 compatible
  api 'nl.basjes.parse.useragent:yauaa:7.29.0'

  implementation externalDependency.slf4jApi
  implementation externalDependency.servletApi
  implementation spec.product.pegasus.restliServer
  implementation externalDependency.opentelemetryApi
  implementation externalDependency.opentelemetrySdkTrace
  implementation externalDependency.opentelemetrySdkMetrics
  // compileOnly: the Kafka producer-record SPI references ProducerRecord only at compile time.
  // Avoids leaking kafka-clients onto every downstream module's runtime classpath (operation-context
  // is a foundational dependency). Runtime callers already provide kafka-clients.
  compileOnly externalDependency.kafkaClients
  api externalDependency.jacksonDataBind
  api externalDependency.jacksonJDK8
  compileOnly externalDependency.lombok

  annotationProcessor externalDependency.lombok
  testImplementation externalDependency.testng
  testImplementation externalDependency.mockito
  testImplementation externalDependency.kafkaClients
  // Spring's MockHttpServletRequest — used in EnrichmentPropagationTest to stamp the
  // REQUEST_ENRICHMENTS_ATTR attribute and drive buildOpenapi through the full read-back chain.
  // Test-only; production code has no Spring dependency.
  testImplementation externalDependency.springBootTest
}