# One inline fragment per type rather than "... on HasIncidents": GMS versions
# from before that interface reject the query. Every type except Dataset,
# DataJob, DataFlow, Dashboard and Chart is tagged NEWER_GMS so older GMS drops it.
# NEWER_GMS is one switch per server, not per type: non-Cloud servers never query
# these types, and on Cloud a validation error on any NEWER_GMS field turns the
# tag off for every MCP tool on that server.
# ListEntityIncidentsQueryTest (datahub-graphql-core) fails when the fragments
# drift from the types that implement HasIncidents.

query listEntityIncidents(
    $urn: String!,
    $state: IncidentState,
    $start: Int!,
    $count: Int!
) {
    entity(urn: $urn) {
        urn
        type
        ... on Dataset {
            incidents(state: $state, start: $start, count: $count) {
                ...entityIncidentsResultFields
            }
        }
        ... on DataJob {
            incidents(state: $state, start: $start, count: $count) {
                ...entityIncidentsResultFields
            }
        }
        ... on DataFlow {
            incidents(state: $state, start: $start, count: $count) {
                ...entityIncidentsResultFields
            }
        }
        ... on Dashboard {
            incidents(state: $state, start: $start, count: $count) {
                ...entityIncidentsResultFields
            }
        }
        ... on Chart {
            incidents(state: $state, start: $start, count: $count) {
                ...entityIncidentsResultFields
            }
        }
        ... on MLFeature { #[NEWER_GMS]
            incidents(state: $state, start: $start, count: $count) { #[NEWER_GMS]
                ...entityIncidentsResultFields #[NEWER_GMS]
            } #[NEWER_GMS]
        } #[NEWER_GMS]
        ... on MLFeatureTable { #[NEWER_GMS]
            incidents(state: $state, start: $start, count: $count) { #[NEWER_GMS]
                ...entityIncidentsResultFields #[NEWER_GMS]
            } #[NEWER_GMS]
        } #[NEWER_GMS]
        ... on MLModel { #[NEWER_GMS]
            incidents(state: $state, start: $start, count: $count) { #[NEWER_GMS]
                ...entityIncidentsResultFields #[NEWER_GMS]
            } #[NEWER_GMS]
        } #[NEWER_GMS]
        ... on SchemaFieldEntity { #[NEWER_GMS]
            incidents(state: $state, start: $start, count: $count) { #[NEWER_GMS]
                ...entityIncidentsResultFields #[NEWER_GMS]
            } #[NEWER_GMS]
        } #[NEWER_GMS]
    }
}

fragment entityIncidentsResultFields on EntityIncidentsResult {
    start
    count
    total
    incidents {
        urn
        incidentType
        customType
        title
        description
        priority
        incidentStatus {
            state
            stage
            message
            lastUpdated {
                time
                actor
            }
        }
        source {
            type
        }
        created {
            time
            actor
        }
    }
}
