name: ${DATAHUB_ACTIONS_TERM_PROPAGATION_CONSUMER_GROUP_ID:-datahub_term_propagation_action}
# Disabled by default. Set DATAHUB_ACTIONS_TERM_PROPAGATION_ENABLED=true to run it.
enabled: ${DATAHUB_ACTIONS_TERM_PROPAGATION_ENABLED:-false}
source:
  type: "kafka"
  config:
    connection:
      bootstrap: ${KAFKA_BOOTSTRAP_SERVER:-localhost:9092}
      schema_registry_url: ${SCHEMA_REGISTRY_URL:-http://localhost:8081}
      consumer_config:
        max.poll.interval.ms: ${MAX_POLL_INTERVAL_MS:-60000} # 1 minute per poll
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
      pe: ${PLATFORM_EVENT_TOPIC_NAME:-PlatformEvent_v1}
filter:
  event_type: "EntityChangeEvent_v1"
action:
  type: term_propagation
  # By default every term is propagated. To restrict to specific terms (and terms
  # that inherit from them), add `config.target_terms: [urn:li:glossaryTerm:...]`.

datahub:
  server: "http://${DATAHUB_GMS_HOST:-localhost}:${DATAHUB_GMS_PORT:-8080}"
  extra_headers:
    Authorization: "Basic ${DATAHUB_SYSTEM_CLIENT_ID:-__datahub_system}:${DATAHUB_SYSTEM_CLIENT_SECRET:-JohnSnowKnowsNothing}"
