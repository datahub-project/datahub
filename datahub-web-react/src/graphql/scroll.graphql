# Download as CSV fetches every row of a result set, so these fragments select only the
# fields the CSV writes. The shared display fragments resolve ownership types, attribution,
# term hierarchies and parent domains for every row, none of which the CSV uses. For the same
# reason downloadSearchResults leaves out entityDataProduct (a relationships lookup per row)
# and the download queries leave out facets (recomputed for the whole result set on every page).
fragment downloadOwnershipFields on Ownership {
    owners {
        owner {
            ... on CorpUser {
                urn
                type
                properties {
                    displayName
                    fullName
                    email
                }
                editableProperties {
                    displayName
                    email
                }
            }
            ... on CorpGroup {
                urn
                type
                name
                properties {
                    email
                }
            }
        }
    }
}

fragment downloadGlobalTagsFields on GlobalTags {
    tags {
        tag {
            urn
            name
        }
    }
}

fragment downloadGlossaryTermsFields on GlossaryTerms {
    terms {
        term {
            urn
            name
        }
    }
}

fragment downloadDomainFields on DomainAssociation {
    domain {
        urn
        type
        properties {
            name
        }
    }
}

fragment downloadSearchResults on Entity {
    urn
    type
    ... on HasName {
        name
    }
    ... on HasPlatform {
        platform {
            ...platformFields
        }
    }
    ... on HasDataPlatformInstance {
        dataPlatformInstance {
            ...dataPlatformInstanceFields
        }
    }
    ... on HasEditableProperties {
        editableProperties {
            description
        }
    }
    ... on HasOwnership {
        ownership {
            ...downloadOwnershipFields
        }
    }
    ... on HasGlossaryTerms {
        glossaryTerms {
            ...downloadGlossaryTermsFields
        }
    }
    ... on HasSubTypes {
        subTypes {
            typeNames
        }
    }
    ... on HasDomain {
        domain {
            ...downloadDomainFields
        }
    }
    ... on HasDeprecation {
        deprecation {
            ...deprecationFields
        }
    }
    ... on HasTags {
        tags {
            ...downloadGlobalTagsFields
        }
    }
    ... on HasDescription {
        description
    }
    ... on Dataset {
        origin
        uri
        platformNativeType
        properties {
            name
            description
            qualifiedName
            customProperties {
                key
                value
            }
            externalUrl
        }
        globalTags {
            ...downloadGlobalTagsFields
        }
    }
    ... on CorpUser {
        username
        properties {
            active
            displayName
            title
            firstName
            lastName
            fullName
            email
        }
        info {
            active
            displayName
            title
            firstName
            lastName
            fullName
            email
        }
        editableProperties {
            displayName
            title
            pictureLink
        }
    }
    ... on CorpGroup {
        info {
            displayName
            description
        }
    }
    ... on Dashboard {
        dashboardId
        properties {
            name
            description
            externalUrl
            access
            lastModified {
                time
            }
        }
        globalTags {
            ...downloadGlobalTagsFields
        }
    }
    ... on Chart {
        chartId
        properties {
            name
            description
            externalUrl
            type
            access
            lastModified {
                time
            }
            created {
                time
            }
        }
        globalTags {
            ...downloadGlobalTagsFields
        }
    }
    ... on DataFlow {
        flowId
        cluster
        properties {
            name
            description
            project
            externalUrl
        }
        globalTags {
            ...downloadGlobalTagsFields
        }
    }
    ... on DataJob {
        dataFlow {
            ...nonRecursiveDataFlowFields
        }
        jobId
        properties {
            name
            description
            externalUrl
        }
        globalTags {
            ...downloadGlobalTagsFields
        }
    }
    ... on GlossaryTerm {
        name
        hierarchicalName
        properties {
            name
            description
            termSource
            sourceRef
            sourceUrl
            rawSchema
            customProperties {
                key
                value
            }
        }
        ...glossaryTermLifecycleFields
        parentNodes {
            ...parentNodesFields
        }
    }
    ... on GlossaryNode {
        ...glossaryNode
        parentNodes {
            ...parentNodesFields
        }
    }
    ... on Domain {
        properties {
            name
            description
        }
    }
    ... on Container {
        properties {
            name
            description
            externalUrl
        }
    }
    ... on MLFeatureTable {
        featureTableProperties {
            description
            mlFeatures {
                urn
            }
            mlPrimaryKeys {
                urn
            }
        }
    }
    ... on MLFeature {
        ...nonRecursiveMLFeature
    }
    ... on MLPrimaryKey {
        ...nonRecursiveMLPrimaryKey
    }
    ... on MLModel {
        origin
    }
    ... on MLModelGroup {
        origin
    }
    ... on Tag {
        name
        properties {
            name
        }
        description
    }
    ... on DataPlatform {
        ...nonConflictingPlatformFields
    }
    ... on DataProduct {
        properties {
            name
            description
            externalUrl
        }
    }
}

fragment downloadScrollResult on ScrollResults {
    nextScrollId
    count
    total
    searchResults {
        entity {
            ...downloadSearchResults
        }
        matchedFields {
            name
            value
        }
        insights {
            text
            icon
        }
    }
}

query getDownloadScrollResults($input: ScrollAcrossEntitiesInput!) {
    scrollAcrossEntities(input: $input) {
        ...downloadScrollResult
    }
}

fragment downloadScrollAcrossLineageResult on ScrollAcrossLineageResults {
    nextScrollId
    count
    total
    searchResults {
        degree
        entity {
            ...downloadSearchResults
        }
        matchedFields {
            name
            value
        }
        insights {
            text
            icon
        }
    }
}

query getDownloadScrollAcrossLineageResults($input: ScrollAcrossLineageInput!) {
    scrollAcrossLineage(input: $input) {
        ...downloadScrollAcrossLineageResult
    }
}
