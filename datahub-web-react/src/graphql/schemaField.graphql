query getSchemaField($urn: String!) {
    entity(urn: $urn) {
        urn
        type
        ... on SchemaFieldEntity {
            ...schemaFieldEntityFields
        }
    }
}

fragment schemaFieldEntityFields on SchemaFieldEntity {
    urn
    fieldPath
    type
    structuredProperties {
        properties {
            ...structuredPropertiesFields
        }
    }
    businessAttributes {
        businessAttribute {
            ...businessAttribute
        }
    }
    documentation {
        ...documentationFields
    }
    aiContext {
        synonyms
        instructions
        examples
        customInstructions
    }
    tags {
        ...globalTagsFields
    }
    glossaryTerms {
        ...glossaryTerms
    }
    parent {
        urn
        type
        ...entityDisplayNameFields
        ... on HasPlatform {
            platform {
                ...platformFields
            }
        }
        ... on HasSubTypes {
            subTypes {
                typeNames
            }
        }
        ... on Dataset {
            privileges {
                ...entityPrivileges
            }
        }
    }
    ...notes
    logicalParent {
        urn
        type
        ...logicalParentOrChildFields
    }
    physicalChildren: relationships(
        input: { types: ["PhysicalInstanceOf"], direction: INCOMING, start: 0, count: 10 }
    ) {
        start
        count
        total
        relationships {
            entity {
                urn
                type
                ...logicalParentOrChildFields
            }
            direction
            type
        }
    }
}
