    dataset(urn: $urn) {
        usageStats(range: MONTH) {
            aggregations {
                uniqueUserCount
                totalSqlQueries
                users {
                    user {
                        urn
                        type
                        username
                        properties {
                            displayName
                            firstName
                            lastName
                            fullName
                        }
                        editableProperties {
                            displayName
                            pictureLink
                        }
                    }
                    count
                    userEmail
                }
                fields {
                    fieldName
                    count
                }
            }
        }
    }
}

query getTimeRangeUsageAggregations($urn: String!, $timeRange: TimeRange!, $startTime: Long, $timeZone: String) {
    dataset(urn: $urn) {
        usageStats(range: $timeRange, startTimeMillis: $startTime, timeZone: $timeZone) {
            aggregations {
                uniqueUserCount
                totalSqlQueries
                users {
                    user {
                        urn
                        type
                        username
                        properties {
                            displayName
                            firstName
                            lastName
                            fullName
                        }
                        editableProperties {
                            displayName
                            pictureLink
                        }
                    }
                    count
                    userEmail
                }
                fields {
                    fieldName
                    count
                }
            }
            buckets {
                bucket
                metrics {
                    totalSqlQueries
                }
            }
        }
    }
}

mutation updateDataset($urn: String!, $input: DatasetUpdateInput!) {
    updateDataset(urn: $urn, input: $input) {
        urn
    }
}

fragment viewProperties on Dataset {
    viewProperties {
        materialized
        logic
        formattedLogic
        language
    }
}

fragment assertionsQuery on Dataset {
    assertions(start: 0, count: 1000, includeSoftDeleted: false) {
        start
        count
        total
        assertions {
            ...assertionDetailsWithRunEvents
            runEvents(status: COMPLETE, limit: 1) {
                total
                failed
                succeeded
                runEvents {
                    ...assertionRunEventDetails
                }
            }
        }
    }
}

query getDatasetAssertions($urn: String!, $skipSiblingsSearch: Boolean = false) {
    dataset(urn: $urn) {
        ...assertionsQuery
        siblings {
            isPrimary
            siblings {
                urn
                type
                ...assertionsQuery
            }
        }
        siblingsSearch(input: { query: "*", count: 5 }) @skip(if: $skipSiblingsSearch) {
            count
            total
            searchResults {
                entity {
                    urn
                    type
                    ...assertionsQuery
                }
            }
        }
    }
}

query getDatasetRuns($urn: String!, $start: Int!, $count: Int!, $direction: RelationshipDirection!) {
    dataset(urn: $urn) {
        runs(start: $start, count: $count, direction: $direction) {
            ...runResults
        }
    }
}

fragment datasetSchema on Dataset {
    schemaMetadata(version: 0) {
        ...schemaMetadataFields
    }
    editableSchemaMetadata {
        editableSchemaFieldInfo {
            fieldPath
            description
            globalTags {
                ...globalTagsFields
            }
            glossaryTerms {
                ...glossaryTerms
            }
        }
    }
}

query getDatasetSchema($urn: String!, $skipSiblingsSearch: Boolean = false) {
    dataset(urn: $urn) {
        ...datasetSchema
        siblings {
            isPrimary
            siblings {
                urn
                type
                ... on Dataset {
                    ...datasetSchema
                }
            }
        }
        siblingsSearch(input: { query: "*", count: 5 }) @skip(if: $skipSiblingsSearch) {
            count
            total
            searchResults {
                entity {
                    urn
                    type
                    ...datasetSchema
                }
            }
        }
    }
}

# Lean fragment: field paths, types, and nullability only -- no descriptions, tags,
# glossary terms, deprecation, structured properties, or editable metadata. Used by
# Phase 1 of the two-phase schema fetch so the table renders before the heavy
# metadata arrives. Descriptions are intentionally excluded to keep Phase 1 small.
fragment datasetStructuralSchema on Dataset {
    schemaMetadata(version: 0) {
        aspectVersion
        createdAt
        datasetUrn
        name
        platformUrn
        version
        cluster
        hash
        platformSchema {
            ... on TableSchema {
                schema
            }
            ... on KeyValueSchema {
                keySchema
                valueSchema
            }
        }
        fields {
            fieldPath
            label
            jsonPath
            nullable
            type
            nativeDataType
            recursive
            isPartOfKey
            isPartitioningKey
        }
        primaryKeys
        foreignKeys {
            name
            sourceFields {
                fieldPath
            }
            foreignFields {
                fieldPath
            }
            # foreignDataset intentionally excluded: FK target entity data (name, urn,
            # platform) is part of the full schemaMetadataFields fragment and arrives
            # in Phase 2. FK popovers may briefly show an empty dataset name during Phase 1.
        }
    }
}

query getDatasetSchemaStructural($urn: String!, $skipSiblingsSearch: Boolean = false) {
    dataset(urn: $urn) {
        ...datasetStructuralSchema
        siblings {
            isPrimary
        }
        siblingsSearch(input: { query: "*", count: 5 }) @skip(if: $skipSiblingsSearch) {
            count
            total
            searchResults {
                entity {
                    urn
                    type
                    ... on Dataset {
                        ...datasetStructuralSchema
                    }
                }
            }
        }
    }
}

query getExternalRoles($urn: String!) {
    dataset(urn: $urn) {
        access {
            ...getRoles
        }
        __typename
    }
}

fragment getRoles on Access {
    roles {
        role {
            id
            properties {
                name
                description
                type
                requestUrl
            }
            urn
            isAssignedToMe
        }
    }
}

query getOperations($urn: String!, $limit: Int, $startTime: Long, $endTime: Long, $filters: FilterInput) {
    dataset(urn: $urn) {
        operations(limit: $limit, startTimeMillis: $startTime, endTimeMillis: $endTime, filter: $filters) {
            timestampMillis
            lastUpdatedTimestamp
            operationType
            actor
            lastUpdatedTimestamp
            customOperationType
        }
    }
}

fragment assertionsQueryWithRunEvents on Dataset {
    assertions(start: 0, count: 1000) {
        start
        count
        total
        assertions {
            ...assertionDetailsWithRunEvents
        }
    }
}

query getOperationsStatsBuckets($urn: String!, $input: OperationsStatsInput) {
    dataset(urn: $urn) {
        operationsStats(input: $input) {
            aggregations {
                totalOperations
                totalInserts
                totalUpdates
                totalDeletes
                totalCreates
                totalAlters
                totalDrops
                totalCustoms
                customOperationsMap {
                    key
                    value
                }
            }
            buckets {
                bucket
                aggregations {
                    totalOperations
                    totalInserts
                    totalUpdates
                    totalDeletes
                    totalCreates
                    totalAlters
                    totalDrops
                    totalCustoms
                    customOperationsMap {
                        key
                        value
                    }
                }
            }
        }
    }
}

query getDatasetTimeseriesCapability($urn: String!) {
    dataset(urn: $urn) {
        timeseriesCapabilities {
            assetStats {
                oldestOperationTime
                oldestDatasetUsageTime
                oldestDatasetProfileTime
            }
        }
    }
}

query getOperationsStats($urn: String!, $range: TimeRange!) {
    dataset(urn: $urn) {
        operationsStats(input: { range: $range }) {
            aggregations {
                totalOperations
                totalInserts
                totalUpdates
                totalDeletes
                totalCreates
                totalAlters
                totalDrops
                totalCustoms
                customOperationsMap {
                    key
                    value
                }
            }
        }
    }
}

query getDatasetAssertionsWithRunEvents($urn: String!, $skipSiblingsSearch: Boolean = false) {
    dataset(urn: $urn) {
        ...assertionsQueryWithRunEvents
        siblings {
            isPrimary
        }
        siblingsSearch(input: { query: "*", count: 5 }) @skip(if: $skipSiblingsSearch) {
            count
            total
            searchResults {
                entity {
                    urn
                    type
                    ...assertionsQueryWithRunEvents
                }
            }
        }
    }
}
