query getDataProfiles($urn: String!, $limit: Int, $startTime: Long, $endTime: Long, $filters: FilterInput) {
    dataset(urn: $urn) {
        urn
        type
        datasetProfiles(limit: $limit, startTimeMillis: $startTime, endTimeMillis: $endTime, filter: $filters) {
            rowCount
            columnCount
            sizeInBytes
            timestampMillis
            partitionSpec {
                type
                partition
                timePartition {
                    startTimeMillis
                    durationMillis
                }
            }
            fieldProfiles {
                fieldPath
                uniqueCount
                uniqueProportion
                nullCount
                nullProportion
                min
                max
                mean
                median
                stdev
                sampleValues
                quantiles {
                    quantile
                    value
                }
                distinctValueFrequencies {
                    value
                    frequency
                }
            }
        }
    }
}

query getDataset($urn: String!, $skipSiblingsSearch: Boolean = false) {
    dataset(urn: $urn) {
        ...nonSiblingDatasetFields
        siblings {
            isPrimary
            siblings {
                urn
                type
                ...nonSiblingDatasetFields
            }
        }
        siblingsSearch(input: { query: "*", count: 5 }) @skip(if: $skipSiblingsSearch) {
            count
            total
            searchResults {
                entity {
                    urn
                    type
                    ...nonSiblingDatasetFields
                }
            }
        }
    }
}

fragment nonSiblingDatasetFields on Dataset {
    ...nonRecursiveDatasetFields
    exists
    deprecation {
        actor
        deprecated
        note
        decommissionTime
    }
    globalTags {
        ...globalTagsFields
    }
    glossaryTerms {
        ...glossaryTerms
    }
    subTypes {
        typeNames
    }
    domain {
        ...entityDomain
    }
    ...entityDataProduct
    parentContainers {
        ...parentContainersFields
    }
    usageStats(range: MONTH) {
        buckets {
            bucket
            metrics {
                totalSqlQueries
            }
        }
        aggregations {
            uniqueUserCount
            totalSqlQueries
            fields {
                fieldName
                count
            }
        }
    }
    datasetProfiles(limit: 1) {
        rowCount
        columnCount
        sizeInBytes
        timestampMillis
        fieldProfiles {
            fieldPath
            uniqueCount
            uniqueProportion
            nullCount
            nullProportion
            min
            max
            mean
            median
            stdev
            sampleValues
        }
    }
    latestFullTableProfile: datasetProfiles(
        limit: 1
        filter: {
            and: [
                { field: "partitionSpec.partition", values: ["FULL_TABLE_SNAPSHOT", "SAMPLE"], condition: START_WITH }
            ]
        }
    ) {
        ...datasetProfileFields
    }
    latestPartitionProfile: datasetProfiles(
        limit: 1
        filter: {
            and: [
                {
                    field: "partitionSpec.partition"
                    values: ["SAMPLE", "FULL_TABLE_SNAPSHOT"]
                    negated: true
                    condition: START_WITH
                }
            ]
        }
    ) {
        ...datasetProfileFields
    }
    health {
        ...entityHealth
    }
    assertions(start: 0, count: 1) {
        total
    }
    access {
        roles {
            role {
                urn
            }
        }
    }
    operations(limit: 1) {
        timestampMillis
        lastUpdatedTimestamp
    }
    ...viewProperties
    autoRenderAspects: aspects(input: { autoRenderOnly: true }) {
        ...autoRenderAspectFields
    }
    status {
        removed
    }
    runs: runs(start: 0, count: 20, direction: OUTGOING) {
        count
        start
        total
    }
    testResults {
        passing {
            test {
                ...testFields
            }
            type
        }
        failing {
            test {
                ...testFields
            }
            type
        }
    }
    statsSummary {
        queryCountLast30Days
        uniqueUserCountLast30Days
        topUsersLast30Days {
            urn
            type
            username
            properties {
                displayName
                firstName
                lastName
                fullName
            }
            editableProperties {
                displayName
                pictureLink
            }
        }
    }
    siblings {
        isPrimary
    }
    activeIncidents: incidents(start: 0, count: 1, state: ACTIVE) {
        total
    }
    logicalParent {
        urn
        type
        ...logicalParentOrChildFields
    }
    physicalChildren: relationships(
        input: { types: ["PhysicalInstanceOf"], direction: INCOMING, start: 0, count: 10 }
    ) {
        start
        count
        total
        relationships {
            entity {
                urn
                type
                ...logicalParentOrChildFields
            }
            direction
            type
        }
    }
    privileges {
        ...entityPrivileges
    }
    institutionalMemory {
        ...institutionalMemoryFields
    }
    ...notes
    ...entityProfileVersionProperties
    settings {
        ...AssetSettingsFields
    }
}

query getRecentQueries($urn: String!) {
    dataset(urn: $urn) {
        usageStats(range: MONTH) {
            buckets {
                bucket
                metrics {
                    topSqlQueries
                }
            }
        }
    }
}

