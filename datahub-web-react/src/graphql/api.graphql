query getApi($urn: String!) {
    entity(urn: $urn) {
        urn
        type
        ... on Api {
            ...apiFields
            autoRenderAspects: aspects(input: { autoRenderOnly: true }) {
                ...autoRenderAspectFields
            }
            structuredProperties {
                properties {
                    ...structuredPropertiesFields
                }
            }
            ...entityProfileVersionProperties
        }
    }
}

fragment apiFields on Api {
    ...apiSearchFields
    institutionalMemory {
        ...institutionalMemoryFields
    }
    ...entityDataProduct
    privileges {
        ...entityPrivileges
    }
}

fragment apiSearchFields on Api {
    urn
    type
    properties {
        name
        description
        externalUrl
    }
    signature {
        schemaDefinition
        inputFields {
            fieldPath
            nullable
            description
            nativeDataType
            type
        }
        outputFields {
            fieldPath
            nullable
            description
            nativeDataType
            type
        }
        inputDatasets {
            ...apiSignatureDatasetFields
        }
        outputDatasets {
            ...apiSignatureDatasetFields
        }
    }
    restProperties {
        method
        path
    }
    subTypes {
        typeNames
    }
    ownership {
        ...ownershipFields
    }
    tags {
        ...globalTagsFields
    }
    glossaryTerms {
        ...glossaryTerms
    }
    domain {
        ...entityDomain
    }
    dataPlatformInstance {
        platform {
            ...platformFields
        }
    }
    exists
    status {
        removed
    }
}

fragment apiSignatureDatasetFields on Dataset {
    urn
    type
    name
    properties {
        name
        qualifiedName
    }
    platform {
        ...platformFields
    }
    subTypes {
        typeNames
    }
}
