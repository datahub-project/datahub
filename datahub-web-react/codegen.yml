overwrite: true
schema:
    - '../datahub-graphql-core/src/main/resources/**/*.graphql'
config:
    scalars:
        Long: number
    # Parse GraphQL documents lazily on first DocumentNode access instead of at
    # module evaluation (CAT-3693). Keeps source size of gql strings; avoids the
    # DocumentNode AST bloat of documentMode: documentNode.
    gqlImport: '@graphql/lazyGql#gql'
documents:
    - 'src/**/*.graphql'
generates:
    src/types.generated.ts:
        plugins:
            - 'typescript'
    src/possibleTypes.generated.ts:
        plugins:
            - 'fragment-matcher'
    src/:
        preset: near-operation-file
        presetConfig:
            extension: '.generated.ts'
            baseTypesPath: types.generated.ts
        plugins:
            - 'typescript-operations'
            - 'typescript-react-apollo'
            - add:
                  content: '/* eslint-disable */'
hooks:
    afterAllFileWrite:
        - prettier --write
