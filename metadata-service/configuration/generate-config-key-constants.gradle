// Generates ConfigKeyConstants.java from application.yaml: one nested class per yaml block, one
// String constant per scalar key (exact authored spelling) — a renamed or removed yaml key fails
// the build at the stale reference.

def configKeyGenDir = layout.buildDirectory.dir("generated/sources/configKeyConstants/java/main")

tasks.register('generateConfigKeyConstants') {
    def yamlFile = file("src/main/resources/application.yaml")
    inputs.file(yamlFile)
    outputs.dir(configKeyGenDir)
    doLast {
        def words = { String seg ->
            seg.replaceAll(/([A-Z]+)([A-Z][a-z])/, '$1_$2')
               .replaceAll(/([a-z0-9])([A-Z])/, '$1_$2')
               .split(/[^A-Za-z0-9]+/).findAll { it }
        }
        // Java identifiers cannot start with a digit; escape with '_'.
        def constantName = { String seg ->
            def name = words(seg).join('_').toUpperCase()
            (name && Character.isDigit(name.charAt(0))) ? '_' + name : name
        }
        def className = { String seg ->
            def name = words(seg).collect { it[0].toUpperCase() + it.substring(1) }.join('')
            (name && Character.isDigit(name.charAt(0))) ? '_' + name : name
        }

        // Nesting follows the yaml structure, so a key name containing literal dots stays one leaf.
        def root = new TreeMap<String, Object>()
        def build
        build = { Map map, TreeMap node, String prefix ->
            map.each { k, v ->
                def seg = k.toString()
                def path = prefix.isEmpty() ? seg : prefix + "." + seg
                if (v instanceof Map) {
                    def child = node[seg]
                    if (child == null) {
                        child = new TreeMap<String, Object>()
                        node[seg] = child
                    } else if (!(child instanceof TreeMap)) {
                        throw new GradleException(
                            "generateConfigKeyConstants: '${path}' is both a value and a block")
                    }
                    build(v, child, path)
                } else if (!(v instanceof Collection)) {
                    if (node[seg] instanceof TreeMap) {
                        throw new GradleException(
                            "generateConfigKeyConstants: '${path}' is both a value and a block")
                    }
                    node[seg] = path
                }
            }
        }
        yamlFile.withInputStream { stream ->
            new org.yaml.snakeyaml.Yaml().loadAll(stream).each { doc ->
                if (doc instanceof Map) {
                    build(doc, root, "")
                }
            }
        }

        def counter = [0]
        def emit
        emit = { TreeMap node, StringBuilder sb, String indent, List enclosing ->
            def usedConstants = [:]
            def usedClasses = [:]
            node.each { seg, child ->
                if (child instanceof TreeMap) {
                    def cls = className(seg)
                    // A nested class cannot share a name with an enclosing class (JLS); escape with '_'.
                    while (cls && enclosing.contains(cls)) {
                        cls = cls + '_'
                    }
                    if (!cls) {
                        logger.warn("generateConfigKeyConstants: skipping un-nameable block '{}'", seg)
                        return
                    }
                    def prev = usedClasses.put(cls, seg)
                    if (prev != null) {
                        throw new GradleException("generateConfigKeyConstants: blocks '${prev}' and "
                            + "'${seg}' both normalize to class '${cls}' — rename one of them")
                    }
                    sb.append(indent).append("public static final class ").append(cls).append(" {\n")
                    sb.append(indent).append("  private ").append(cls).append("() {}\n\n")
                    emit(child, sb, indent + "  ", enclosing + [cls])
                    sb.append(indent).append("}\n\n")
                } else {
                    def constant = constantName(seg)
                    if (!constant) {
                        logger.warn("generateConfigKeyConstants: skipping un-nameable key '{}'", child)
                        return
                    }
                    def prev = usedConstants.put(constant, child)
                    if (prev != null) {
                        throw new GradleException("generateConfigKeyConstants: keys '${prev}' and "
                            + "'${child}' both normalize to constant '${constant}' — rename one of them")
                    }
                    sb.append(indent).append("public static final String ").append(constant)
                      .append(" = \"").append(child).append("\";\n")
                    counter[0]++
                }
            }
        }

        def body = new StringBuilder()
        emit(root, body, "  ", ["ConfigKeyConstants"])
        def sb = new StringBuilder()
        sb.append("package com.linkedin.metadata.config.resolver;\n\n")
        sb.append("/**\n")
        sb.append(" * GENERATED from application.yaml by the generateConfigKeyConstants Gradle task — do not edit.\n")
        sb.append(" * One nested class per yaml block, one constant per scalar key (exact authored spelling). ")
        sb.append(counter[0]).append(" keys.\n */\n")
        sb.append("public final class ConfigKeyConstants {\n\n")
        sb.append("  private ConfigKeyConstants() {}\n\n")
        sb.append(body)
        sb.append("}\n")

        def outDir = new File(configKeyGenDir.get().asFile, "com/linkedin/metadata/config/resolver")
        outDir.mkdirs()
        new File(outDir, "ConfigKeyConstants.java").text = sb.toString()
        logger.info("generateConfigKeyConstants: generated {} config key constants", counter[0])
    }
}

sourceSets.main.java.srcDir configKeyGenDir
compileJava.dependsOn generateConfigKeyConstants
