bootstrap:
  # Defaults
  #   force: false
  #   blocking: false
  #   async: true
  #   optional: false
  templates:
    # Bootstrap
    - name: root-user
      version: v5
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/root-user.yaml"

    - name: data-platforms
      version: v22
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/data-platforms.yaml"

    - name: data-types
      version: v1
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/data-types.yaml"

    - name: ownership-types
      version: v1
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/ownership-types.yaml"

    - name: lifecycle-stages
      version: v3
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/lifecycle-stages.yaml"

    - name: roles
      version: v1
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/roles.yaml"

    - name: page-modules
      version: v10
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/page-modules.yaml"

    - name: page-templates
      version: v3
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/page-templates.yaml"

    # v13 omits a fields clause whose list is empty; OpenSearch reads an empty list as every field.
    # v14 does not fuzz email or apply the synonym dictionary to id or email, and autocomplete
    # prefixes the email keyword.
    # v15 matches email as analyzed text and an exact keyword. The template names email.text.
    # The multi-word AND does not cover email.
    # v16 weights that analyzed text at 2, under a name token and under the exact email keyword.
    - name: search-templates
      version: v16
      blocking: true
      async: false
      mcps_location: "bootstrap_mcps/search-templates.yaml"

    # Ingestion Recipes
    - name: ingestion-datahub-gc
      version: v8
      optional: false
      mcps_location: "bootstrap_mcps/ingestion-datahub-gc.yaml"
      values_env: "DATAHUB_GC_BOOTSTRAP_VALUES"
      revision_env: "DATAHUB_GC_BOOTSTRAP_REVISION"

    - name: ingestion-datahub-documents
      version: v2
      optional: true
      mcps_location: "bootstrap_mcps/ingestion-datahub-documents.yaml"
      values_env: "DATAHUB_DOCUMENTS_BOOTSTRAP_VALUES"
      revision_env: "DATAHUB_DOCUMENTS_REVISION"
