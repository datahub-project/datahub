entity_mapping_config:
  mappings:
    dynamic: false
    dynamic_templates:
      - ownership_type_fields:
          match: "urn:li:ownershipType:*"
          mapping:
            type: keyword
            ignore_above: 255
    properties:
      urn:
        type: keyword
        ignore_above: 512
      _entityType:
        type: keyword
      _search:
        dynamic: true
        properties:
          entityName:
            type: keyword
          _system_aspectCreated_actor:
            type: keyword
          _system_aspectCreated_time:
            type: date
          _system_aspectModified_actor:
            type: keyword
          _system_aspectModified_time:
            type: date
          _system_lastObserved:
            type: date
          _system_lastRunId:
            type: keyword
          _system_runId:
            type: keyword
      runId:
        type: keyword
      systemCreated:
        type: date
      systemIndexModified:
        type: date