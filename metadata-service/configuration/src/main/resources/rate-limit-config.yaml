# Default GMS rate-limit policy (Tier 2). Intentionally empty.
#
# Spring-bound toggles live in application.yaml (Tier 1). This file is loaded when
# RATE_LIMITS_CONFIG_FILE is unset. Setting that env var replaces this document entirely
# (the two files are not merged). RATE_LIMITS_CONFIG_JSON then overlays the chosen file.
# Accepts datahub.gms.rateLimits, a rateLimits: wrapper, or a bare fragment. Example:
#
#   datahub:
#     gms:
#       rateLimits:
#         scoped:
#           heavyResolvers:
#             searchAcrossEntities: { capacity: 100, refillTokens: 100, refillPeriodSeconds: 60 }
