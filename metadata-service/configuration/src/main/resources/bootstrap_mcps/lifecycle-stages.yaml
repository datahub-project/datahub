# Default lifecycle stage types for documents and glossary terms.
# Increment the version in bootstrap_mcps.yaml to re-bootstrap after changes.
#
# Lifecycle stages control search visibility via the hideInSearch setting and
# enforce transition policies via allowedPreviousStages. The special sentinel
# urn:li:lifecycleStageType:__NONE__ represents the default active state (no stage set).
#
# Each stage is written with CREATE and If-None-Match: *, so a stage that already
# exists (for example one defined from earlier examples in this file) is left as is.
# To add stages, change entity types, or add transition policies, edit the stage
# entities directly or add entries here.

# PUBLISHED: Approved and live.
- entityUrn: urn:li:lifecycleStageType:PUBLISHED
  entityType: lifecycleStageType
  aspectName: lifecycleStageTypeInfo
  changeType: CREATE
  headers:
    If-None-Match: '*'
  aspect:
    name: Published
    description: >-
      Entity has been approved and is live. Visible in default searches
      and browse for all users.
    entityTypes:
      - document
      - glossaryTerm
    settings:
      hideInSearch: false
    created: {{&auditStamp}}
    lastModified: {{&auditStamp}}

# DRAFT: Entity is being authored. Hidden from default search.
- entityUrn: urn:li:lifecycleStageType:DRAFT
  entityType: lifecycleStageType
  aspectName: lifecycleStageTypeInfo
  changeType: CREATE
  headers:
    If-None-Match: '*'
  aspect:
    name: Draft
    description: >-
      Entity is being drafted and is not yet ready for review.
      Users may assign this stage to glossary terms; document drafts are internal
      working copies and cannot be assigned or proposed through lifecycle APIs.
      Hidden from default searches but discoverable via explicit lifecycle stage filter.
    entityTypes:
      - document
      - glossaryTerm
    settings:
      hideInSearch: true
    created: {{&auditStamp}}
    lastModified: {{&auditStamp}}

# IN_REVIEW: Entity submitted for steward review. Hidden from default search.
- entityUrn: urn:li:lifecycleStageType:IN_REVIEW
  entityType: lifecycleStageType
  aspectName: lifecycleStageTypeInfo
  changeType: CREATE
  headers:
    If-None-Match: '*'
  aspect:
    name: In Review
    description: >-
      Entity has been submitted for steward review and approval.
      Hidden from default searches until a reviewer approves and publishes it.
    entityTypes:
      - document
      - glossaryTerm
    settings:
      hideInSearch: true
    created: {{&auditStamp}}
    lastModified: {{&auditStamp}}

# REJECTED: Reviewer rejected the submission. Author must revise and resubmit.
- entityUrn: urn:li:lifecycleStageType:REJECTED
  entityType: lifecycleStageType
  aspectName: lifecycleStageTypeInfo
  changeType: CREATE
  headers:
    If-None-Match: '*'
  aspect:
    name: Rejected
    description: >-
      Entity was reviewed and rejected. The author should address reviewer feedback,
      update the entity, and resubmit for review.
    entityTypes:
      - document
      - glossaryTerm
    settings:
      hideInSearch: true
    created: {{&auditStamp}}
    lastModified: {{&auditStamp}}

# DEPRECATED: Entity is retired or superseded. Visible in search with a label.
- entityUrn: urn:li:lifecycleStageType:DEPRECATED
  entityType: lifecycleStageType
  aspectName: lifecycleStageTypeInfo
  changeType: CREATE
  headers:
    If-None-Match: '*'
  aspect:
    name: Deprecated
    description: >-
      Entity is deprecated and should no longer be used for new work.
      Remains visible in search with a deprecated label so consumers can
      identify affected assets and migrate to a replacement.
    entityTypes:
      - document
      - glossaryTerm
    settings:
      hideInSearch: false
    created: {{&auditStamp}}
    lastModified: {{&auditStamp}}

# ARCHIVED: Hidden from default search. Governance-aware soft-delete.
- entityUrn: urn:li:lifecycleStageType:ARCHIVED
  entityType: lifecycleStageType
  aspectName: lifecycleStageTypeInfo
  changeType: CREATE
  headers:
    If-None-Match: '*'
  aspect:
    name: Archived
    description: >-
      Entity is archived and hidden from all default searches and browse.
      Use this instead of hard-delete to preserve audit history.
      Can be restored by clearing the lifecycle stage.
    entityTypes:
      - document
      - glossaryTerm
    settings:
      hideInSearch: true
    created: {{&auditStamp}}
    lastModified: {{&auditStamp}}
