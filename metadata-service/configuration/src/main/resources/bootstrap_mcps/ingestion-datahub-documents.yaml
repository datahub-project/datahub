# Instructions to add additional entry or update on the target system
# 1. Edit this file
# 2. Increment version in bootstrap_mcps.yaml for the entry referring to this file
- entityType: dataHubIngestionSource
  entityUrn: urn:li:dataHubIngestionSource:datahub-documents
  aspectName: dataHubIngestionSourceInfo
  changeType: UPSERT
  aspect:
    type: 'datahub-documents'
    name: '{{ingestion.name}}{{^ingestion.name}}datahub-documents{{/ingestion.name}}'
    schedule:
      timezone: '{{schedule.timezone}}{{^schedule.timezone}}UTC{{/schedule.timezone}}'
      # Off (Feb 30 never fires) unless DATAHUB_DOCUMENTS_BOOTSTRAP_VALUES sets enabled to true. The datahub-upgrade
      # image sets it, so the source runs there; override with DATAHUB_DOCUMENTS_BOOTSTRAP_VALUES='{"enabled": false}'.
      # enabled must be a JSON boolean: a string "false" is truthy in mustache and would keep it on.
      # Disabling uses the schedule rather than enabledEnvVar, so an upgraded deployment's stored schedule is rewritten.
      interval: '{{#enabled}}{{schedule.interval}}{{^schedule.interval}}*/15 * * * *{{/schedule.interval}}{{/enabled}}{{^enabled}}0 0 30 2 *{{/enabled}}'
    config:
      version: '{{&ingestion.version}}{{^ingestion.version}}bundled{{/ingestion.version}}'
      recipe:
        source:
          type: datahub-documents
          config: { }
      debugMode: false
      extraArgs:
        extra_env_vars: '{{&ingestion.extra_env_vars}}{{^ingestion.extra_env_vars}}{}{{/ingestion.extra_env_vars}}'
      executorId: default
    source:
      type: {{source}}{{^source}}SYSTEM{{/source}}
  headers: {}
