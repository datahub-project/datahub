              "multi_match": {
                "query": "{{shortened}}",
                "type": "best_fields",
                "fields": {{&lightFieldsJson}},
                "operator": "{{lightOperator}}"
              }
            },
            {{/flags.exactNameLetterDigit}}
            {
              "term": {
                "{{nameKeyword}}": {
                  "value": "{{unquoted}}",
                  "case_insensitive": true,
