                "{{urnFoldedField}}": {
                  "value": "{{normalizedKeyword}}",
                  "boost": {{exactFactor}},
                  "_name": "urn"
                }
              }
            },
            {
              "term": {
                "{{urnExactField}}": {
                  "value": "{{unquoted}}",
                  "boost": {{caseSensitivityFactor}},
                  "_name": "urn"
                }
              }
            }
          ],
          "minimum_should_match": 1
        }
