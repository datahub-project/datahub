      }
      <%={{ }}=%>
    ladder:
      select:
        - scoreSort
        - pageSize
        - -columnFilter
        - -longQuery
      stop:
        - minHits: 1
        - emptyWhen: spacelessIdentifier
      next: urn:li:searchTemplate:fulltext
- entityUrn: urn:li:searchTemplate:list
  entityType: searchTemplate
  aspectName: searchTemplateProperties
  changeType: UPSERT
  aspect:
    name: List
    description: "Interactive empty-query ranking. Matches every document and ranks catalog enrichment, viewer affinity, usage, incidents, and deprecation."
    dialect: ELASTICSEARCH
    apiVersion: 1
    editable: false
    query: '{ "match_all": {} }'
    functionScore: |
      {
        "functions": [
          { "weight": 1.0 },
          {
            "filter": { "exists": { "field": "usagePercentile30d" } },
            "exp": {
              "usagePercentile30d": {
                "origin": 100,
                "scale": 100,
                "decay": 0.71
              }
            },
            "weight": 1.4
          },
          {
            "filter": { "term": { "hasActiveIncidents": { "value": true } } },
            "weight": 6.0
          },
          {
            "filter": { "term": { "hasDescription": { "value": true } } },
            "weight": 1.5
          },
          {
            "filter": { "term": { "hasOwners": { "value": true } } },
            "weight": 1.5
          },
          {
            "filter": { "term": { "hasDomain": { "value": true } } },
            "weight": 1.15
          },
          {
            "filter": { "term": { "hasGlossaryTerms": { "value": true } } },
            "weight": 1.15
          },
          {
            "filter": { "term": { "hasTags": { "value": true } } },
            "weight": 1.15
          },
          {
            "filter": { "term": { "hasRowCount": { "value": true } } },
            "weight": 1.05
          },
          {
            "filter": { "term": { "hasColumnCount": { "value": true } } },
            "weight": 1.05
          },
          {
            "filter": { "term": { "deprecated": { "value": true } } },
            "weight": 0.15
          }
        ],
        "score_mode": "multiply",
        "boost_mode": "replace"
      }
    boosts:
      - field: owners_urn
        values: viewerUrn
        weight: 1.4
      - field: owners_urn
        values: viewerGroupsJson
        weight: 1.25
      - field: domains_urn
        values: viewerDomainsJson
        weight: 1.25
    structuredPropertyQuery:
      analyzedValue:
        enabled: true
        operator: OR
      exactValue:
        enabled: true
    routes: []
- entityUrn: urn:li:searchTemplate:listUrn
  entityType: searchTemplate
