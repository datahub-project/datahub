                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{qualifierPathSuffix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{qualifierPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "term": {
                          "{{urnParsedField}}": {
                            "value": "{{qualifierPath}}",
                            "case_insensitive": true
