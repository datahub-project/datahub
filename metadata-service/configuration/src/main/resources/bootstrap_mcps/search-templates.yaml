                            "value": "{{dottedPathSuffix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      }
                    ],
                    "minimum_should_match": 1
                    }
                  }
                ]
              }
            }
            {{/qualifiedNameFields}}
            ,{
              "bool": {
                "must": [
                  {
                    "simple_query_string": {
                      "query": "{{terminalSegment}}",
                      "default_operator": "AND",
                      "fields": {{&nameFieldsJson}}
