                "operator": "AND"
              }
            }
            {{/synonyms}}
            {{#wholeIdentifier}}
            {{^spacelessDotted}}
            ,{
              "simple_query_string": {
                "query": "{{escaped}}",
                "fields": {{&nameFieldsJson}},
                "default_operator": "AND"
              }
            }
            {{/spacelessDotted}}
