                        }
                      },
                      {
                        "wildcard": {
                          "{{nameKeyword}}": {
                            "value": "{{dottedPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "term": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPath}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathPrefix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathSuffix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "term": {
                          "{{urnParsedField}}": {
                            "value": "{{dottedPath}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{urnParsedField}}": {
