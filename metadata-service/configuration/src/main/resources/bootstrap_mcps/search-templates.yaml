- entityUrn: urn:li:searchTemplate:exact
  entityType: searchTemplate
  aspectName: searchTemplateProperties
  changeType: UPSERT
  aspect:
    name: Exact
    description: "Quoted text query. Matches a name prefix, an exact name, and the URN, without the broader analyzed-text clauses. A query of four or more tokens also matches a description that contains every term."
    dialect: ELASTICSEARCH
    apiVersion: 1
    editable: false
    query: |
      {{=<% %>=}}
      {
        "bool": {
          "should": [
            {
              "match_phrase_prefix": {
                "{{nameText}}": {
                  "query": "{{unquoted}}",
                  "boost": {{prefixFactor}}
                }
              }
            },
            {
              "term": {
                "{{entityNameField}}": {
                  "value": "{{unquoted}}",
                  "case_insensitive": true,
                  "boost": {{exactFactor}}
                }
              }
            },
            {
              "term": {
                "{{urnFoldedField}}": {
                  "value": "{{normalizedKeyword}}",
                  "boost": {{exactFactor}},
                  "_name": "urn"
                }
              }
            },
            {
              "term": {
                "{{urnExactField}}": {
                  "value": "{{unquoted}}",
                  "boost": {{caseSensitivityFactor}},
                  "_name": "urn"
                }
              }
            }
            {{#longPhrase}}
            ,{
              "match": {
                "{{descriptionText}}": {
                  "query": "{{alphanumericSplit}}",
                  "operator": "AND",
                  "boost": 100.0
                }
              }
            }
            {{/longPhrase}}
          ],
          "minimum_should_match": 1
        }
      }
      <%={{ }}=%>
    functionScore: |
      {{=<% %>=}}
      {
        "functions": [
          { "weight": 1.0 }
          {{#valueScoreFunctions}}
          ,{
            "filter": { "term": { "{{field}}": { "value": {{&valueJson}} } } },
            "weight": {{weight}}
          }
          {{/valueScoreFunctions}}
          {{#fieldScoreFunctions}}
          ,{
            "field_value_factor": {
              "field": "{{field}}",
              "factor": {{factor}},
              "missing": {{missing}}
              {{#modifier}}, "modifier": "{{modifier}}"{{/modifier}}
            }
          }
          {{/fieldScoreFunctions}}
        ],
        "score_mode": "multiply",
        "boost_mode": "multiply"
      }
      <%={{ }}=%>
    structuredPropertyQuery:
      analyzedValue:
        enabled: true
        operator: OR
      exactValue:
        enabled: true
    entityTypeBoosts:
      - entityType: glossaryTerm
        weight: 6.0
      - entityType: glossaryNode
        weight: 6.0
      - entityType: domain
        weight: 5.0
      - entityType: container
        weight: 2.0
      - entityType: dataProduct
        weight: 10.0
      - entityType: tag
        weight: 2.0
      - entityType: chart
        weight: 2.0
      - entityType: dashboard
        weight: 2.0
    routes: []
