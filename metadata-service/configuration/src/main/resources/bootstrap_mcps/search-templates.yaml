# Search V3 query templates. Query bodies are Mustache for the search renderer.
# BootstrapMCP also uses Mustache, so each body switches delimiters around its
# {{tags}} so those tags are stored literally.
# fulltext, exact, structured, and identity set the entity-type weights.
# list and autocomplete do not. A child that does not set entityTypeBoosts keeps them.
- entityUrn: urn:li:searchTemplate:search
  entityType: searchTemplate
  aspectName: searchTemplateProperties
  changeType: UPSERT
  aspect:
    name: Search
    description: "Router for one fulltext query. A DataHub URN (urn:li and an entity type) or an s3, gs, or hdfs path uses identity. An empty query or * uses listUrn. A quoted /q query uses structuredExact, and any other /q query uses structured. A quoted query uses exact. Any other query uses fulltext. Scroll, aggregation, and browse start here."
    dialect: ELASTICSEARCH
    apiVersion: 1
    editable: false
    routes:
      - queryRegex: "(?i)^(?:urn:li:[a-z][a-z0-9]*[:()].*|(?:s3|gs|hdfs):\\\\?/\\\\?/.*)"
        template: urn:li:searchTemplate:identity
      - queryRegex: "^\\*?$"
        template: urn:li:searchTemplate:listUrn
      - queryRegex: "^\\\\/q [\"'].+[\"']$"
        template: urn:li:searchTemplate:structuredExact
      - queryRegex: "^\\\\/q .*"
        template: urn:li:searchTemplate:structured
      - queryRegex: "^[\"'].+[\"']$"
        template: urn:li:searchTemplate:exact
    defaultRoute:
      template: urn:li:searchTemplate:fulltext
- entityUrn: urn:li:searchTemplate:searchLight
  entityType: searchTemplate
  aspectName: searchTemplateProperties
  changeType: UPSERT
  aspect:
    name: Search light
    description: "Interactive-search router. An empty query or * uses ranked list. An ordinary query starts on light and continues to fulltext when that first query does not stop."
    dialect: ELASTICSEARCH
    apiVersion: 1
    editable: false
    parent: urn:li:searchTemplate:search
    routes:
      - queryRegex: "(?i)^(?:urn:li:[a-z][a-z0-9]*[:()].*|(?:s3|gs|hdfs):\\\\?/\\\\?/.*)"
        template: urn:li:searchTemplate:identity
      - queryRegex: "^\\*?$"
        template: urn:li:searchTemplate:list
      - queryRegex: "^\\\\/q [\"'].+[\"']$"
        template: urn:li:searchTemplate:structuredExact
      - queryRegex: "^\\\\/q .*"
        template: urn:li:searchTemplate:structured
      - queryRegex: "^[\"'].+[\"']$"
        template: urn:li:searchTemplate:exact
    defaultRoute:
      template: urn:li:searchTemplate:light
- entityUrn: urn:li:searchTemplate:fulltext
  entityType: searchTemplate
  aspectName: searchTemplateProperties
  changeType: UPSERT
  aspect:
    name: Fulltext
    description: "Complete text query. Matches analyzed fields, a name prefix, and an exact name, and adds clauses for synonyms, identifiers, dotted names, and long phrases. A query of four or more tokens also scores a description that contains every term and a description that contains a share of them."
    dialect: ELASTICSEARCH
    apiVersion: 1
    editable: false
    query: |
      {{=<% %>=}}
      {
        "dis_max": {
          "tie_breaker": 0.01,
          "queries": [
            {
              "simple_query_string": {
                "query": "{{fuzzy}}",
                "default_operator": "OR",
                "fields": {{&defaultFieldsWithoutQualifiedNameJson}},
                "fuzzy_max_expansions": {{fuzzyMaxExpansions}},
                "fuzzy_prefix_length": 0,
                "fuzzy_transpositions": true
              }
            }
            {{#qualifiedNameFields}}
            {{^spacelessDotted}}
            ,{
              "simple_query_string": {
                "query": "{{fuzzy}}",
                "default_operator": "OR",
                "fields": {{&qualifiedNameFieldsJson}}
              }
            }
            {{/spacelessDotted}}
            {{/qualifiedNameFields}}
            {{#synonyms}}
            ,{
              "simple_query_string": {
                "query": "{{synonym}}",
                "default_operator": "AND",
                "fields": {{&defaultFieldsWithoutQualifiedNameJson}},
                "boost": 1.5
              }
            }
            {{#qualifiedNameFields}}
            {{^spacelessDotted}}
            ,{
              "simple_query_string": {
                "query": "{{synonym}}",
                "default_operator": "AND",
                "fields": {{&qualifiedNameFieldsJson}},
                "boost": 1.5
              }
            }
            {{/spacelessDotted}}
            {{/qualifiedNameFields}}
            {{/synonyms}}
            {{#flags.alphanumericSplit}}
            ,{
              "simple_query_string": {
                "query": "{{broadQuery}}",
                "default_operator": "OR",
                "fields": {{&defaultFieldsWithoutQualifiedNameJson}},
                "boost": 1.5
              }
            }
            {{#qualifiedNameFields}}
            {{^spacelessDotted}}
            ,{
              "simple_query_string": {
                "query": "{{broadQuery}}",
                "default_operator": "OR",
                "fields": {{&qualifiedNameFieldsJson}},
                "boost": 1.5
              }
            }
            {{/spacelessDotted}}
            {{/qualifiedNameFields}}
            {{/flags.alphanumericSplit}}
            {{#prefixFields}}
            ,{
              "match_phrase_prefix": {
                "{{field}}": {
                  "query": "{{unquoted}}",
                  "boost": {{boost}},
                  "max_expansions": {{prefixMaxExpansions}}
                }
              }
            }
            {{/prefixFields}}
            ,{
              "term": {
                "{{nameKeyword}}": {
                  "value": "{{unquoted}}",
                  "case_insensitive": true,
                  "boost": 100.0
                }
              }
            }
            {{#synonyms}}
            ,{
              "term": {
                "{{nameKeyword}}": {
                  "value": "{{synonym}}",
                  "case_insensitive": true,
                  "boost": 100.0
                }
              }
            }
            {{/synonyms}}
            {{#qualifiedNameFields}}
            ,{
              "term": {
                "{{qualifiedNameKeyword}}": {
                  "value": "{{normalizedKeyword}}",
                  "case_insensitive": true,
                  "boost": 100.0
                }
              }
            }
            {{/qualifiedNameFields}}
            {{#wildcardTerm}}
            {{#wildcardFields}}
            ,{
              "wildcard": {
                "{{field}}": {
                  "value": "*{{wildcardTerm}}*",
                  "boost": {{boost}}
                }
              }
            }
            {{/wildcardFields}}
            {{/wildcardTerm}}
            {{#multiWord}}
            ,{
              "simple_query_string": {
                "query": "{{alphanumericSplit}}",
                "default_operator": "AND",
                "fields": {{&nameFieldsJson}},
                "boost": 3.0
              }
            }
            {{#qualifiedNameFields}}
            {{^spacelessDotted}}
            ,{
              "simple_query_string": {
                "query": "{{alphanumericSplit}}",
                "default_operator": "AND",
                "fields": {{&qualifiedNameFieldsJson}},
                "boost": 3.0
              }
            }
            {{/spacelessDotted}}
            {{/qualifiedNameFields}}
            {{/multiWord}}
            {{#dotted}}
            ,{
              "term": {
                "{{idKeyword}}": {
                  "value": "{{unquoted}}",
                  "case_insensitive": true
                }
              }
            }
            {{/dotted}}
            {{#spacelessDotted}}
            {{#qualifiedNameFields}}
            ,{
              "bool": {
                "must": [
                  {
                    "simple_query_string": {
                      "query": "{{unquoted}}",
                      "default_operator": "AND",
                      "fields": {{&qualifiedNameFieldsJson}}
                    }
                  }
                ],
                "filter": [
                  {
                    "bool": {
                    "should": [
                      {
                        "term": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPath}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathPrefix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathSuffix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{dottedPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      }
                    ],
                    "minimum_should_match": 1
                    }
                  }
                ]
              }
            }
            {{/qualifiedNameFields}}
            ,{
              "bool": {
                "must": [
                  {
                    "simple_query_string": {
                      "query": "{{terminalSegment}}",
                      "default_operator": "AND",
                      "fields": {{&nameFieldsJson}}
                    }
                  }
                ],
                "filter": [
                  {
                    "bool": {
                    "must": [
                      {
                        "term": {
                          "{{nameKeyword}}": {
                            "value": "{{terminalSegment}}",
                            "case_insensitive": true
                          }
                        }
                      }
                    ],
                    "should": [
                      {
                        "term": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{qualifierPath}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{qualifierPathPrefix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{qualifierPathSuffix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{qualifiedNameKeyword}}": {
                            "value": "{{qualifierPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "term": {
                          "{{urnParsedField}}": {
                            "value": "{{qualifierPath}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{urnParsedField}}": {
                            "value": "{{qualifierPathPrefix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{urnParsedField}}": {
                            "value": "{{qualifierPathSuffix}}",
                            "case_insensitive": true
                          }
                        }
                      },
                      {
                        "wildcard": {
                          "{{urnParsedField}}": {
                            "value": "{{qualifierPathContains}}",
                            "case_insensitive": true
                          }
                        }
                      }
                    ],
                    "minimum_should_match": 1
                    }
                  }
                ]
              }
            }
            {{/spacelessDotted}}
            {{#longPhrase}}
            ,{
              "match": {
                "{{descriptionText}}": {
                  "query": "{{alphanumericSplit}}",
                  "operator": "AND",
                  "boost": 100.0
                }
              }
            }
            ,{
              "match": {
                "{{descriptionText}}": {
                  "query": "{{alphanumericSplit}}",
                  "operator": "OR",
                  "minimum_should_match": "25%",
                  "boost": 10.0
                }
              }
            }
            {{/longPhrase}}
            {{#extraDisMaxQueries}}
            ,{{&extraDisMaxQueries}}
            {{/extraDisMaxQueries}}
          ]
        }
      }
      <%={{ }}=%>
    functionScore: |
      {{=<% %>=}}
      {
        "functions": [
          { "weight": 1.0 }
          {{#valueScoreFunctions}}
          ,{
            "filter": { "term": { "{{field}}": { "value": {{&valueJson}} } } },
            "weight": {{weight}}
          }
          {{/valueScoreFunctions}}
          {{#fieldScoreFunctions}}
          ,{
            "field_value_factor": {
              "field": "{{field}}",
              "factor": {{factor}},
              "missing": {{missing}}
              {{#modifier}}, "modifier": "{{modifier}}"{{/modifier}}
            }
          }
          {{/fieldScoreFunctions}}
        ],
        "score_mode": "multiply",
        "boost_mode": "multiply"
      }
      <%={{ }}=%>
    normalization:
      wildcardMinimumLength: 5
      synonymCap: 8
      fuzzyTokenThreshold: 5
      mediumFuzzyTokenThreshold: 7
      broadQueryTokenCap: 8
      shortFuzzyEdits: 1
      mediumFuzzyEdits: 2
    structuredPropertyQuery:
      analyzedValue:
        enabled: true
        operator: OR
      exactValue:
        enabled: true
    entityTypeBoosts:
      - entityType: glossaryTerm
        weight: 6.0
      - entityType: glossaryNode
        weight: 6.0
      - entityType: domain
        weight: 5.0
      - entityType: container
        weight: 2.0
      - entityType: dataProduct
        weight: 10.0
      - entityType: tag
        weight: 2.0
      - entityType: chart
        weight: 2.0
      - entityType: dashboard
        weight: 2.0
    routes: []
- entityUrn: urn:li:searchTemplate:light
  entityType: searchTemplate
  aspectName: searchTemplateProperties
  changeType: UPSERT
  aspect:
    name: Light
    description: "Cheaper text query for a relevance-sorted page that does not filter on a column and has fewer than four tokens. A longer query skips this rung and continues to fulltext. Keeps the result when it finds a hit, or when an empty result is an identifier or a long name. Otherwise continues to fulltext."
    dialect: ELASTICSEARCH
    apiVersion: 1
    editable: false
    parent: urn:li:searchTemplate:fulltext
    query: |
      {{=<% %>=}}
