      operationId: "raw"
      tags:
        - "DataHub Usage"
      requestBody:
        content:
          application/json:
            schema:      # Request body contents
              type: string
            example: >-
              {
                "query": {
                  "match_all": {}
                }
              }
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: string
