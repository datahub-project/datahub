management.health.elasticsearch.enabled=false
management.health.neo4j.enabled=false
ingestion.enabled=false
spring.main.allow-bean-definition-overriding=true
entityClient.impl=restli
metadataChangeProposal.throttle.updateIntervalMs=0
# client or upgrade. upgrade currently uses the same Hazelcast policy as client.
# service is rejected at startup. Helm selects via DATAHUB_RUNTIME_ROLE.
datahub.runtime.role=${DATAHUB_RUNTIME_ROLE:upgrade}
