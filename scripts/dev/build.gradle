ext {
  venv_name = '.venv'
  venv_python = "${projectDir}/${venv_name}/bin/python"
  venv_ruff = "${projectDir}/${venv_name}/bin/ruff"
}

task installRuff(type: Exec) {
  description = 'Create .venv and install ruff'
  outputs.files(venv_ruff, "${projectDir}/${venv_name}/bin/pytest")
  commandLine 'bash', '-c',
    "python3 -m venv ${projectDir}/${venv_name} && ${venv_python} -m pip install --quiet ruff==0.15.22 pytest"
}

def pythonFiles = providers.gradleProperty('devPythonFiles').map { it.split(',').toList() }.getOrElse(['.'])

task lint(type: Exec, dependsOn: installRuff) {
  description = 'Check formatting of Python scripts'
  inputs.files(fileTree('.').include('**/*.py'))
  commandLine(['bash', '-c', '"$1" check "${@:2}" && "$1" format --check "${@:2}"',
      'dev-lint', venv_ruff] + pythonFiles)
}

task lintFix(type: Exec, dependsOn: installRuff) {
  description = 'Auto-fix formatting of Python scripts'
  inputs.files(fileTree('.').include('**/*.py'))
  commandLine(['bash', '-c', '"$1" check --fix "${@:2}" && "$1" format "${@:2}"',
      'dev-lint', venv_ruff] + pythonFiles)
}

// The tests isolate HOME and the shared registry; no Docker or live services are needed.
tasks.register('test', Exec) {
    description = 'Run datahub-dev unit tests'
    group = 'verification'
    dependsOn installRuff
    workingDir rootProject.projectDir
    commandLine venv_python, '-m', 'pytest', 'scripts/dev/tests'
}
