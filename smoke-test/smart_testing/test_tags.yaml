# Smart Testing — smoke-test pytest tags
#
# Maps test modules (paths relative to smoke-test/) to tags from
# .github/smart-testing/taxonomy.yaml. conftest applies them as markers
# (feature_user, feature_dev, compound, technical_layer, entity_scope) when
# SMOKE_SMART_TESTING is shadow or active. An exact path beats a glob; among
# globs the longest wins. Untagged modules are always selected.

version: 1

# Always selected, whatever the PR touches.
always_run:
  - tests/e2e/read_only/test_services_up.py
  - tests/e2e/search/test_search_projection.py
  - tests/e2e/authorization/test_self_entity_auth.py

# Also selected when the PR changes the shared pytest harness (change-type:
# pytest-plumbing; see taxonomy.yaml for the paths). One short module per
# common fixture and API surface, about 4 minutes of test time, so a harness
# bug fails here instead of only after merge. change-type tags never go on
# the entries under `tests:` below; they describe PRs, not tests.
plumbing_sample:
  - tests/e2e/restli/test_restli_batch_ingestion.py # ingest_cleanup_data, Rest.li
  - tests/e2e/schema_fields/test_schemafields.py # ingest_cleanup_data
  - tests/e2e/entity_versioning/test_versioning_ingest.py # ingest_cleanup_data
  - tests/e2e/openapi/v3/test_scroll_entities.py # OpenAPI v3
  - tests/e2e/patch/test_domain_patches.py # openapi_graph_client, patches
  - tests/e2e/domains/domain_entities_batching_test.py # GraphQL
  - tests/e2e/glossary/glossary_children_count_test.py # GraphQL
  - tests/e2e/lineage/test_lineage_sdk.py # SDK, wait_for_writes_to_sync
  - tests/e2e/delete/delete_test.py # soft and hard delete
  - tests/e2e/cli/user_groups_cmd/test_user_cmd.py # datahub CLI

tests:

  # ── actions/ ────────────────────────────────────────────────

  - path: "tests/e2e/actions/doc_propagation/test_propagation.py"
    tags:
      feature-user: [documentation]
      feature-dev: [executor]
      compound: [propagation:docs, propagation:lineage-path]
      technical-layer: [kafka-events]
      entity-scope: [dataset]

  - path: "tests/e2e/actions/test_actions_shutdown.py"
    tags:
      feature-dev: [executor]
      technical-layer: [kafka-events]

  - path: "tests/e2e/actions/term_propagation/test_term_propagation.py"
    tags:
      feature-user: [glossary]
      compound: [propagation:terms]
      technical-layer: [kafka-events]
      entity-scope: [dataset]

  # ── analytics/ ──────────────────────────────────────────────

  - path: "tests/e2e/analytics/test_analytics.py"
    tags:
      feature-user: [analytics]
      technical-layer: [graphql]

  - path: "tests/e2e/analytics/test_highlights.py"
