run_id: postgres-test

source:
  type: postgres
  config:
    host_port: 'localhost:5432'
    database: 'postgrestest'
    username: 'postgres'
    password: 'example'
    schema_pattern:
      allow:
        - 'partitioned'
    include_table_partitions: false
sink:
  type: file
  config:
    filename: "./postgres_skip_table_partitions_mces.json"
