run_id: mssql-test

source:
  type: mssql
  config:
    username: sa
    password: test!Password
    host_port: localhost:${MSSQL_PORT}
    database_pattern:
      deny:
        - NewData
        - .*DB_WITH@SPEC_SYMB.*
    procedure_pattern:
      deny:
        - DemoData.Foo.NewProc
    convert_urns_to_lowercase: true

    options:
      connect_args:
        # pytds enables TLS only when cafile is set. This CA signed the
        # server cert (CN/SAN localhost). forceencryption rejects plaintext.
        cafile: "${MSSQL_CAFILE}"
        validate_host: true

sink:
  type: file
  config:
    filename: "./mssql_mces.json"
