run_id: mssql-test

source:
  type: mssql
  config:
    username: sa
    password: test!Password
    database: DemoData
    host_port: localhost:${MSSQL_PORT}
    platform_instance: my-instance
    include_containers_for_pipelines: true
    convert_urns_to_lowercase: true
    temporary_tables_pattern:
      - ".*Ephemeral.*"
    database_pattern:
      deny:
        - .*DB_WITH@SPEC_SYMB.*

    options:
      connect_args:
        # pytds enables TLS only when cafile is set. This CA signed the
        # server cert (CN/SAN localhost). forceencryption rejects plaintext.
        cafile: "${MSSQL_CAFILE}"
        validate_host: true

sink:
  type: file
  config:
    filename: "./mssql_mces.json" 