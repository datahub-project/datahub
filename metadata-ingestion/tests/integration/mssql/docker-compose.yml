version: "3"
services:
  testsqlserver:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    platform: linux/amd64
    container_name: "testsqlserver"
    # Cert CN/SAN is localhost. SQL Server refuses a cert whose subject does
    # not match the machine name, and pytds checks the same name.
    hostname: localhost
    entrypoint: ["/bin/bash", "/setup/tls-entrypoint.sh"]
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "test!Password"
    ports:
      # Ephemeral: the fixed host port could be held forever by a leaked
      # container from a prior CI run. Tests discover the real port via
      # docker_services.port_for("testsqlserver", 1433). The server has
      # forceencryption on, so this port speaks TLS only.
      - "1433"
    volumes:
      - ./setup:/setup
      - ${MSSQL_TLS_DIR}:/tls:ro
