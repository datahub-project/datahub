run_id: oracle-no-procedures-test

source:
  type: oracle
  config:
    username: system
    password: example
    host_port: localhost:51521
    service_name: XEPDB1
    include_stored_procedures: false
    include_materialized_views: true
    
    # Enable lineage features to test materialized view lineage
    include_view_lineage: true
    include_view_column_lineage: true
    
    schema_pattern:
      allow:
        - "^HR_SCHEMA"
        # Holds the case-only column pair. Only this recipe allows it, so the
        # other goldens stay untouched by it.
        - "^CASING_SCHEMA"
    
    # Oracle is one of only two dialects DataHub uses that set
    # requires_name_normalize, so it is the only non-Snowflake source where the
    # profiler's stored-column-name path runs. Profile here so that path has
    # coverage against a real Oracle rather than mocks alone.
    profiling:
      enabled: true
sink:
  type: file
  config:
    filename: "oracle_mces.json"
