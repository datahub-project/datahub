run_id: oracle-query-usage-test

source:
  type: oracle
  config:
    username: system
    password: example
    host_port: "localhost:${ORACLE_PORT}"
    service_name: XEPDB1
    options:
      connect_args:
        # The published port is TCPS. python-oracledb thin mode uses the
        # descriptor's protocol; ewallet.pem in the wallet is the server cert.
        # orapki's self-signed cert has no SAN, so hostname match is off.
        dsn: "(DESCRIPTION=(ADDRESS=(PROTOCOL=TCPS)(HOST=localhost)(PORT=${ORACLE_PORT}))(CONNECT_DATA=(SERVICE_NAME=XEPDB1)))"
        wallet_location: "${ORACLE_WALLET}"
        ssl_server_dn_match: false
    
    # Enable query usage extraction
    include_query_usage: true
    max_queries_to_extract: 50
    
    # Enable stored procedures and lineage to test complete functionality
    include_stored_procedures: true
    include_lineage: true
    include_view_lineage: true
    include_view_column_lineage: true
    
    # Optionally exclude system queries
    query_exclude_patterns:
      - "^SELECT.*FROM SYS\\..*"
      - "^SELECT.*FROM DUAL$"
    
    data_dictionary_mode: "ALL"
    
    schema_pattern:
      allow:
        - "^HR_SCHEMA$"
        - "^SALES_SCHEMA$"
        - "^ANALYTICS_SCHEMA$"
        
    profiling:
      enabled: false
      
sink:
  type: file
  config:
    filename: "oracle_mces.json"
