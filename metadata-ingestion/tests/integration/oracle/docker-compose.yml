services:
  testoracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: "testoracle"
    environment:
      ORACLE_PWD: example
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      # Ephemeral: letting Docker pick free host ports avoids colliding with
      # a leaked container from a prior run. 2484 is TCPS. 1521 stays bound
      # to loopback inside the container for service registration and is not
      # published. Tests discover the host port via port_for(..., 2484).
      - "2484"
      - "5500"  # Oracle Enterprise Manager Express
    volumes:
      - ./startup:/opt/oracle/scripts/startup
      # The startup script, running as oracle, writes ewallet.pem and a ready
      # file here. The test creates the directory and makes it writable by
      # that uid before compose starts.
      - ${ORACLE_TLS_DIR}:/opt/oracle/tls
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 30s
      timeout: 30s
      retries: 30
      start_period: 240s
