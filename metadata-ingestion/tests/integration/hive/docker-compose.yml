# Adapted from https://github.com/big-data-europe/docker-hive.

version: "3"

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    volumes:
      - namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop-hive.env
    ports:
      - "50070"
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    volumes:
      - datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop-hive.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
    ports:
      # Ephemeral: nothing on the host connects to this port -- SERVICE_PRECONDITION
      # strings resolve "datanode:50075" over the compose network, unaffected by
      # whatever host port Docker maps it to.
      - "50075"
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: "testhiveserver2"
    env_file:
      - ./hadoop-hive.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      # Ephemeral: the test process connects to HiveServer2 from the host via
      # localhost, so a leaked container from a prior run can't hold onto a
      # fixed port that a fresh run needs to bind.
      - "10000"
    volumes:
      - ./hive_setup.sql:/hive_setup.sql
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    env_file:
      - ./hadoop-hive.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 hive-metastore-postgresql:5432"
    ports:
      # Ephemeral: only hive-server reaches this, over the compose network via
      # SERVICE_PRECONDITION "hive-metastore:9083", unaffected by the host mapping.
      - "9083"
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
#  presto-coordinator:
#    image: shawnzhu/prestodb:0.181
#    ports:
#      - "8080:8080"

volumes:
  namenode:
  datanode:
