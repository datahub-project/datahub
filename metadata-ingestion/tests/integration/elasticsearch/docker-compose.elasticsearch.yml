services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: test-elasticsearch
    ports:
      - "29200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -sf http://localhost:9200/_cluster/health || exit 1"
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s
