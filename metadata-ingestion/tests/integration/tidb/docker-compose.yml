services:
  testtidb:
    # Standalone single-node TiDB backed by the in-memory "unistore" engine,
    # so no PD/TiKV containers are required for the test.
    image: pingcap/tidb:v7.5.5
    container_name: "testtidb"
    command:
      - --store=unistore
      - --host=0.0.0.0
      - --advertise-address=127.0.0.1
    ports:
      # Ephemeral: only the MySQL protocol port is needed from the host (for
      # ingestion); letting Docker pick a free port avoids colliding with a
      # leaked container from a prior run. Standalone unistore node, so there
      # is no PD/TiKV topology whose env vars bake in this port.
      - "4000"
    volumes:
      - ./setup:/setup
