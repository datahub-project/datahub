services:
  testinformix:
    container_name: "testinformix"
    hostname: ifx
    image: icr.io/informix/informix-developer-database:latest
    platform: linux/amd64
    privileged: true
    # The image defaults to USER=informix and its entrypoint shells out through
    # `RUNAS() { sudo -u $1 ...; }` for every privileged step. /usr/bin/sudo is
    # setuid root, so on a runner whose container filesystem is mounted nosuid it
    # cannot escalate -- it fails with "PAM account management error" and every
    # RUNAS step silently no-ops, leaving sqlhosts without a valid INFORMIXSERVER
    # entry. oninit then reports "Bad DBSERVERNAME" and the server never starts.
    # Running as root sidesteps it: sudo invoked by root needs no authentication.
    user: root
    environment:
      LICENSE: accept
      SIZE: SMALL
    ports:
      - "9088:9088"
    volumes:
      # Trims first-boot disk initialization so it fits the 60s budget the image
      # hardcodes for it. See the file itself for the reasoning.
      - ./setup/onconfig.mod:/opt/ibm/config/onconfig.mod:ro
    # Disable the image's built-in healthcheck: it uses start_period=60s with
    # retries=1, so on a slow CI runner a single failed probe flips the container
    # to "unhealthy" before this 2.23GB privileged image finishes booting. The
    # test brings the container up detached (no `--wait`, see test_informix.py)
    # and gates readiness on an `onstat` probe instead.
    healthcheck:
      disable: true
