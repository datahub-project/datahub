# Spark defaults for the Iceberg integration tests.
#
# This file replaces the image's stock /opt/spark/conf/spark-defaults.conf (mounted read-only by
# docker-compose.yml). The catalog points at the Lakekeeper REST catalog, whose REST API is served
# under /catalog. The warehouse value is the Lakekeeper warehouse NAME, not an S3 path.
# S3 credentials come from the container's AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY environment
# variables; the MinIO endpoint is set explicitly with path-style access.

spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.demo                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type            rest
spark.sql.catalog.demo.uri             http://rest:8181/catalog
spark.sql.catalog.demo.io-impl         org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.demo.warehouse       demo
spark.sql.catalog.demo.s3.endpoint     http://minio.localhost:9000
spark.sql.catalog.demo.s3.path-style-access    true
spark.sql.defaultCatalog               demo
spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
spark.sql.catalogImplementation        in-memory
