run_id: iceberg-v3-test

source:
  type: iceberg
  config:
    catalog:
      default:
        type: rest
        uri: http://localhost:8181/catalog
        s3.access-key-id: admin
        s3.secret-access-key: password
        s3.region: us-east-1
        warehouse: demo
        s3.endpoint: http://localhost:9000
    user_ownership_property: owner
    group_ownership_property: owner
    table_pattern:
      allow:
        - nyc.taxis_v3

sink:
  type: file
  config:
    filename: "./iceberg_v3_mcps.json"
