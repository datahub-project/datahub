version: "3"
services:
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: "minio_test"
    environment:
      MINIO_ROOT_USER: "miniouser"
      MINIO_ROOT_PASSWORD: "miniopassword"
    ports:
      # Ephemeral: only the S3 API port needs host access (test process connects
      # via localhost); the web UI isn't used from the host so its mapping is
      # dropped entirely rather than left on a fixed port.
      - "9000"
    command: server /data --console-address ":9001"
