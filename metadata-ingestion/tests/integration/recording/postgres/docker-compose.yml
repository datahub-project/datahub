version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: datahub-test-postgres-recording
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      # Ephemeral: only the host test process needs to reach postgres, and letting
      # Docker pick a free port avoids colliding with a leaked container from a
      # prior run.
      - "5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

