version: "2"
services:
  testmongodb:
    image: mongo
    container_name: "testmongodb"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: examplepass
      MONGO_INITDB_DATABASE: mngdb
    ports:
      # Ephemeral: only the mongo protocol port needs host access (for ingestion),
      # and letting Docker pick a free port avoids colliding with a leaked container
      # from a prior run.
      - "27017"
    volumes:
      - ./setup/mongo_init.js:/docker-entrypoint-initdb.d/mongo_init.js:ro
      - ./setup:/setup
