# Fixture recipe: Openflow inventory (M1).
#
# Replayed offline via datahub/ingestion/recording, which patches
# snowflake.connector.connect. Recording requires an Openflow-provisioned
# account; until then this recipe is the declared contract, not a runnable test.
source:
  type: snowflake-openflow
  config:
    connection:
      account_id: ${SNOWFLAKE_ACCOUNT}
      username: ${SNOWFLAKE_USER}
      private_key: ${SNOWFLAKE_PRIVATE_KEY}
      authentication_type: KEY_PAIR_AUTHENTICATOR
      role: ${SNOWFLAKE_ROLE}
      warehouse: ${SNOWFLAKE_WAREHOUSE}
    # Openflow's own entities
    env: PROD
    # Coordinates of the FOREIGN Snowflake datasets lineage points at. These must
    # match the warehouse ingestion or lineage joins to nothing.
    snowflake_env: PROD
    convert_urns_to_lowercase: true
    include_openflow_lineage: true
sink:
  type: datahub-rest
  config:
    server: ${DATAHUB_GMS_URL:-http://localhost:8080}
    token: ${DATAHUB_GMS_TOKEN}
