source:
  type: boomi-data-integration
  config:
    account_id: "${BOOMI_DI_ACCOUNT_ID}"
    # us, eu, il or au
    region: us

    # One token per environment.
    environment_tokens:
      - environment_id: "<production environment id>"
        api_token: "${BOOMI_DI_TOKEN_PROD}"
      - environment_id: "<development environment id>"
        api_token: "${BOOMI_DI_TOKEN_DEV}"
    # Or, for a single environment:
    # api_token: "${BOOMI_DI_TOKEN}"

    environment_pattern:
      allow:
        - ".*"
    river_pattern:
      deny:
        - "^tmp_.*"

    # BigQuery targets need the project of the target connection.
    connection_to_platform:
      "<bigquery connection cross_id>":
        platform: bigquery
        database: my-gcp-project

    # Recent river runs, read from the last run_history_days days (at most 14).
    include_run_history: true
    run_history_days: 7
    max_runs_per_river: 50

    stateful_ingestion:
      enabled: true

sink:
  # sink configs
