source:
  type: gitlab-documents
  config:
    gitlab_token: "${GITLAB_TOKEN}"
    # Omit base_url for GitLab.com.
    base_url: https://gitlab.example.com
    repositories:
      - acme/handbook
    # To ingest every project in a group as well, set group:
    # group: acme/data
    branch: main
    path_prefix: docs
    file_extensions:
      - .md
      - .txt
    parent_document_urn: null
    create_repo_root_document: true
    max_files: 500
    document_import_mode: NATIVE
    show_in_global_context: true
    stateful_ingestion:
      enabled: true

sink:
  type: datahub-rest
  config:
    server: "http://localhost:8080"
