# Example recipe for Fabric Data Factory source
# See README.md for full configuration options

source:
  type: fabric-data-factory
  config:
    # Authentication (using service principal)
    credential:
      authentication_method: service_principal
      client_id: ${AZURE_CLIENT_ID}
      client_secret: ${AZURE_CLIENT_SECRET}
      tenant_id: ${AZURE_TENANT_ID}

    # Optional: Filter workspaces by name pattern
    workspace_pattern:
      allow:
        - ".*" # Allow all workspaces by default
      deny: []

    # Optional: Filter pipelines by name pattern
    pipeline_pattern:
      allow:
        - ".*" # Allow all pipelines by default
      deny: []

    # Item default identity as a DataHub owner. ownership_type is
    # TECHNICAL_OWNER, BUSINESS_OWNER, DATA_STEWARD, NONE, or
    # urn:li:ownershipType:<id>. cascade_ownership copies the owner onto
    # activities that have none of their own.
    # extract_owners:
    #   enabled: true
    #   ownership_type: TECHNICAL_OWNER
    #   cascade_ownership: true

    # Sensitivity label on the pipeline. The label GUID comes from
    # GET /workspaces/{workspaceId}/items/{itemId}. The name and description
    # come from Microsoft Graph. output is tag or glossary_term. A glossary
    # term's description is the label description.
    # extract_sensitivity_label:
    #   enabled: false
    #   output: tag

    # Feature flags
    extract_pipelines: true
    include_lineage: true
    include_execution_history: true
    execution_history_days: 7 # 1-90 days

    # Optional: Map Fabric connection names to platform instances for accurate lineage
    # platform_instance_map:
    #   "my-snowflake-connection": "prod_snowflake"
    #   "my-bigquery-connection": "analytics_project"

    # Optional: Platform instance for this Fabric Data Factory connector
    # platform_instance: "my-fabric-tenant"

    # Environment
    env: PROD

    # Optional: Stateful ingestion for stale entity removal
    # stateful_ingestion:
    #   enabled: true

sink:
  type: datahub-rest
  config:
    server: "http://localhost:8080"
    token: ${DATAHUB_GMS_TOKEN}
