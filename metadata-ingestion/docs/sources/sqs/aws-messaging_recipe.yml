source:
  type: aws-messaging
  config:
    aws_config:
      aws_region: "us-east-1"
      # aws_role: "arn:aws:iam::123456789012:role/datahub-read"
    # platform_instance defaults to the AWS account id.
    env: "PROD"

    include_sqs: true
    queue_pattern:
      deny:
        - ".*-tmp$"
    include_sns: true
    topic_pattern:
      allow:
        - ".*"

    extract_tags: true
    include_subscription_attributes: true
    # Platform instances used by other accounts' recipes, for cross-account lineage.
    # account_platform_instance_map:
    #   "210987654321": "shared-services"

    stateful_ingestion:
      enabled: true
