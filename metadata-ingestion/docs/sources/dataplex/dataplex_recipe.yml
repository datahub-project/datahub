source:
  type: dataplex
  config:
    # GCP project selection — set at least one of project_ids, project_id_pattern,
    # or project_labels. project_ids takes precedence and skips Resource Manager
    # API calls; the pattern/labels options auto-discover projects (require
    # roles/browser or any role granting resourcemanager.projects.get on the
    # candidate projects).
    project_ids:
      - "my-gcp-project"

    # Optional: regex allow/deny patterns to filter auto-discovered projects.
    # Ignored when project_ids is set explicitly.
    # project_id_pattern:
    #   allow:
    #     - "^prod-.*"
    #   deny:
    #     - "-sandbox$"

    # Optional: filter discovered projects by GCP labels in `key:value` form.
    # Ignored when project_ids is set explicitly.
    # project_labels:
    #   - "env:prod"

    # Optional: GCP location(s) for entries (Universal Catalog)
    # Use multi-region locations (us, eu, asia) to access system entry groups like @bigquery
    # Default: ["us", "eu", "asia", "global"]
    entries_locations:
      - "us"

    # Optional: Environment (default: PROD)
    env: "PROD"

    # Optional: GCP credentials (if not using Application Default Credentials)
    # credential:
    #   project_id: "my-gcp-project"
    #   private_key_id: "d0121d0000882411234e11166c6aaa23ed5d74e0"
    #   private_key: "-----BEGIN PRIVATE KEY-----\nMIIyourkey\n-----END PRIVATE KEY-----\n"
    #   client_email: "test@suppproject-id-1234567.iam.gserviceaccount.com"
    #   client_id: "123456678890"

    # Optional: Metadata extraction
    # include_lineage: true   # Extract lineage (default: true)
    # include_schema: true    # Extract schema metadata (default: true)

    # Optional: Column-level lineage. Requires include_lineage and
    # include_schema; multiplies Data Lineage API read volume.
    # include_column_lineage: true

    # Optional: upstreams the Data Lineage API reports that are not catalog
    # entries (GCS buckets, cluster-local hive tables, Pub/Sub subscriptions).
    # include_storage_lineage: true         # bucket -> table edge from the storage aspect
    # resolve_pubsub_subscriptions: true    # needs roles/pubsub.viewer
    # include_hive_metastore_nodes: true    # default: true
    # dpms_hive_metastore_service: "my-gcp-project.us-west1.my-service"

    # Optional: materialize minimal entities for upstreams that are not
    # ingested, so the nodes render in the UI lineage graph.
    # include_lineage_only_upstreams: true

    # Optional: set to false for sticky lineage — merge new edges with the
    # previously persisted aspect instead of overwriting it.
    # remove_stale_lineage: true

    # Optional: Extraction method (default: api)
    # Use 'export' for central-catalog / federated setups where assets surface
    # in a catalog project via Dataplex catalog linking and list_entries returns
    # nothing. One metadata export job runs per entries location; each location
    # must resolve to a GCS bucket.
    # extraction_method: export
    # export_config:
    #   export_job_runner_project: "my-runner-project" # needs roles/dataplex.metadataJobOwner
    #   bucket_base_name: "my-export-bucket" # bucket per location: {base}-{location}
    #   # export_bucket_config: # explicit per-location buckets (take priority)
    #   #   us: "my-export-bucket-us"
    #   # prefix: "dataplex-exports" # optional folder prefix inside each bucket (max 128 chars)
    #   # export_poll_seconds: 15
    #   # export_timeout_seconds: 3600

    # Or: ingest exports you orchestrate yourself instead of submitting jobs
    # (only needs roles/storage.objectViewer on the buckets).
    # extraction_method: read_export
    # read_export_config:
    #   export_paths:
    #     us: "gs://my-export-bucket-us/dataplex-exports"

    # Optional: Lineage retry and rate-limit settings
    # lineage_max_retries: 3                    # Max retry attempts (range: 1-20, default: 3)
    # lineage_retry_backoff_multiplier: 1.0     # Backoff delay multiplier (range: 0.1-30.0, default: 1.0)
    # lineage_retry_max_wait_seconds: 65        # Backoff cap, just past the 60s quota window
    # lineage_max_calls_per_minute: 1000        # Client-side Data Lineage API read ceiling
    # glossary_lookup_max_calls_per_minute: 600 # Same, for lookupEntryLinks reads

    # Optional: Filtering patterns for entries
    # filter_config:
    #   entries:
    #     pattern:
    #       allow:
    #         - "bq_.*"      # Allow BigQuery entries
    #         - "pubsub_.*"  # Allow Pub/Sub entries
    #       deny:
    #         - ".*_test"    # Deny test entries
    #         - ".*_temp"    # Deny temporary entries

    # Optional: Performance tuning
    # batch_size: 1000 # Entries per batch for memory optimization (default: 1000)

sink:
  type: datahub-rest
  config:
    server: "http://localhost:8080"
