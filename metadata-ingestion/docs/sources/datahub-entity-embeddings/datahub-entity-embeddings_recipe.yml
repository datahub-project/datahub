source:
  type: datahub-entity-embeddings
  config:
    # Embeds every type in the server's ELASTICSEARCH_SEMANTIC_SEARCH_ENTITIES
    # except document, which datahub-documents handles, using the server's
    # embedding configuration. Adding a type there needs no recipe change.

    # Optional: skip some types the server enables.
    # exclude_entity_types:
    #   - "dataJob"

    # Optional: skip entities from some platforms (platform names, regex).
    # platform_pattern:
    #   deny:
    #     - "^kafka$"

    # On a schedule, stop before the job's deadline so the checkpoint is
    # committed; the next run continues where this one stopped.
    time_budget_seconds: 3000

    # Optional: entities embedded per minute (default 300), to stay under an
    # external provider's quota. In-process providers are not rate limited.
    # embedding:
    #   documents_per_minute: 300

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
    token: "${DATAHUB_GMS_TOKEN}"
