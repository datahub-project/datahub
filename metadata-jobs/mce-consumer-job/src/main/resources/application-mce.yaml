server:
  port: 9090
management:
  endpoints:
    web:
      exposure:
        include: prometheus, metrics, health, info
  health:
    elasticsearch:
      enabled: false
    neo4j:
      enabled: false
spring:
  mvc:
    servlet:
      path: /
  main:
    allow-bean-definition-overriding: true
ingestion:
  enabled: false
# Non-GMS cache defaults. ENTITY_GRAPH_CACHE_ENABLED and the other env vars still override.
datahub:
  gms:
    uri: http://localhost:9090${DATAHUB_GMS_BASE_PATH}/gms
    entityGraphCache:
      enabled: ${ENTITY_GRAPH_CACHE_ENABLED:false}
    rateLimits:
      endpoint:
        enabled: ${RATE_LIMITS_ENDPOINT_ENABLED:false}
      scoped:
        enabled: ${RATE_LIMITS_SCOPED_ENABLED:false}
searchService:
  cacheImplementation: ${SEARCH_SERVICE_CACHE_IMPLEMENTATION:caffeine}
