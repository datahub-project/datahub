server.port=9091
management.endpoints.web.exposure.include=prometheus, metrics, health, info
spring.mvc.servlet.path=/
management.health.elasticsearch.enabled=false
management.health.neo4j.enabled=false
entityClient.impl=restli
# Standalone MCL consumer. Startup forces client, so DATAHUB_RUNTIME_ROLE cannot change it.
datahub.runtime.role=client
# GMS usage scheduler. Standalone MCP honors USAGE_AGGREGATION_ENABLED for queue-path metrics.
datahub.usage.aggregation.enabled=false
