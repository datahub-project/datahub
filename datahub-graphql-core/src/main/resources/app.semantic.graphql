# Semantic Search Configuration Extensions

"""
Configuration for semantic search including embedding generation settings
"""
type SemanticSearchConfig {
  """
  Whether semantic search is enabled on the server
  """
  enabled: Boolean!

  """
  Entity types that support semantic search (e.g., ["document"])
  """
  enabledEntities: [String!]!

  """
  True when this server accepts a JSON Patch that updates one embeddings key and leaves the others.
  Set even when embeddingConfig is absent. Older servers omit the field.
  """
  semanticContentPatchSupported: Boolean

  """
  True when this server generates embeddings for the active service profile. Older servers omit
  the field, which clients read as false.
  """
  generationEnabled: Boolean

  """
  Embeddings key of the active service profile, the one profile this server generates when
  generationEnabled is true. A writer skips only that key; a connector-owned key keeps embedding.
  Null when no service profile is active. Older servers omit the field.
  """
  serviceProfileKey: String

  """
  Embedding generation configuration (nullable when semantic search is disabled)
  """
  embeddingConfig: EmbeddingConfig
}

"""
Embedding model configuration for generating semantic search vectors.
Only includes minimal settings required for clients to match server embedding behavior.
"""
type EmbeddingConfig {
  """
  Embedding provider type (e.g., "aws-bedrock")
  """
  provider: String!

  """
  Model identifier (e.g., "cohere.embed-english-v3")
  """
  modelId: String!

  """
  Embedding storage key for SemanticContent aspects (e.g., "cohere_embed_v3").
  This is the canonical key used in the embeddings map when storing SemanticContent aspects.
  Server-provided to ensure exact match between client (writing) and server (querying).
  """
  modelEmbeddingKey: String!

  """
  True when this server accepts a JSON Patch that updates one embeddings key and leaves the others.
  Older servers omit the field; writers then replace the whole aspect.
  """
  semanticContentPatchSupported: Boolean

  """
  AWS Bedrock-specific configuration (only populated when provider is "aws-bedrock")
  """
  awsProviderConfig: AwsProviderConfig

  """
  Google Vertex AI-specific configuration (only populated when provider is "vertex_ai")
  """
  vertexProviderConfig: VertexProviderConfig
}

"""
AWS Bedrock provider-specific configuration
"""
type AwsProviderConfig {
  """
  AWS region where Bedrock is accessed (e.g., "us-west-2")
  """
  region: String!
}

"""
Google Vertex AI provider-specific configuration
"""
type VertexProviderConfig {
  """
  GCP project ID where Vertex AI is enabled
  """
  projectId: String!

  """
  GCP region for the Vertex AI endpoint (e.g., "us-east1", "us-central1")
  """
  location: String!
}

type EntityIndexV3Config {
  """
  Whether Search V3 entity indices are enabled on the server
  """
  enabled: Boolean!
}

# Extend AppConfig with semantic search configuration
extend type AppConfig {
  """
  Semantic search and embedding configuration
  """
  semanticSearchConfig: SemanticSearchConfig

  """
  Search V3 entity-index configuration. Embedding generation stays gated on
  semanticSearchConfig; this flag only indicates GMS will also write document
  embeddings onto documentindex_v3 when both are on.
  """
  entityIndexV3: EntityIndexV3Config
}
