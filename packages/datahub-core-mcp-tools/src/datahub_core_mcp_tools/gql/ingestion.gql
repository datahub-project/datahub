# Ingestion sources: the ingestion tool group's reads and writes. All exist on
# GMS 1.7.0.

query getIngestionSource($urn: String!) {
  ingestionSource(urn: $urn) {
    urn
    name
    type
    source {
      type
    }
    config {
      recipe
      executorId
      version
      debugMode
      extraArgs {
        key
        value
      }
    }
    schedule {
      interval
      timezone
    }
  }
}

query listIngestionSources($input: ListIngestionSourcesInput!) {
  listIngestionSources(input: $input) {
    total
    ingestionSources {
      urn
      name
      type
      schedule {
        interval
        timezone
      }
      executions(start: 0, count: 1) {
        executionRequests {
          urn
          result {
            status
            startTimeMs
            durationMs
          }
        }
      }
    }
  }
}

mutation createIngestionSource($input: UpdateIngestionSourceInput!) {
  createIngestionSource(input: $input)
}

# Replaces the source's whole info aspect: the caller sends every field it
# means to keep.
mutation updateIngestionSource(
  $urn: String!
  $input: UpdateIngestionSourceInput!
) {
  updateIngestionSource(urn: $urn, input: $input)
}

# Ingestion runs (execution requests).

mutation createIngestionExecutionRequest(
  $input: CreateIngestionExecutionRequestInput!
) {
  createIngestionExecutionRequest(input: $input)
}

mutation createTestConnectionRequest($input: CreateTestConnectionRequestInput!) {
  createTestConnectionRequest(input: $input)
}

query listIngestionExecutions($urn: String!, $start: Int!, $count: Int!) {
  ingestionSource(urn: $urn) {
    urn
    name
    executions(start: $start, count: $count) {
      total
      executionRequests {
        urn
        input {
          requestedAt
        }
        result {
          status
          startTimeMs
          durationMs
        }
      }
    }
  }
}

# Polled while a connection test runs: no report, which can be large.
query getExecutionStatus($urn: String!) {
  executionRequest(urn: $urn) {
    urn
    result {
      status
    }
  }
}

query getExecution($urn: String!) {
  executionRequest(urn: $urn) {
    urn
    input {
      task
      requestedAt
      source {
        type
        ingestionSource
      }
    }
    result {
      status
      startTimeMs
      durationMs
      report
      structuredReport {
        type
        serializedValue
      }
    }
  }
}
