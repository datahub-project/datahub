# Keyword search over Document entities, for search_documents. Returns metadata,
# not content: grep_documents reads a document's body.

fragment DocumentSearchInfo on Document {
  urn
  subType
  platform {
    urn
    name
  }
  info {
    title
    source {
      sourceType
      externalUrl
    }
    # Shown as a date (see freshness.py).
    lastModified {
      time
    }
  }
  domain {
    domain {
      urn
      properties {
        name
      }
    }
  }
  tags {
    tags {
      tag {
        urn
        properties {
          name
        }
      }
    }
  }
  glossaryTerms {
    terms {
      term {
        urn
        properties {
          name
        }
      }
    }
  }
}

fragment DocumentFacetEntityInfo on Entity {
  ... on GlossaryTerm {
    properties {
      name
    }
  }
  ... on Domain {
    properties {
      name
    }
  }
}

query documentSearch(
  $query: String!
  $orFilters: [AndFilterInput!]
  $count: Int!
  $start: Int!
  $viewUrn: String
  $searchFlags: SearchFlags
) {
  searchAcrossEntities(
    input: {
      query: $query
      count: $count
      start: $start
      types: [DOCUMENT]
      orFilters: $orFilters
      viewUrn: $viewUrn
      searchFlags: $searchFlags
    }
  ) {
    start
    count
    total
    searchResults {
      entity {
        ... on Document {
          ...DocumentSearchInfo
        }
      }
    }
    facets {
      field
      displayName
      aggregations {
        value
        count
        displayName
        entity {
          ...DocumentFacetEntityInfo
        }
      }
    }
  }
}
