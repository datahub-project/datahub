# The queries that reference a dataset or column, for get_dataset_queries.
fragment platformFields on DataPlatform {
  urn
  name
  __typename
}

fragment query on QueryEntity {
  urn
  properties {
    name
    description
    source
    statement {
      value
      language
    }
    customProperties {
      key
      value
    }
    origin {
      urn
      type
    }
    lastModified {
      actor
    }
  }
  platform {
    ...platformFields
  }
  subjects {
    dataset {
      urn
      type
      ... on Dataset {
        name
      }
    }
    schemaField {
      urn
      type
      fieldPath
    }
  }
}

query listQueries($input: ListQueriesInput!) {
  listQueries(input: $input) {
    start
    total
    count
    queries {
      ...query
    }
  }
}
