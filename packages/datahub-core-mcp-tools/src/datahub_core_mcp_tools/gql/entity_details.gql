            showInGlobalContext
        }
        ownership {
            ...ownershipFields
        }
        tags {
            ...globalTagsFields
        }
        glossaryTerms {
            ...glossaryTerms
        }
        domain {
            ...entityDomain
        }
        structuredProperties {
            properties {
                ...structuredPropertiesFields
            }
        }
    }
    ... on Metric {
        urn
        type
        platform {
            ...platformFields
        }
        info {
            name
            description
            externalUrl
            expression {
                dialects {
                    dialect
                    expression
                }
            }
        }
        semanticModel {
            urn
            type
            ...entityDisplayNameFields
            platform {
                ...platformFields
            }
        }
        metricRelationships {
            derivedFrom {
                destination {
                    urn
                    type
                    ...entityDisplayNameFields
                }
            }
            relatedMetrics {
                destination {
                    urn
                    type
                    ...entityDisplayNameFields
                }
            }
        }
        metricUpstreams {
            datasetUpstreams {
                destination {
                    urn
                    type
                    ...entityDisplayNameFields
                }
            }
            fieldUpstreams {
                destination {
                    urn
                    type
                    ... on SchemaFieldEntity {
                        fieldPath
                    }
                }
            }
        }
        documentation {
            ...documentationFields
        }
        ownership {
            ...ownershipFields
        }
        tags {
            ...globalTagsFields
        }
        glossaryTerms {
            ...glossaryTerms
        }
        structuredProperties {
            properties {
                ...structuredPropertiesFields
            }
        }
        domain {
            ...entityDomain
        }
        deprecation {
            ...deprecationFields
        }
        subTypes {
            typeNames
        }
    }
    ... on SemanticModel {
        urn
        type
        platform {
            ...platformFields
        }
        info {
            name
            description
            externalUrl
            nativeDefinition
            relationships {
                name
                from
                fromColumns
                to
                toColumns
                cardinality
            }
        }
        documentation {
            ...documentationFields
        }
        ownership {
            ...ownershipFields
        }
        tags {
            ...globalTagsFields
        }
        glossaryTerms {
            ...glossaryTerms
        }
        structuredProperties {
            properties {
                ...structuredPropertiesFields
            }
        }
        domain {
            ...entityDomain
        }
        deprecation {
            ...deprecationFields
        }
        subTypes {
            typeNames
        }
    }
}

fragment documentationFields on Documentation {
    documentations {
        documentation
        attribution {
            # time
            # actor {
            #   urn
            #   type
            #   ...entityDisplayNameFields
            # }
            # source {
            #   urn
            #   type
            # }
            sourceDetail {
                key
                value
            }
        }
    }
}

fragment businessAttribute on BusinessAttributeAssociation {
    businessAttribute {
        urn
        type
        ownership {
            ...ownershipFields
        }
        properties {
            name
            description
            businessAttributeDataType: type
            lastModified {
                time
            }
            created {
                time
            }
            tags {
                ...globalTagsFields
            }
            glossaryTerms {
                ...glossaryTerms
            }
        }
    }
}

fragment structuredPropertyFields on StructuredPropertyEntity {
    urn
    definition {
        displayName
        qualifiedName
    }
    __typename
}

fragment structuredPropertyDetailsFields on StructuredPropertyEntity {
    urn
    type
    definition {
        displayName
        qualifiedName
        description
        cardinality
        immutable
        valueType {
            urn
            info {
                displayName
            }
        }
        entityTypes {
            urn
        }
        cardinality
        typeQualifier {
            allowedTypes {
                urn
                type
                info {
                    type
                    displayName
                }
            }
        }
        allowedValues {
            value {
                ... on StringValue {
                    stringValue
                }
                ... on NumberValue {
                    numberValue
                }
            }
            description
        }
        created {
            time
            actor {
                urn
                editableProperties {
                    displayName
                }
                ...entityDisplayNameFields
            }
        }
        lastModified {
            time
            actor {
                urn
                editableProperties {
                    displayName
                }
                ...entityDisplayNameFields
            }
        }
    }
    settings {
        isHidden
        showInSearchFilters
        showAsAssetBadge
        showInAssetSummary
        showInColumnsTable
    }
}

fragment structuredPropertiesFields on StructuredPropertiesEntry {
    structuredProperty {
        ...structuredPropertyFields
    }
    values {
        ... on StringValue {
            stringValue
        }
        ... on NumberValue {
            numberValue
        }
    }
    valueEntities {
        urn
        type
        ...entityDisplayNameFields
    }
}

fragment entitySchemaFieldEntityFields on SchemaFieldEntity {
    # Identity fields are already included outside of this fragment.
    # urn
    # fieldPath
    # type
    deprecation {
        ...deprecationFields
    }
    structuredProperties {
        properties {
            ...structuredPropertiesFields
        }
    }
    businessAttributes {
        businessAttribute {
            ...businessAttribute
        }
    }
    # Role and expression for a column of a Semantic Model Dataset. This fragment
    # is the per-column selection and the direct schemaField lookup, so both
    # return the same annotation.
    semanticFieldAnnotation {
        type
        aggregationFunction
        expression {
            dialects {
                dialect
                expression
            }
        }
        dimension {
            isTime
        }
    }
    documentation {
        ...documentationFields
    }
}

fragment entitySchemaFieldFields on SchemaField {
    fieldPath
    label
    jsonPath
    nullable
    description
    # type
    nativeDataType
    recursive
    isPartOfKey
    isPartitioningKey
    tags {
        ...globalTagsFields
    }
    glossaryTerms {
        ...glossaryTerms
    }
    schemaFieldEntity {
        ...entitySchemaFieldEntityFields
    }
}

fragment schemaMetadataFields on SchemaMetadata {
    createdAt
    datasetUrn
    name
    platformUrn
    cluster
    platformSchema {
        ... on TableSchema {
            schema
        }
        ... on KeyValueSchema {
            keySchema
            valueSchema
        }
    }
    fields {
        ...entitySchemaFieldFields
    }
    primaryKeys
    foreignKeys {
        name
        sourceFields {
            fieldPath
        }
        foreignFields {
            fieldPath
        }
        foreignDataset {
            urn
            name
            type
            properties {
                description
            }
            platform {
                ...platformFields
            }
            ownership {
                ...ownershipFields
            }
            tags {
                ...globalTagsFields
            }
            glossaryTerms {
                ...glossaryTerms
            }
        }
    }
}

fragment datasetSchema on Dataset {
    schemaMetadata(version: 0) {
        ...schemaMetadataFields
    }
    editableSchemaMetadata {
        editableSchemaFieldInfo {
            fieldPath
            description
            tags {
                ...globalTagsFields
            }
            glossaryTerms {
                ...glossaryTerms
            }
        }
    }
}

fragment viewProperties on Dataset {
    viewProperties {
        materialized
        logic
        # formattedLogic
        language
    }
}

fragment dataContractAssertionSummary on Assertion {
    urn
    info {
        type
        description
    }
    # PASSING, FAILING, ERROR or INIT: the per-member status the contract tab counts.
    assertionStatus #[since cloud=0.3.17]
    runEvents(status: COMPLETE, limit: 1) {
        runEvents {
            timestampMillis
            result {
                type
                actualAggValue
            }
        }
    }
}

fragment entityDetails on Entity {
    ... on Dataset {
        ...datasetSchema
        ...viewProperties
        # Non-null only when the dataset has siblings, so GetEntitySiblings below is
        # sent for those datasets alone.
        siblings {
            isPrimary
        }
        # Sent only when get_entities names `contract`: the lookup walks the graph, and
        # a failure there would fail the whole dataset read. Null when the dataset has
        # no contract, or when the contract's graph link to the dataset is missing.
        contract @include(if: $includeContract) {
            urn
            status {
                state
            }
        }
    }
    ... on StructuredPropertyEntity {
        ...structuredPropertyFields
        ...structuredPropertyDetailsFields
    }
    ... on Container {
        properties {
            description
            __typename
        }
        editableProperties {
            description
            __typename
        }
    }
    ... on SchemaFieldEntity {
        fieldPath
        parent {
            urn
            type
        }
        ...entitySchemaFieldEntityFields
    }
}

query GetEntity(
    $urn: String!
    $includeContract: Boolean = false
) {
    entity(urn: $urn) {
        urn
        ...entityPreview
        ...entityDetails
    }
}

# The documentation-bearing parts of a dataset's siblings, which sibling_merge.py folds
# into the dataset. A separate operation so that only datasets with siblings pay for
# the sibling search. The search arguments are the UI dataset page's, so the agent sees
# the siblings a user sees.
query GetEntitySiblings($urn: String!) {
    entity(urn: $urn) {
        urn
        ... on Dataset {
            siblingsSearch(input: { query: "*", count: 5 }) {
                searchResults {
                    entity {
                        urn
                        ... on Dataset {
                            siblings {
                                isPrimary
                            }
                            properties {
                                description
                            }
                            editableProperties {
                                description
                            }
                            documentation { #[since cloud=0.3.4]
                                ...documentationFields
                            }
                            tags {
                                ...globalTagsFields
                            }
                            glossaryTerms {
                                ...glossaryTerms
                            }
                            schemaMetadata(version: 0) {
                                fields {
                                    fieldPath
                                    description
                                    tags {
                                        ...globalTagsFields
                                    }
                                    glossaryTerms {
                                        ...glossaryTerms
                                    }
                                    schemaFieldEntity {
                                        documentation {
                                            ...documentationFields
                                        }
                                    }
                                }
                            }
                            editableSchemaMetadata {
                                editableSchemaFieldInfo {
                                    fieldPath
                                    description
                                    tags {
                                        ...globalTagsFields
                                    }
                                    glossaryTerms {
                                        ...glossaryTerms
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}
