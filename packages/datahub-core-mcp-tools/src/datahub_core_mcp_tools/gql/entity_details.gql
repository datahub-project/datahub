        ...domainEntitiesFields
        displayProperties {
            ...displayPropertiesFields
            __typename
        }
        __typename
    }
    __typename
}

# The domain's identity only. entityDomain also pulls domainEntitiesFields: two
# entity searches and a relationship count per entity, unbatched. Branches that
# can come back many at a time (glossary walks, lineage) use this one instead.
fragment entityDomainSummary on DomainAssociation {
    domain {
        urn
        properties {
            name
        }
    }
}

fragment entityDataProduct on Entity {
    dataProduct: relationships(
        input: {
            types: ["DataProductContains"]
            direction: INCOMING
            start: 0
            count: 1
        }
    ) {
        relationships {
            type
            entity {
                urn
                type
                ... on DataProduct {
                    properties {
                        name
                        description
                        __typename
                    }
                    domain {
                        ...entityDomain
                        __typename
                    }
                    __typename
                }
                __typename
            }
            __typename
        }
        __typename
    }
    __typename
}
